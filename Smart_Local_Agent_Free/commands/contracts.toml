description = "تنظيم ومراجعة العقود والمستخلصات (IPCs) والأوامر التغييرية (VOs) والكفالات + سجل متابعة مالي"

prompt = """
قم بمراجعة وتنظيم مستندات العقود والمستخلصات والأوامر التغييرية في المجلد الحالي (تعليمات إضافية: {{args}}).

الخطوات:
1. شغّل `scan_archive.py "." --extract` لجرد كافة المستندات وملفات Excel الحالية.
2. اقرأ المستندات وصنّف كل ملف حسب العقد/المقاول ونوع المستند:
   - `01_Contract - العقد والملاحق` (العقد الأساسي، الشروط، جدول الكميات BOQ، أوامر المباشرة)
   - `02_IPCs - المستخلصات والدفعات` (رقم المستخلص، الفترة، إجمالي الأعمال التراكمي والسابق والحالي، استقطاع ضمان حسن التنفيذ Retention، استرداد الدفعة المقدمة، غرامات/خصومات، صافي المستحق، حالة التوقيعات)
   - `03_Variations - الأوامر التغييرية VOs` (رقم الأمر، الوصف، قيمة الإضافة/الحذف، حالة الاعتماد)
   - `04_Guarantees - الكفالات والتأمينات` (نوع الكفالة، البنك، القيمة، تاريخ الانتهاء للتنبيه قبل انتهائها)
3. تحقق حسابياً من معادلات المستخلصات (الأعمال الحالية − الاستقطاعات = الصافي) ونسبة الإنجاز المالي مقابل قيمة العقد المعدّلة.
4. نظّم الملفات عبر `apply_plan.py` في `Contracts_Archive - أرشيف العقود والمستخلصات` مقسماً لكل عقد/مقاول بأسماء قياسية واضحة دون لمس الأصول.
5. أنشئ أو حدّث `Contracts_IPCs_Tracker - سجل العقود والمستخلصات.xlsx` بالمعادلات الحية (قيمة العقد الأصلية + VOs المعتمدة = القيمة المعدلة، إجمالي المنصرف، المتبقي من العقد، الرصيد المحتجز Retention، وتنبيهات انتهاء الكفالات) مع روابط `HYPERLINK` مباشرة لكل ملف.
6. احذف `_agent_work/` واعرض الموقف المالي والتعاقدي الملخص وأي فروقات أو تنبيهات.
