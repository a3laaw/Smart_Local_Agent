description = "تصميم وإنشاء (أو تحويل صورة نموذج إلى) نماذج وجداول Excel احترافية بالمعادلات جاهزة للطباعة"

prompt = """
قم بتصميم وإنشاء (أو تطوير) نموذج/شيت Excel احترافي متكامل بناءً على طلب المستخدم:
{{args}}

إمكانياتك وقواعد التصميم الصارمة:
1. يمكنك استخدام القوالب والنماذج الجاهزة في `excel_toolkit.py` (`create-template` للسجلات أو `create-form` للنماذج الجاهزة للطباعة: `ipc` مستخلص جاري، `po` أمر شراء، `vo` أمر تغييري، `mir` طلب فحص واعتماد مواد/أعمال، `transmittal` حافظة تسليم مستندات، `daily_report` تقرير موقع يومي) — أو بناء أي نموذج مخصص بالكامل عبر `openpyxl` (مقايسة BOQ، تسعير، كشف عُهدة، رواتب وإضافي، حضور وانصراف، متابعة شيكات وكفالات، برنامج زمني، لوحة متابعة Dashboard... إلخ).
2. **إذا وضع المستخدم صورة أو ملف PDF لنموذج ورقي وطلب تحويله لإكسل:** اقرأ الصورة/الـ PDF بدقة عبر `render_pdf.py`، وأعد بناء النموذج بالكامل في `.xlsx` بنفس الحقول والترتيب مع إضافة المعادلات التلقائية وتنسيق الطباعة!
3. معايير الجودة الإلزامية لكل نموذج Excel:
   - اتجاه عربي صحيح `rightToLeft = True` (أو LTR للإنجليزي)، خطوط واضحة، ألوان رسمية هادئة (كحلي/رمادي فاتح)، وحدود خلايا متناسقة.
   - **معادلات Excel حية 100%** (`SUM`, `IF`, `IFERROR`, `SUMIF`, `COUNTIF`, حساب النسب المئوية، الاستقطاعات Retention، الدفعة المقدمة، الصافي) — لا تكتب نتائج ثابتة أبداً!
   - قوائم منسدلة (`DataValidation`) للحالات والأقسام لتسهيل الإدخال ومنع الأخطاء.
   - تنسيق عملة دقيق: `#,##0.000` للدينار الكويتي (KWD) و`#,##0.00` لباقي العملات، مع عرض أعمدة كافٍ يمنع ظهور `###`.
   - **جاهز للطباعة فوراً على ورق A4** (`fitToWidth = 1`, هوامش متوازنة، ترويسة متكررة، وخانات التوقيع والاعتماد والختم في أسفل النماذج الرسمية).
   - إذا كان تعديلاً على ملف موجود: خذ نسخة احتياطية أولاً وحافظ على الماكرو (`keep_vba=True`) في `.xlsm`.
4. نظّف `_agent_work/` إن وُجد، واشرح للمستخدم باختصار الخانات التي يعبّئها والمعادلات التي تحسب تلقائياً.
"""
