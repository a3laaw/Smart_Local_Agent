description = "تعبئة نماذج المشروع الأصلية (Word/Excel: اعتماد، MIR، WIR، كتاب، مستخلص، حافظة) + ترقيم وتسجيل تلقائي باللوج"

prompt = """
قم بتجهيز وتعبئة مستند جديد من نماذج المشروع الأصلية (Word `.docx` أو Excel `.xlsx/.xlsm`) مع الترقيم والتسجيل التلقائي في اللوج بناءً على طلب المستخدم:
{{args}}

نفّذ الدورة الكاملة لمراقبة الوثائق (من المنبع):
1. **تحديد النموذج الأصلي:** ابحث عن قالب المستند المطلوب في المجلد الحالي أو مجلد `Templates` أو `~/.gemini/templates/` (أو استخدم أحدث ملف Word/Excel سابق من نفس النوع كنموذج دون المساس به أبداً!). شغّل `template_filler.py inspect` لفهم كل جدول وخلية وحقل بدقة.
2. **الترقيم التلقائي بدون خطأ:** إذا وُجد سجل Excel للمشروع (`LOG.xlsm` أو `LOG.xlsx` أو `Master_Archive_Log - السجل الشامل التلقائي.xlsx`)، شغّل `template_filler.py next-ref` لمعرفة نظام ترقيم المشروع (متسلسل عام أم مستقل لكل قسم) واستخراج الرقم التالي الصحيح تلقائياً (مثلاً `EL-228` مراجعة `R00`، أو رقم الكتاب الصادر التالي، أو `IPC-05`).
3. **التعبئة الدقيقة مع حفظ التصميم والشعارات 100%:** جهّز ملف التعديلات في `_agent_work/fill_edits.json` وشغّل `fill-docx` أو `fill-xlsx` لملء كافة الحقول (الرقم المرجعي، المراجعة، تاريخ اليوم، المشروع، العقد، القسم، وصف المادة/الأعمال، المصنّع/المورد، مرجع المواصفات/المخطط، المرفقات...) دون كسر أي شعار أو جدول أو معادلة أو ماكرو.
4. **الحفظ المنظم لأصل الوورد/الإكسل:** احفظ الملف القابل للتعديل باسمه القياسي داخل مجلد منظم لأصول الوورد والإكسل (مثل `00_Editable_Originals - أصل الوورد والإكسل/<القسم>/`) ليكون جاهزاً للطباعة والتقديم فوراً ولسهولة تعديله لاحقاً عند الحاجة.
5. **التسجيل الفوري في اللوج ("تحت المراجعة / صادر"):** خذ نسخة احتياطية وسجّل المستند الجديد فوراً في لوج المشروع بحالة `Under Review` (أو `مقدم للاعتماد` / `صادر`) مع تاريخ التقديم ورابط `HYPERLINK` يفتح ملف الـ Word/Excel الأصلي — بحيث عندما تعود النسخة المختومة لاحقاً على فولدر السكانر، يتطابق رقمها مباشرةً وتُقفل حالتها تلقائياً!
6. نظّف `_agent_work/` واعرض للمستخدم الرقم المرجعي الجديد ومسار الملف الجاهز للطباعة.
"""
