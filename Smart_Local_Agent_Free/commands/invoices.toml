description = "مراجعة وأرشفة فواتير الموردين والمقاولين وكشف تكرار الصرف وبناء سجل الفواتير Excel"

prompt = """
قم بمراجعة وتدقيق وأرشفة فواتير الموردين/المقاولين في المجلد الحالي (تعليمات إضافية: {{args}}).

الخطوات:
1. افحص المجلد وفك أي أرشيفات عبر `scan_archive.py "." --extract` وافحص أي سجل Excel حالي إن وُجد.
2. اقرأ كل فاتورة (ومرفقاتها مثل أمر الشراء PO وسند الاستلام DN) واستخرج: رقم الفاتورة، التاريخ، اسم المورد/المقاول، المشروع، رقم PO، البيان، المبلغ قبل الخصم/الضريبة، الخصم أو الضريبة، الصافي المستحق، العملة (3 خانات للدينار الكويتي `0.000`)، وحالة الاعتماد/السداد.
3. دقق محاسبياً: تحقق من صحة الجمع والضرب داخل الفاتورة، واكشف فوراً أي فاتورة مكررة بنفس رقم الفاتورة والمورد حتى لو اختلف اسم الملف.
4. انسخ الفواتير المنظمة عبر `apply_plan.py` إلى `Invoices_Archive - أرشيف الفواتير` مقسماً حسب المورد (أو حسب المشروع/الشهر إذا طلب المستخدم ذلك) بأسماء قياسية `YYYY-MM-DD_المورد_INV-XXXX_المبلغ.pdf`.
5. أنشئ أو حدّث `Invoices_Register - سجل الفواتير.xlsx` مع شيت ملخص لكل مورد بمعادلات `SUMIFS`/`COUNTIF` وروابط `HYPERLINK` مباشرة لكل فاتورة + شيت الملاحظات والفروقات.
6. احذف `_agent_work/` وقدّم جدولاً ملخصاً بإجمالي الفواتير لكل مورد وأي ملاحظات تدقيق.
"""
