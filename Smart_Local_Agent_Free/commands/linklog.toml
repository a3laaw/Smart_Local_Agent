description = "مطابقة وربط أي شيت Excel موجود بملفات PDF/الصور في المجلد (روابط HYPERLINK + كشف النواقص)"

prompt = """
قم بمطابقة ملف الـ Excel الموجود في هذا المجلد مع كافة ملفات الـ PDF/الصور الموجودة وربطها بروابط مباشرة (تعليمات إضافية: {{args}}).

الخطوات:
1. شغّل `scan_archive.py "." --extract` لجرد كل الملفات، وشغّل `excel_toolkit.py inspect` و`backup` على ملف الإكسل الموجود.
2. طابق كل صف في الإكسل مع الملفات الموجودة في المجلد (وتحقق بصرياً عبر `render_pdf.py` من أي ملف مشبوه أو غير واضح الاسم).
3. أنشئ نسخة محدّثة من ملف الإكسل (`*_Linked.xlsx` أو `*_Linked.xlsm` مع الحفاظ الكامل على VBA والمعادلات والتنسيق) تتضمن عمود روابط `=HYPERLINK(...)` بمسارات نسبية تفتح كل ملف مباشرة بضغطة واحدة.
4. أصدر تقرير مطابقة `Reconciliation_Report.xlsx` من 3 شيتات:
   - سجلات موجودة في الإكسل لكن ملفها الـ PDF مفقود من المجلد.
   - ملفات موجودة في المجلد لكنها غير مسجلة في الإكسل.
   - اختلافات بين بيانات الإكسل ومحتوى الملف الفعلي (تاريخ/حالة/مبلغ/مراجعة) + الملفات المكررة.
5. احذف `_agent_work/` واعرض ملخص نسبة المطابقة والنواقص.
"""
