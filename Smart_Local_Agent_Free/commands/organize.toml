6. حدّث ملف الـ Excel الموجود (في نسخة `*_Updated` مع الحفاظ على VBA والمعادلات) أو أنشئ سجل Excel عربي احترافي منسق RTL مع روابط `HYPERLINK` تفتح كل ملف مباشرة، بالإضافة إلى تقرير التعديلات/المكررات.
7. احذف المجلد المؤقت `_agent_work/` واعرض لي تقريراً عربياً مختصراً وواضحاً بالأرقام والمجلدات الناتجة.
