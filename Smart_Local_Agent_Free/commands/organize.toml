description = "تنظيم ذكي شامل لأي مجلد (فك ضغط + قراءة الملفات + إزالة التكرار + إعادة تسمية + فرز مجلدات + شيت Excel)"

prompt = """
قم بتنفيذ عملية التنظيم والأرشفة الذكية الشاملة للمجلد الحالي (مع مراعاة تعليمات المستخدم الإضافية إن وُجدت: {{args}}).

اتبع الخطوات بالترتيب الدقيق:
1. شغّل أداة الفحص المحلية `scan_archive.py` من مجلد `.gemini/doc_tools` في مسار المستخدم (`%USERPROFILE%\\.gemini\\doc_tools\\` على ويندوز أو `$HOME/.gemini/doc_tools/` على ماك/لينكس) مع الخيار `"." --extract` لفك أي ملفات RAR/ZIP/7Z وكشف التكرار وجرد المحتويات.
2. تعرّف تلقائياً على طبيعة المشروع وأنواع المستندات الموجودة (اعتمادات، فواتير، عُهدة، كتب صادر/وارد، عقود، مستخلصات، مخططات، أو خليط منها) وافحص أي ملف Excel موجود دون المساس بالأصل.
3. للملفات الممسوحة ضوئياً (Scanned PDFs) أو ذات الأسماء الغامضة/المتعارضة، حوّل صفحاتها بأداة `render_pdf.py` واقرأ محتواها الفعلي (الرقم، التاريخ، الجهة، الموضوع/المبلغ، التوقيع/الختم).
4. صمّم هيكل مجلدات منطقي ونظيف يناسب هذا المشروع تحديداً، وجهّز خطة `_agent_work/plan.json` بحيث:
