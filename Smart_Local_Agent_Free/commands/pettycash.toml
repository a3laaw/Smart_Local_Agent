description = "فرز فواتير وصور العُهدة النقدية (Petty Cash) وإصدار كشف تسوية عهدة Excel بالمعادلات والروابط"

prompt = """
قم بمراجعة وفرز فواتير وإيصالات العُهدة الموجودة في هذا المجلد وإعداد كشف تسوية عُهدة جاهز للاعتماد (تفاصيل إضافية مثل قيمة العهدة المستلمة أو اسم الموظف/المشروع: {{args}}).

الخطوات:
1. شغّل `scan_archive.py "." --extract` لجرد كل الصور (JPG/PNG/WhatsApp) وملفات PDF والإكسل وكشف الصور المكررة.
2. اقرأ كل فاتورة/إيصال بصرياً (ولملفات PDF الممسوحة استخدم `render_pdf.py`) واستخرج بدقة:
   - تاريخ الفاتورة، رقم الفاتورة، اسم المحل/المورد، البيان التفصيلي، تصنيف البند (مواد موقع، عدد وأدوات، محروقات ونقل، قرطاسية، ضيافة، صيانة، رسوم حكومية...)، طريقة الدفع (نقدي / K-Net / تحويل)، والمبلغ الإجمالي الصحيح.
   - انتبه للعملة: الدينار الكويتي (د.ك / KWD) بثلاث خانات عشرية `0.000` (فلس)، وباقي العملات بخانتين `0.00`. إذا وُجدت أكثر من عملة افصلها بوضوح.
   - نبّه على أي فاتورة مكررة، أو بدون تاريخ، أو غير واضحة، أو فيها خطأ جمع، أو إيصال كي-نت مرفق بفاتورته (لا تحسبه مرتين!).
3. رتّب الفواتير زمنياً وانسخها عبر `apply_plan.py` إلى مجلد `Petty_Cash_Organized - مرفقات العهدة` بأسماء متسلسلة نظيفة مثل: `001_2026-11-05_اسم-المورد_12.500KD.pdf` (أو امتداد الصورة الأصلي)، وضع المكرر أو غير المقروء في مجلد مراجعة منفصل دون حذف أي أصل.
4. أنشئ كشف `Petty_Cash_Settlement - كشف تسوية العهدة.xlsx` احترافي RTL يحتوي على:
   - شيت التسوية التفصيلي بمعادلات `SUM` حية وحساب (العهدة المستلمة − إجمالي المنصرف = المتبقي/العجز) وعمود `HYPERLINK` يفتح كل فاتورة بضغطة.
   - شيت ملخص المصروفات حسب البند وحسب المشروع بمعادلات `SUMIF` + شيت ملاحظات التدقيق والفواتير المستبعدة.
5. احذف `_agent_work/` واعرض ملخص العُهدة النهائي والتنبيهات المحاسبية.
"""
