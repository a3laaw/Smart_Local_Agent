description = "قراءة كتاب وارد (PDF ممسوح أو صورة) وصياغة كتاب الرد الرسمي عليه بصيغة Word (.docx)"

prompt = """
قم بقراءة الكتاب الوارد الموجود في المجلد وإعداد كتاب رد رسمي احترافي عليه بصيغة Word (`.docx`) بناءً على توجيه المستخدم:
{{args}}

