1. حدّد الكتاب الوارد المطلوب الرد عليه في المجلد الحالي، وإذا كان PDF ممسوحاً ضوئياً حوّله لصور عبر `render_pdf.py` واقرأه بالكامل بدقة (رقم الكتاب، تاريخه، الجهة المرسلة، الموقّع، المشروع/العقد، الموضوع، وكل نقطة أو ملاحظة أو مطالبة وردت فيه).
