description = "مراجعة وأرشفة الاعتمادات الهندسية لأي مشروع (Submittals / MIR / WIR / Shop Drawings) + تحديث اللوج"

prompt = """
قم بمراجعة وتدقيق وأرشفة الاعتمادات الهندسية في المجلد الحالي (تعليمات إضافية من المستخدم: {{args}}).

نفّذ سير العمل الكامل بدقة مراقب وثائق محترف:
1. شغّل `scan_archive.py "." --extract` لجرد كافة الملفات وفك أي أرشيفات RAR/ZIP، ثم شغّل `excel_toolkit.py inspect` على أي ملف Log موجود (سواء `.xlsx` أو `.xlsm`) وتعرّف تلقائياً على نظام الترقيم والأقسام (مدني، كهرباء، صحي، تكييف، حريق، مصاعد، معماري... إلخ) والجهات (استشاري، مالك، وزارة، بلدية...) في هذا المشروع.
2. افحص المستندات فعلياً (واستخدم `render_pdf.py` لقراءة الملفات الممسوحة ضوئياً والملفات ذات الأسماء المشبوهة أو بدون رقم قسم أو المراجعات `R01/R02`):
   - تحقق من الكود الحقيقي، رقم المراجعة `Rev`، القسم الصحيح، المادة/المورد، تاريخ الاعتماد، وكود الحالة الفعلي (`A / B / C / D` أو Approved / Rejected / Under Review).
   - اكتشف الملفات المسماة خطأً وصحّحها وفق المحتوى الفعلي داخل المستند.
   - عند التكرار: احتفظ بالنسخة ذات الصفحات الأكثر (المرفق معها خطاب/نموذج الاعتماد) ثم النسخة المختومة والأوضح.
   - النسخ القديمة (`قبل التعديل` / `Superseded`): إذا كانت النسخة الوحيدة للاعتماد اعتمدها بالاسم الصحيح، وإذا وُجدت نسخة معدّلة أحدث فاحفظ القديمة في مجلد فرعي `_قبل التعديل (Superseded)`.
3. افرز الملفات عبر `apply_plan.py` في مجلد `Submittals_By_Discipline - اعتمادات الأقسام` مقسماً حسب أقسام المشروع وبداخل كل قسم مجلدات الجهات المعتمدة، وتحقق 100% من مطابقة الأعداد.
4. إذا وُجد Log سابق: خذ نسخة احتياطية وأنشئ نسخة محدّثة (`*_Updated.xlsm` مع `keep_vba=True` أو `*_Updated.xlsx`) محدّثاً الحالات والتواريخ والمراجعات والاعتمادات الجديدة غير المسجلة والروابط دون كسر أي ماكرو أو معادلات، وأنشئ ملف `LOG_Amendments_Report.xlsx` يوثق كل تعديل وملف مكرر أو ناقص. وإذا لم يوجد Log سابق فأنشئ `Submittals_Log.xlsx` احترافياً كاملاً مع ملخص تنفيذي بالمعادلات.
5. نظّف `_agent_work/` وقدّم ملخصاً نهائياً شاملاً بجدول الأقسام والحالات وأهم التصحيحات المكتشفة.
"""
