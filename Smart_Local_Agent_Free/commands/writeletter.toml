description = "صياغة وإصدار كتاب رسمي احترافي بصيغة Word (.docx) جاهز للطباعة والتوقيع (عربي / إنجليزي)"

prompt = """
قم بصياغة وإنشاء كتاب رسمي احترافي ومتكامل بصيغة Word (`.docx`) جاهز للطباعة والتوقيع بناءً على طلب المستخدم:
{{args}}

القواعد والخطوات:
1. إذا وُجد في المجلد الحالي أو في `templates/letterhead.docx` ملف ترويسة خاص بشركة المستخدم أو كتب سابقة صادرة، افحصها أولاً لتلتزم بنفس أسلوب الشركة ونظام ترقيم الكتب وأسماء المشروع والعقد والموقّع.
2. صِغ الكتاب بلغة رسمية هندسية/تعاقدية/إدارية رصينة وواضحة ومقنعة (بالعربية الفصحى المعتمدة في مراسلات الوزارات والمكاتب الاستشارية والشركات في الكويت والخليج، أو بالإنجليزية الرسمية إذا طلب المستخدم ذلك):
   - ترويسة المرجع والتاريخ والمرفقات، المخاطَب (السادة / ... المحترمين + عناية ...)، المشروع ورقم العقد، الموضوع الواضح، الإشارة للكتب أو بنود العقد السابقة إن وُجدت.
   - فقرات مترابطة ومرتبة (ونقاط مرقمة أو جدول منظم عند الحاجة مثل كشف اعتمادات أو مبالغ أو بنود).
   - خاتمة رسمية، خانة التوقيع، قائمة المرفقات، و"نسخة إلى" (CC).
   - تذكّر تنسيق الدينار الكويتي بثلاث خانات عشرية (`0.000` د.ك) عند ذكر أي مبالغ بالكويت.
3. جهّز ملف المواصفات في `_agent_work/letter_spec.json` وأنشئ ملف الـ Word عبر أداة `letter_builder.py` (في مجلد `.gemini/doc_tools` بمسار المستخدم) — وإذا طلب المستخدم الطباعة على ورق مروّس جاهز مرّر الخيار `--preprinted`.
4. احفظ الملف في المجلد الحالي باسم واضح مثل `كتاب_صادر_YYYY-MM-DD_مختصر-الموضوع.docx`، ونظّف `_agent_work/`، ثم اعرض للمستخدم نص الكتاب ومكانه واسأله إن أراد أي تعديل في النبرة أو التفاصيل.
"""
