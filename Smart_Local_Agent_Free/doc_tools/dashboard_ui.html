    if (S.orgFilter === 'duplicate' && (counts.duplicate_resolved || 0) > 0) {
      emptyTableMsg = `<tr><td colspan="4"><div class="alert alert-green" style="margin:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span>✅ ${esc(t('organizer.dup_cleared_msg', { count: counts.duplicate_resolved }))}</span>${showResolvedToggle}</div></td></tr>`;
    } else if (S.orgFilter === 'near_duplicate' && (counts.near_duplicate_resolved || 0) > 0) {
      emptyTableMsg = `<tr><td colspan="4"><div class="alert alert-green" style="margin:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span>✅ ${esc(t('organizer.near_dup_cleared_msg', { count: counts.near_duplicate_resolved }))}</span>${showResolvedToggle}</div></td></tr>`;
    } else if (S.orgFilter === 'superseded' && (counts.superseded_resolved || 0) > 0) {
      emptyTableMsg = `<tr><td colspan="4"><div class="alert alert-green" style="margin:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span>✅ ${esc(t('organizer.sup_cleared_msg', { count: counts.superseded_resolved }))}</span>${showResolvedToggle}</div></td></tr>`;
    }
  }

  return scanCard + `
    <div class="kpi-grid">
      <div class="kpi"><div class="k-lbl">${esc(t('organizer.kpi_total'))}</div><div class="k-val">${data.total||0}</div></div>
      <div class="kpi"><div class="k-lbl">${esc(t('organizer.kpi_keep'))}</div><div class="k-val" style="color:var(--green)">${counts.keep||0}</div></div>
      <div class="kpi"><div class="k-lbl">${esc(t('organizer.kpi_dup'))}</div><div class="k-val" style="color:var(--amber)">${counts.duplicate||0}</div></div>
      <div class="kpi"><div class="k-lbl">${esc(t('organizer.kpi_near_dup'))}</div><div class="k-val" style="color:var(--purple)">${counts.near_duplicate||0}</div></div>
      <div class="kpi"><div class="k-lbl">${esc(t('organizer.kpi_sup'))}</div><div class="k-val" style="color:var(--amber)">${counts.superseded||0}</div></div>
      <div class="kpi"><div class="k-lbl">${esc(t('organizer.kpi_unlogged'))}</div><div class="k-val" style="color:var(--red)">${counts.missing_from_log||0}</div></div>
      <div class="kpi"><div class="k-lbl">${esc(t('organizer.kpi_unclass'))}</div><div class="k-val">${counts.unclassified||0}</div></div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">
        <div class="actions-row">
          <button class="btn btn-sm btn-blue" ${jobRunning ? 'disabled' : ''} onclick="aiRenameOrganizerBatch(this)">${orgAiLbl}</button>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
          <select class="ctrl-in" style="max-width:170px" onchange="S.orgSection=this.value;S.orgPage=1;renderOrganizerView()">
            <option value="" ${!S.orgSection?'selected':''}>${esc(t('organizer.filter_all'))}</option>${secOpts}
          </select>
          <input id="orgSearchIn" class="search-in" style="max-width:210px" value="${esc(S.orgQuery||'')}" placeholder="${esc(t('common.search_ph'))}" onkeydown="if(event.key==='Enter'){S.orgQuery=this.value;S.orgPage=1;renderOrganizerView()}">
          <button type="button" class="btn btn-sm" onclick="S.orgQuery=document.getElementById('orgSearchIn')?.value||'';S.orgPage=1;renderOrganizerView()">${esc(t('common.search'))}</button>
        </div>
      </div>
      <div class="toolbar-sub">
        <button class="btn btn-sm" ${jobRunning ? 'disabled' : ''} onclick="bulkOrganizerAction('exclude_duplicates', this)">🚫 ${esc(t('organizer.exclude_dups_btn'))}</button>
        <button class="btn btn-sm" ${jobRunning ? 'disabled' : ''} onclick="bulkOrganizerAction('isolate_duplicates', this)">📁 ${esc(t('organizer.isolate_dups_btn'))}</button>
        <button class="btn btn-sm" ${jobRunning ? 'disabled' : ''} onclick="bulkOrganizerAction('exclude_near_duplicates', this)">🚫 ${esc(t('organizer.exclude_near_dups_btn'))}</button>
        <button class="btn btn-sm" ${jobRunning ? 'disabled' : ''} onclick="bulkOrganizerAction('isolate_near_duplicates', this)">📁 ${esc(t('organizer.isolate_near_dups_btn'))}</button>
        <button class="btn btn-sm" ${jobRunning ? 'disabled' : ''} onclick="bulkOrganizerAction('exclude_superseded', this)">📂 ${esc(t('organizer.isolate_sup_btn'))}</button>
      </div>

      <div class="tabs">
        ${fbtn('all', 'organizer.filter_all', counts.active_total ?? data.total)}
        ${fbtn('keep', 'organizer.filter_keep', counts.keep)}
        ${fbtn('duplicate', 'organizer.filter_dup', counts.duplicate)}
        ${fbtn('near_duplicate', 'organizer.filter_near_dup', counts.near_duplicate)}
        ${fbtn('superseded', 'organizer.filter_sup', counts.superseded)}
        ${fbtn('missing_from_log', 'organizer.filter_unlogged', counts.missing_from_log)}
        ${fbtn('unclassified', 'organizer.filter_unclass', counts.unclassified)}
        ${(counts.excluded || 0) > 0 || S.orgFilter === 'excluded' ? fbtn('excluded', 'organizer.filter_excluded', counts.excluded) : ''}
        ${rowsHtml && showResolvedToggle ? `<div style="margin-right:auto">${showResolvedToggle}</div>` : ''}
      </div>

      <div class="tbl-wrap" style="max-height:460px">
        <table class="dtbl">
          <thead><tr>
            <th>${esc(t('organizer.col_include'))}</th>
            <th>${esc(t('organizer.col_before'))}</th>
            <th>${esc(t('organizer.col_after'))}</th>
            <th>${esc(t('organizer.col_status'))}</th>
          </tr></thead>
          <tbody>${rowsHtml || emptyTableMsg}</tbody>
        </table>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;flex-wrap:wrap;gap:8px">
        <div style="display:flex;gap:6px;align-items:center">
          <button class="btn btn-sm" ${data.page<=1?'disabled':''} onclick="S.orgPage=${Math.max(1,(data.page||1)-1)};renderOrganizerView()">◀</button>
          <span class="ltr" style="font-size:13px">${data.page||1} / ${data.total_pages||1} (${data.total_filtered||0})</span>
          <button class="btn btn-sm" ${(data.page||1)>=(data.total_pages||1)?'disabled':''} onclick="S.orgPage=${(data.page||1)+1};renderOrganizerView()">▶</button>
        </div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <select id="org_exec_mode" class="ctrl-in" onchange="S.orgExecMode=this.value" style="max-width:240px">
            <option value="copy" ${S.orgExecMode==='copy'?'selected':''}>${esc(t('organizer.mode_copy'))}</option>
            <option value="move" ${S.orgExecMode==='move'?'selected':''}>${esc(t('organizer.mode_move'))}</option>
          </select>
          <label style="display:flex;align-items:center;gap:5px"><input type="checkbox" id="org_upd_log" ${S.orgUpdateLog?'checked':''} onchange="S.orgUpdateLog=this.checked"> ${esc(t('organizer.opt_update_log'))}</label>
          <button class="btn btn-primary" ${jobRunning ? 'disabled' : ''} onclick="startOrganizerExecute(this)">${orgExecLbl}</button>
        </div>
      </div>
      ${execResultHtml}
    </div>`;
}

function _renderOrganizerAuditTab() {
  const au = S.orgAudit;
  let body = `<div class="empty">${esc(t('organizer.empty_plan'))}</div>`;
  if (au && au.ok) {
    const repRel = (au.report_exists !== false) ? (au.report_rel || '') : '';
    const dlUrl = repRel ? `/api/projects/${encodeURIComponent(S.pid)}/download?rel=${encodeURIComponent(repRel)}&area=root` : '';
    const gaps = au.sequence_gaps || [];
    const gapRows = gaps.map(g =>
      `<tr><td class="ltr"><strong>${esc(g.series)}</strong></td><td class="ltr">${esc((g.missing_numbers||[]).slice(0,40).join(', '))}</td></tr>`
    ).join('');
    body = `
      <div class="kpi-grid" style="margin-top:10px">
        <div class="kpi"><div class="k-lbl">${esc(t('organizer.audit_missing_files'))}</div><div class="k-val" style="color:var(--red)">${au.log_missing_files_count||0}</div></div>
        <div class="kpi"><div class="k-lbl">${esc(t('organizer.audit_unlogged_files'))}</div><div class="k-val" style="color:var(--amber)">${au.archive_unlogged_count||0}</div></div>
        <div class="kpi"><div class="k-lbl">${esc(t('organizer.audit_overdue'))}</div><div class="k-val" style="color:var(--amber)">${au.overdue_count||0}</div></div>
        <div class="kpi"><div class="k-lbl">${esc(t('organizer.audit_rejected'))}</div><div class="k-val" style="color:var(--red)">${au.rejected_count||0}</div></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">
        ${dlUrl ? `<a class="btn btn-primary btn-sm" href="${dlUrl}" download>📥 ${esc(t('organizer.download_report_btn'))}</a>` : ''}
        ${(au.archive_unlogged_count||0) > 0 ? `<button class="btn btn-blue btn-sm" onclick="registerUnloggedFiles(this)">📝 ${esc(t('organizer.register_unlogged_btn'))} (${au.archive_unlogged_count})</button>` : ''}
      </div>
      ${gapRows ? `<h4 style="margin:10px 0 6px">${esc(t('organizer.audit_gaps_title'))}</h4>
        <div class="tbl-wrap" style="max-height:260px"><table class="dtbl"><thead><tr><th>${esc(t('log_mapper.col_ref_no'))}</th><th>${esc(t('organizer.col_missing_nums'))}</th></tr></thead><tbody>${gapRows}</tbody></table></div>` : ''}`;
  }
  return `
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">📊 ${esc(t('organizer.audit_title'))}</h3>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn btn-blue btn-sm" onclick="openWeeklyReportModal(this)">📊 ${esc(t('weekly.btn'))}</button>
          <button class="btn btn-primary btn-sm" onclick="runOrganizerAudit(this)">🔍 ${esc(t('organizer.audit_btn'))}</button>
        </div>
      </div>
      ${body}
    </div>`;
}

function _renderOrganizerPdfTab() {
  const mList = (S.orgMergeList || []).map((p, i) => `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--border)">
      <span class="ltr" style="font-size:12px">${i+1}. ${esc(p)}</span>
      <button class="btn btn-danger btn-sm" onclick="S.orgMergeList.splice(${i},1);renderOrganizerView()">✕</button>
    </div>`).join('');

  const spRes = S.orgPdfSplitRes;
  const spLinks = (spRes && spRes.ok && (spRes.parts_created || 0) > 0 && Array.isArray(spRes.files) && spRes.files.length)
    ? `<div class="alert alert-green" style="margin-top:10px">
         <div style="font-weight:700;margin-bottom:6px">✅ ${esc(t('organizer.pdf_split_out_hdr'))} (${spRes.parts_created})</div>
         <div style="display:flex;flex-direction:column;gap:4px">
           ${(spRes.file_links && spRes.file_links.length ? spRes.file_links : spRes.files.map(fn => ({ name: fn, download_url: '' }))).map(fl => `
             <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px">
               <span class="ltr">${esc(fl.name)}</span>
               ${fl.download_url ? `<a class="btn btn-sm" href="${esc(fl.download_url)}" download>⬇ ${esc(t('organizer.pdf_download_btn'))}</a>` : ''}
             </div>`).join('')}
         </div>
       </div>`
    : '';

  const mgRes = S.orgPdfMergeRes;
  const mgOut = (mgRes && mgRes.ok && (mgRes.total_pages || 0) > 0 && mgRes.name)
    ? `<div class="alert alert-green" style="margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
         <div>
           <div style="font-weight:700">✅ ${esc(t('organizer.pdf_merge_out_hdr'))}</div>
           <div class="ltr sub" style="font-size:12px">${esc(mgRes.name)} (${mgRes.total_pages} p.)</div>
         </div>
         ${mgRes.download_url ? `<a class="btn btn-primary btn-sm" href="${esc(mgRes.download_url)}" download>⬇ ${esc(t('organizer.pdf_download_btn'))}</a>` : ''}
       </div>`
    : '';

  return `
    <div class="grid-2">
      <div class="card">
        <h3 class="card-title">✂️ ${esc(t('organizer.pdf_split_title'))}</h3>
        <div class="fg" style="margin-top:8px">
          <div class="path-row">
            <input id="pdf_split_in" class="ltr" placeholder="file.pdf">
            <button type="button" class="btn btn-sm" onclick="browsePdfForSplit(this)">📄 ${esc(t('organizer.pdf_browse_btn'))}</button>
          </div>
        </div>
        <div class="form-grid" style="margin-top:8px">
          <div class="fg"><label>${esc(t('organizer.pdf_every_n_label'))}</label><input type="number" min="1" id="pdf_split_n" value="1" class="ltr"></div>
          <div class="fg"><label>${esc(t('organizer.pdf_ranges_label'))}</label><input id="pdf_split_rng" class="ltr" placeholder="1-2, 3-5"></div>
        </div>
        <button class="btn btn-primary" style="margin-top:10px" onclick="runPdfSplit(this)">✂️ ${esc(t('organizer.pdf_split_btn'))}</button>
        <div id="pdfSplitOut">${spLinks}</div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3 class="card-title">🧩 ${esc(t('organizer.pdf_merge_title'))}</h3>
          <button type="button" class="btn btn-sm" onclick="browsePdfAddMerge(this)">+ ${esc(t('organizer.pdf_add_btn'))}</button>
        </div>
        <div style="max-height:220px;overflow-y:auto;margin-bottom:10px">${mList || `<div class="empty">${esc(t('organizer.empty_plan'))}</div>`}</div>
        <button class="btn btn-primary" ${S.orgMergeList.length<2?'disabled':''} onclick="runPdfMerge(this)">🧩 ${esc(t('organizer.pdf_merge_btn'))}</button>
        <div id="pdfMergeOut">${mgOut}</div>
      </div>
    </div>`;
}

async function browseOrganizerFolder() {
  try {
    const res = await api('/api/browse-folder', {
      body: { initial_dir: S.orgFolder || '', title: t('organizer.src_folder_label') }
    });
    if (res.cancelled || !res.path) return;
    S.orgFolder = res.path;
    const inp = document.getElementById('org_folder_in');
    if (inp) inp.value = res.path;
  } catch (e) { toast(e.message, 'err'); }
}

async function startOrganizerScan(btnEl) {
  const inp = document.getElementById('org_folder_in');
  if (inp) S.orgFolder = inp.value.trim();
  if (!S.orgFolder) { toast(t('organizer.src_folder_label'), 'err'); return; }
  const preJob = { running: true, kind: 'scan', phase: 'walking', started_ts: Date.now() / 1000 };
  const host = document.getElementById('orgProgressHost');
  if (host) host.innerHTML = _renderOrgProgressHtml(preJob);
  updateGlobalActivityBar();
  _ensureLiveTick();
  try {
    await withBusyButton(btnEl, () => api(`/api/projects/${encodeURIComponent(S.pid)}/organizer/scan`, {
      body: {
        folder: S.orgFolder,
        extract_archives: document.getElementById('org_ext_arc')?.checked !== false,
        read_text: document.getElementById('org_read_txt')?.checked !== false,
        blocking: false,
      }
    }));
    S.orgPage = 1;
    await renderOrganizerView(true);
  } catch (e) {
    if (host) host.innerHTML = _renderOrgProgressHtml({ running: false, kind: 'scan', phase: 'error', error: e.message });
    updateGlobalActivityBar();
    toast(e.message, 'err');
  }
}

async function updateOrganizerItem(itemId, patch, btnEl) {
  try {
    await withBusyButton(btnEl, async () => {
      await api(`/api/projects/${encodeURIComponent(S.pid)}/organizer/update`, {
        body: { updates: [{ id: itemId, ...patch }] }
      });
      await renderOrganizerView(true);
    });
  } catch (e) { toast(e.message, 'err'); }
}

async function bulkOrganizerAction(action, btnEl) {
  try {
    await withBusyButton(btnEl, async () => {
      const res = await api(`/api/projects/${encodeURIComponent(S.pid)}/organizer/update`, {
        body: { bulk_action: action }
      });
      S.orgShowResolved = false;
      S.orgPage = 1;
      const c = (res && res.counts) || (res && res.summary && res.summary.counts) || {};
      if ((action === 'exclude_duplicates' || action === 'isolate_duplicates') && c.duplicate === 0 && (c.duplicate_resolved || 0) > 0) {
        toast(t('organizer.dup_cleared_msg', { count: c.duplicate_resolved }));
      } else if ((action === 'exclude_near_duplicates' || action === 'isolate_near_duplicates') && c.near_duplicate === 0 && (c.near_duplicate_resolved || 0) > 0) {
        toast(t('organizer.near_dup_cleared_msg', { count: c.near_duplicate_resolved }));
      } else if ((action === 'exclude_superseded' || action === 'include_superseded') && c.superseded === 0 && (c.superseded_resolved || 0) > 0) {
        toast(t('organizer.sup_cleared_msg', { count: c.superseded_resolved }));
      } else {
        toast(t('organizer.updated_toast'));
      }
      await renderOrganizerView(true);
    });
  } catch (e) { toast(e.message, 'err'); }
}

async function startOrganizerExecute(btnEl) {
  const preJob = { running: true, kind: 'execute', phase: 'executing', started_ts: Date.now() / 1000 };
  const host = document.getElementById('orgProgressHost');
  if (host) host.innerHTML = _renderOrgProgressHtml(preJob);
  updateGlobalActivityBar();
  _ensureLiveTick();
  try {
    const mode = document.getElementById('org_exec_mode')?.value || S.orgExecMode || 'copy';
    const updLog = document.getElementById('org_upd_log')?.checked ?? S.orgUpdateLog;
    await withBusyButton(btnEl, () => api(`/api/projects/${encodeURIComponent(S.pid)}/organizer/execute`, {
      body: { mode, update_excel_log: updLog, blocking: false }
    }));
    await renderOrganizerView(true);
  } catch (e) {
    if (host) host.innerHTML = _renderOrgProgressHtml({ running: false, kind: 'execute', phase: 'error', error: e.message });
    updateGlobalActivityBar();
    toast(e.message, 'err');
  }
}

async function stopOrganizerJob() {

    await api(`/api/projects/${encodeURIComponent(S.pid)}/organizer/stop`, { body: {} });
    await renderOrganizerView(true);

}

async function aiRenameSingle(itemId, btnEl) {

    await withBusyButton(btnEl, async () => {

async function runPdfSplit(btnEl) {
  const src_pdf = (document.getElementById('pdf_split_in')?.value || '').trim();
  if (!src_pdf) return;
  S.orgPdfSplitRes = null;

  if (outEl) outEl.innerHTML = '';

    const res = await withBusyButton(btnEl, () => api(`/api/projects/${encodeURIComponent(S.pid)}/organizer/pdf-split`, {
      body: {
        src_pdf,
        every_n_pages: Number(document.getElementById('pdf_split_n')?.value || 1),
        ranges_spec: (document.getElementById('pdf_split_rng')?.value || '').trim(),

    if (!res || !res.ok || !(res.parts_created > 0)) { toast((res && res.error) || t('organizer.pdf_empty_err'), 'err'); return; }

    toast(t('organizer.pdf_split_done', { count: res.parts_created || 0 }));

  } catch (e) {
    S.orgPdfSplitRes = null;
    toast(e.message, 'err');

function _waReadOptionsFromStateOrDom() {
  const winEl = document.getElementById('wa_win_min');
  const sndEl = document.getElementById('wa_sender_mode');
  const priEl = document.getElementById('wa_text_prio');
  const fmtEl = document.getElementById('wa_name_fmt');
  const dfEl = document.getElementById('wa_date_from');
  const dtEl = document.getElementById('wa_date_to');
  const docEl = document.getElementById('wa_inc_docs');
  if (winEl) S.waWindowMin = winEl.value === '' ? 2 : Number(winEl.value);
  if (sndEl) S.waSenderMode = sndEl.value || 'same_sender';
  if (priEl) S.waTextPrio = priEl.value || 'before_then_after';
  if (fmtEl) S.waNameFmt = fmtEl.value || 'date_name';
  if (dfEl) S.waDateFrom = dfEl.value || '';
  if (dtEl) S.waDateTo = dtEl.value || '';
  if (docEl) S.waIncludeDocs = Boolean(docEl.checked);
  return {
    window_minutes: S.waWindowMin,
    sender_mode: S.waSenderMode,
    text_priority: S.waTextPrio,
    name_format: S.waNameFmt,
    date_from: S.waDateFrom,
    date_to: S.waDateTo,
    include_docs: S.waIncludeDocs,
  };
}

function _waSyncTimer(job) {
  if (job && job.running) {
    if (!S.waPollTimer) {
      S.waPollTimer = setInterval(async () => {
        if (S.view !== 'whatsapp' || !S.pid) {
          clearInterval(S.waPollTimer);
          S.waPollTimer = null;
          S.waPollBusy = false;
          return;
        }
        if (S.waPollBusy) return;
        S.waPollBusy = true;
        try {
          await _pollWhatsappOnce();
        } finally {
          S.waPollBusy = false;
        }
      }, 700);
    }
  } else if (S.waPollTimer) {
    clearInterval(S.waPollTimer);
    S.waPollTimer = null;
    S.waPollBusy = false;
  }
}

async function _pollWhatsappOnce() {
  const prevRunning = Boolean(S.waJob && S.waJob.running);
  const prevKind = S.waJob ? S.waJob.kind : '';
  const data = await fetchWhatsappPage(S.waPage);
  const job = data.job || { running: false };
  if (!job.running && !job.phase && S.waJob && S.waJob.phase === 'uploading') return;
  S.waJob = (job.running || job.phase === 'done' || job.phase === 'error' || job.phase === 'stopped') ? job : S.waJob;
  _waSyncTimer(job);
  updateGlobalActivityBar();
  _ensureLiveTick();
  if (prevRunning && job.running) {
    const host = document.getElementById('waJobHost');
    if (host) {
      host.innerHTML = _renderUnifiedJobHtml('whatsapp', job, { canStop: true });
      return;
    }
  }
  if (prevRunning && !job.running) {
    if (job.phase === 'done') {
      const sm = job.summary || {};
      if (prevKind === 'execute') {
        _waResetUiFiltersAndInputs();
        S.waJob = job;
        toast(t('wa.exec_done_toast', { count: (sm.renamed || 0) + (sm.copied || 0) }));
      } else if (prevKind === 'ai_rename') {
        if ((sm.total_targets || 0) === 0) toast(t('wa.ai_none_toast'));
        else toast(t('wa.ai_done_toast', { updated: sm.updated || 0, total: sm.processed || sm.total_targets || 0 }));
      } else {
        S.waPage = 1;
        S.waFilter = 'all';
        const c = sm.counts || {};
        toast(t('wa.scan_done_toast', { total: c.total || 0, matched: c.matched || 0 }));
      }
      await refreshHub(true);
    } else if (job.phase === 'stopped') {
      toast(t('jobs.stopped_by_user'), 'warn');
    } else if (job.phase === 'error' && job.error) {
      toast(job.error, 'err');
    }
    await renderWhatsappView(true);
  }
}

async function fetchWhatsappPage(page = 1) {
  const flt = S.waFilter || 'all';
  const qs = new URLSearchParams({
    page: String(page || 1),
    per_page: '50',
    filter: flt,
    media: S.waMediaFilter || '',
    q: S.waQuery || '',
    hide_excluded: flt === 'excluded' ? '0' : '1',
  });
  const res = await api(`/api/projects/${encodeURIComponent(S.pid)}/whatsapp-archive?${qs.toString()}`);
  S.waPlan = res;
  if (res && res.job && (res.job.running || res.job.phase === 'done' || res.job.phase === 'error' || res.job.phase === 'stopped')) {
    S.waJob = res.job;
  }
  return res;
}

async function waUploadFileList(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  const batchId = 'wa_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
  const stEl = document.getElementById('waUploadStatus');
  const host = document.getElementById('waJobHost');
  try {
    S.waJob = { running: true, kind: 'scan', phase: 'uploading', processed: 0, total: files.length, discovered: files.length, started_ts: Date.now() / 1000 };
    if (host) host.innerHTML = _renderUnifiedJobHtml('whatsapp', S.waJob, { canStop: false });
    updateGlobalActivityBar();
    _ensureLiveTick();
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      S.waUploadProg = t('wa.uploading_prog', { cur: i + 1, total: files.length });
      if (stEl) stEl.textContent = S.waUploadProg;
      S.waJob = { ...S.waJob, processed: i, current_file: f.name };
      if (host) host.innerHTML = _renderUnifiedJobHtml('whatsapp', S.waJob, { canStop: false });
      const resp = await fetch(`/api/projects/${encodeURIComponent(S.pid)}/whatsapp-archive/upload-file`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/octet-stream',
          'X-Upload-Batch': batchId,
          'X-Upload-Filename': encodeURIComponent(f.name),
          'X-Upload-Relpath': encodeURIComponent(f.webkitRelativePath || f.name),
        },
        body: f,
      });
      const rj = await resp.json();
      if (!resp.ok || !rj.ok) throw new Error(rj.error || t('common.error_generic'));
    }
    S.waUploadProg = '';
    if (stEl) stEl.textContent = '';
    for (const id of ['waFilesIn', 'waFolderIn']) { const el = document.getElementById(id); if (el) el.value = ''; }
    const opts = _waReadOptionsFromStateOrDom();
    const res = await api(`/api/projects/${encodeURIComponent(S.pid)}/whatsapp-archive/scan`, {
      body: { batch_id: batchId, blocking: false, ...opts }
    });
    if (res && res.job) S.waJob = res.job;
    _waSyncTimer(S.waJob);
    if (host) host.innerHTML = _renderUnifiedJobHtml('whatsapp', S.waJob, { canStop: true });
    updateGlobalActivityBar();
  } catch (e) {
    S.waUploadProg = '';
    if (stEl) stEl.textContent = '';
    S.waJob = { running: false, kind: 'scan', phase: 'error', error: e.message };
    if (host) host.innerHTML = _renderUnifiedJobHtml('whatsapp', S.waJob, { canStop: false });
    updateGlobalActivityBar();
    toast(e.message, 'err');
  }
}

/* ── Content-Based Duplicates & Visual Similarity Reviewer ─────────────── */
function _dupSyncTimer(job) {
  if (job && job.running) {
    if (!S.dupPollTimer) {
      S.dupPollTimer = setInterval(async () => {
        if (S.view !== 'duplicates' || !S.pid) {
          clearInterval(S.dupPollTimer);
          S.dupPollTimer = null;
          S.dupPollBusy = false;
          return;
        }
        if (S.dupPollBusy) return;
        S.dupPollBusy = true;
        try {
          await _pollDuplicatesOnce();
        } finally {
          S.dupPollBusy = false;
        }
      }, 700);
    }
  } else if (S.dupPollTimer) {
    clearInterval(S.dupPollTimer);
    S.dupPollTimer = null;
    S.dupPollBusy = false;
  }
}

async function _pollDuplicatesOnce() {
  const prevRunning = Boolean(S.dupJob && S.dupJob.running);
  const prevKind = S.dupJob ? S.dupJob.kind : '';
  const data = await fetchDuplicatesPage(S.dupPage);
  const job = data.job || { running: false };
  if (!job.running && !job.phase && S.dupJob && S.dupJob.phase === 'uploading') return;
  S.dupJob = (job.running || job.phase === 'done' || job.phase === 'error' || job.phase === 'stopped') ? job : S.dupJob;
  _dupSyncTimer(job);
  updateGlobalActivityBar();
  _ensureLiveTick();
  if (prevRunning && job.running) {
    const host = document.getElementById('dupJobHost');
    if (host) {
      host.innerHTML = _renderUnifiedJobHtml('duplicates', job, { canStop: true });
      return;
    }
  }
  if (prevRunning && !job.running) {
    if (job.phase === 'done') {
      const sm = job.summary || {};
      if (prevKind === 'execute') {
        _dupResetUiFiltersAndInputs();
        S.dupJob = job;
        toast(t('dups.exec_done_toast', { count: sm.processed || 0, saved: sm.saved_label || '0 B' }));
      } else {
        S.dupPage = 1;
        S.dupFilter = 'all';
        const c = sm.counts || {};
        toast(t('dups.scan_done_toast', { groups: c.groups ?? sm.groups_count ?? 0, total: c.total_files_scanned ?? sm.total_files_scanned ?? 0 }));
      }
      await refreshHub(true);
    } else if (job.phase === 'stopped') {
      toast(t('jobs.stopped_by_user'), 'warn');
    } else if (job.phase === 'error' && job.error) {
      toast(job.error, 'err');
    }
    await renderDuplicatesView(true);
  }
}

function _dupReadOptions() {
  const scEl = document.getElementById('dup_scope');
  const thEl = document.getElementById('dup_thresh');
  const subEl = document.getElementById('dup_subfolders');
  const scope = scEl ? scEl.value : (S.dupScope || 'all');
  const min_similarity = thEl ? Number(thEl.value || 85) : Number(S.dupThresh || 85);
  const include_subfolders = subEl ? Boolean(subEl.checked) : Boolean(S.dupSubfolders);
  S.dupScope = scope;
  S.dupThresh = min_similarity;
  S.dupSubfolders = include_subfolders;
  return { scope, min_similarity, include_subfolders };
}

async function fetchDuplicatesPage(page = S.dupPage) {
  const flt = S.dupFilter || 'all';
  const qs = new URLSearchParams({
    page: String(page || 1),
    per_page: '20',
    filter: flt,
    q: S.dupQuery || '',
    show_reviewed: flt === 'reviewed' ? '1' : '0',
  }).toString();
  const res = await api(`/api/projects/${encodeURIComponent(S.pid)}/duplicates?${qs}`);
  S.dupPlan = res;
  if (res && res.job && (res.job.running || res.job.phase === 'done' || res.job.phase === 'error' || res.job.phase === 'stopped')) {
    S.dupJob = res.job;
  }
  return res;
}

function dupHandleDrop(ev) {
  const files = ev.dataTransfer && ev.dataTransfer.files;
  if (files && files.length) dupUploadFileList(files);
}

async function dupUploadFileList(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  const batchId = 'dup_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
  const stEl = document.getElementById('dupUploadStatus');
  const host = document.getElementById('dupJobHost');
  try {
    S.dupJob = { running: true, kind: 'scan', phase: 'uploading', processed: 0, total: files.length, discovered: files.length, started_ts: Date.now() / 1000 };
    if (host) host.innerHTML = _renderUnifiedJobHtml('duplicates', S.dupJob, { canStop: false });
    updateGlobalActivityBar();
    _ensureLiveTick();
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      const rel = f.webkitRelativePath || f.name;
      S.dupUploadProg = t('dups.uploading_prog', { cur: i + 1, total: files.length });
      if (stEl) stEl.textContent = S.dupUploadProg;
      S.dupJob = { ...S.dupJob, processed: i, current_file: f.name };
      if (host) host.innerHTML = _renderUnifiedJobHtml('duplicates', S.dupJob, { canStop: false });
      const resp = await fetch(`/api/projects/${encodeURIComponent(S.pid)}/duplicates/upload-file`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/octet-stream',
          'X-Upload-Batch': batchId,
          'X-Upload-Filename': encodeURIComponent(f.name),
          'X-Upload-Relpath': encodeURIComponent(rel),
        },
        body: f,
      });
      const rj = await resp.json();
      if (!resp.ok || !rj.ok) throw new Error(rj.error || t('common.error_generic'));
    }
    S.dupUploadProg = '';
    if (stEl) stEl.textContent = '';
    for (const id of ['dupFilesIn', 'dupFolderIn']) { const el = document.getElementById(id); if (el) el.value = ''; }
    const opts = _dupReadOptions();
    const res = await api(`/api/projects/${encodeURIComponent(S.pid)}/duplicates/scan`, {
      body: { source_kind: 'upload', batch_id: batchId, blocking: false, ...opts }
    });
    if (res && res.job) S.dupJob = res.job;
    _dupSyncTimer(S.dupJob);
    if (host) host.innerHTML = _renderUnifiedJobHtml('duplicates', S.dupJob, { canStop: true });
    updateGlobalActivityBar();
  } catch (e) {
    S.dupUploadProg = '';
    if (stEl) stEl.textContent = '';
    S.dupJob = { running: false, kind: 'scan', phase: 'error', error: e.message };
    if (host) host.innerHTML = _renderUnifiedJobHtml('duplicates', S.dupJob, { canStop: false });
    updateGlobalActivityBar();
    toast(e.message, 'err');
  }
}

async function dupBrowseFolder() {
  try {
    const res = await api('/api/browse-folder', {
      body: { initial_dir: S.dupFolder || '', title: t('dups.local_folder_label') }
    });
    if (res.cancelled || !res.path) return;
    S.dupFolder = res.path;
    const inp = document.getElementById('dup_folder_in');
    if (inp) inp.value = res.path;
  } catch (e) { toast(e.message, 'err'); }
}

async function dupScanLocalFolder(btnEl) {
  const folder = (document.getElementById('dup_folder_in')?.value || S.dupFolder || '').trim();
  if (!folder) { toast(t('dups.no_files_selected'), 'err'); return; }
  S.dupFolder = folder;
  try {
    S.dupJob = { running: true, kind: 'scan', phase: 'walking', started_ts: Date.now() / 1000 };
    const host = document.getElementById('dupJobHost');
    if (host) host.innerHTML = _renderUnifiedJobHtml('duplicates', S.dupJob, { canStop: true });
    updateGlobalActivityBar();

  const renderMedia = (obj, url) => {

/* ── Smart Taskbar, Side Peek Drawer, Pinned Tray & Ctrl+K Palette (v10.13.0) */
function loadTaskbarPrefs() {
  try {
    const rawTray = localStorage.getItem('sla_pinned_tray');
    const arr = rawTray ? JSON.parse(rawTray) : [];
    S.pinnedTray = Array.isArray(arr) ? arr.slice(0, 5) : [];
  } catch (_) { S.pinnedTray = []; }
  try {
    S.taskbarHidden = localStorage.getItem('sla_taskbar_hidden') === '1';
  } catch (_) { S.taskbarHidden = false; }
}

function savePinnedTray() {
  try { localStorage.setItem('sla_pinned_tray', JSON.stringify((S.pinnedTray || []).slice(0, 5))); } catch (_) {}
}

function toggleTaskbarHidden(hide) {
  S.taskbarHidden = Boolean(hide);
  try { localStorage.setItem('sla_taskbar_hidden', S.taskbarHidden ? '1' : '0'); } catch (_) {}
  renderTaskbar();
}

function _trayItemKey(it) {
  if (!it) return '';
  if (it.kind === 'doc') return `doc::${it.pid || ''}::${it.rel || ''}`;
  return `view::${it.view || 'hub'}::${it.pid || ''}::${it.arg || ''}`;
}

function pinToTray(item) {
  const tray = Array.isArray(S.pinnedTray) ? [...S.pinnedTray] : [];
  const k = _trayItemKey(item);
  if (!k) return;
  if (tray.some(x => _trayItemKey(x) === k)) {
    toast(t('taskbar.already_pinned_toast'));
    return;
  }
  if (tray.length >= 5) {
    toast(t('taskbar.tray_full_toast'), 'warn');
    return;
  }
  const clean = {
    id: 'pin_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    kind: item.kind || 'view',
    view: item.view || 'overview',
    pid: item.pid || '',
    arg: item.arg || '',
    rel: item.rel || '',
    area: item.area || 'root',
    refNo: item.refNo || '',
    icon: item.icon || (item.kind === 'doc' ? '📄' : '📂'),
    title: String(item.title || '').slice(0, 38),
  };
  tray.push(clean);
  S.pinnedTray = tray;
  savePinnedTray();
  renderTaskbar();
  toast(t('taskbar.pinned_toast'));
}

function pinCurrentContext() {
  const projs = (S.hub && S.hub.projects) || [];
  const curProj = projs.find(p => p.id === S.pid);
  const pTag = curProj ? `[${curProj.code}] ` : '';
  if (S.view === 'section' && S.sectionId) {
    const secs = (S.projDetail && S.projDetail.sections) || (S.hub && S.hub.sections) || [];
    const sec = secs.find(s => s.id === S.sectionId);
    pinToTray({
      kind: 'view', view: 'section', pid: S.pid || '', arg: S.sectionId, icon: '📂',
      title: `${pTag}${(sec && sec.label) || S.sectionId}`,
    });
    return;
  }
  const viewIcons = { hub: '🏠', search: '🔍', decisions: '⚠️', settings: '⚙️', scanner: '📷', organizer: '🧹', whatsapp: '💬', duplicates: '🧬', logs: '📊', templates: '📝', studio: '🎨', overview: '📁' };
  const lbl = S.view === 'overview' && curProj ? `${curProj.code} · ${curProj.name}`
    : (S.view === 'hub' ? t('nav.projects') : (pTag + (S.view || '')));
  pinToTray({
    kind: 'view', view: S.view || 'hub', pid: S.pid || '', arg: S.view === 'studio' ? (S.studioTpl || '') : '',
    icon: viewIcons[S.view] || '📌', title: lbl,
  });
}

function unpinFromTray(id, ev) {
  if (ev) ev.stopPropagation();
  S.pinnedTray = (S.pinnedTray || []).filter(x => x.id !== id);
  savePinnedTray();
  renderTaskbar();
}

function openPinnedItem(id) {
  const it = (S.pinnedTray || []).find(x => x.id === id);
  if (!it) return;
  if (it.kind === 'doc' && it.rel) {
    openInlineDocPreview({ pid: it.pid || S.pid, rel: it.rel, area: it.area || 'root', title: it.title, refNo: it.refNo || '' });
    return;
  }
  if (it.pid) S.pid = it.pid;
  navigate(it.view || 'overview', it.arg || (it.view === 'overview' ? it.pid : ''));
}

function _taskBadgeTotal() {
  if (S.tasksData && S.tasksData.counts) return Number(S.tasksData.counts.total_open || 0);
  if (S.hub && S.hub.tasks_summary) return Number(S.hub.tasks_summary.total_open || 0);
  return 0;
}

function renderTaskbar() {
  const bar = document.getElementById('smartTaskbar');
  const fab = document.getElementById('taskbarRestoreFab');
  if (!bar || !fab) return;
  const totalOpen = _taskBadgeTotal();
  if (S.taskbarHidden) {
    document.body.classList.remove('has-taskbar');
    bar.style.display = 'none';
    fab.style.display = 'inline-flex';
    fab.innerHTML = `📋 ${esc(t('taskbar.show_btn'))}${totalOpen > 0 ? ` <span class="badge-count">${totalOpen}</span>` : ''} ▴`;
    return;
  }
  document.body.classList.add('has-taskbar');
  fab.style.display = 'none';
  bar.style.display = 'flex';
  const tray = S.pinnedTray || [];
  const trayHtml = tray.length
    ? tray.map(x => `<span class="tb-pin-chip" onclick="openPinnedItem(${jsStr(x.id)})" title="${esc(x.title)}">
        <span>${esc(x.icon || '📌')}</span>
        <span class="tb-pin-lbl">${esc(x.title)}</span>
        <button type="button" class="tb-pin-x" onclick="unpinFromTray(${jsStr(x.id)}, event)" aria-label="unpin">✕</button>
      </span>`).join('')
    : `<span class="tb-empty-hint">${esc(t('taskbar.empty_tray'))}</span>`;
  bar.innerHTML = `
    <div class="tb-group">
      <button type="button" class="tb-btn tb-primary" id="btnTaskbarToday" onclick="toggleTaskPeek(true)">
        📋 ${esc(t('taskbar.today_btn'))} <span class="badge-count" id="tbTodayCount">${totalOpen}</span>
      </button>
      <button type="button" class="tb-btn tb-accent" onclick="openQuickAddTaskPeek()">➕ ${esc(t('taskbar.quick_add_btn'))}</button>
    </div>
    <div class="tb-tray" id="tbPinnedTray">
      ${trayHtml}
      <button type="button" class="tb-btn" onclick="pinCurrentContext()" title="${esc(t('taskbar.pin_tooltip'))}">📌 ${esc(t('taskbar.pin_here_btn'))}</button>
    </div>
    <div class="tb-group">
      <button type="button" class="tb-btn" id="btnTaskbarCmd" onclick="openCommandPalette()" title="${esc(t('taskbar.cmd_tooltip'))}">
        ⌘ ${esc(t('taskbar.cmd_btn'))} <span class="tb-kbd">Ctrl+K</span>
      </button>
      <button type="button" class="tb-btn" onclick="toggleTaskbarHidden(true)" title="${esc(t('taskbar.hide_btn'))}">▾</button>
    </div>
  `;
}

function openQuickAddTaskPeek() {
  toggleTaskPeek(true, 'manual').then(() => {
    const inp = document.getElementById('tpQuickTitle');
    if (inp) inp.focus();
  });
}

async function toggleTaskPeek(forceOpen = null, tabName = '') {
  const wasOpen = Boolean(S.taskPeekOpen);
  const next = forceOpen === null ? !wasOpen : Boolean(forceOpen);
  S.taskPeekOpen = next;
  if (tabName) S.taskPeekTab = tabName;
  const bd = document.getElementById('taskPeekBackdrop');
  const dr = document.getElementById('taskPeekDrawer');
  if (!bd || !dr) return;
  if (!next) {
    _syncTaskDraftFromDom();
    bd.classList.remove('show');
    dr.style.display = 'none';
    return;
  }
  bd.classList.add('show');
  dr.style.display = 'flex';
  mountTaskPeekShell(!wasOpen);
  renderTaskPeek();
  await loadTasksData();
}

async function loadTasksData(silent = false) {
  try {
    const qs = new URLSearchParams({
      project_id: S.taskScopePid || '',
      include_done: S.taskShowDone ? '1' : '0',
    }).toString();
    S.tasksData = await api(`/api/tasks?${qs}`);
    if (S.taskPeekOpen) renderTaskPeek();
    const cntEl = document.getElementById('tbTodayCount');
    if (cntEl) cntEl.textContent = String(_taskBadgeTotal());
    else if (!silent || !_isUserTypingOrPicking()) renderTaskbar();
  } catch (e) {
    if (!silent) toast(e.message, 'err');
  }
}

function _autoKindMeta(kind) {
  if (kind === 'rejected') return { icon: '⛔', lbl: t('taskbar.kind_rejected'), pill: 'pill-red' };
  if (kind === 'unreplied') return { icon: '📩', lbl: t('taskbar.kind_unreplied'), pill: 'pill-amber' };
  if (kind === 'overdue') return { icon: '⏰', lbl: t('taskbar.kind_overdue'), pill: 'pill-amber' };
  if (kind === 'scanner_pending') return { icon: '📷', lbl: t('taskbar.kind_scanner'), pill: 'pill-blue' };
  return { icon: '☁️', lbl: t('taskbar.kind_backup'), pill: 'pill-amber' };
}

function _renderManualTaskCard(tk) {
  const isUrg = tk.priority === 'urgent';
  const prioLbl = tk.priority === 'urgent' ? t('taskbar.prio_urgent')
    : (tk.priority === 'low' ? t('taskbar.prio_low') : t('taskbar.prio_normal'));
  const prioCls = tk.priority === 'urgent' ? 'pill-red' : (tk.priority === 'low' ? 'pill-gray' : 'pill-blue');
  return `<div class="tp-card ${isUrg?'is-urgent':''} ${tk.done?'is-done':''}">
    <div class="tp-card-top">
      <div class="tp-title">${esc(tk.title)}</div>
      <span class="pill ${prioCls}">${esc(prioLbl)}</span>
    </div>
    <div class="tp-meta">
      ${tk.project_code ? `<span class="pill pill-gray">[${esc(tk.project_code)}] ${esc(tk.project_name || '')}</span>` : ''}
      ${tk.due_date ? `<span class="ltr">📅 ${esc(tk.due_date)}</span>` : ''}
      ${tk.ref_no ? `<code class="ltr">${esc(tk.ref_no)}</code>` : ''}
    </div>
    <div class="tp-acts">
      <button type="button" class="btn btn-sm ${tk.done?'':'btn-primary'}" onclick="toggleManualTaskDone(${jsStr(tk.id)}, ${!tk.done}, this)">
        ${tk.done ? '↩️ ' + esc(t('taskbar.reopen_btn')) : '✅ ' + esc(t('taskbar.mark_done_btn'))}
      </button>
      ${tk.project_id ? `<button type="button" class="btn btn-sm" onclick="openTaskProject(${jsStr(tk.project_id)})">📂 ${esc(t('taskbar.open_item_btn'))}</button>` : ''}
      <button type="button" class="btn btn-sm btn-danger" onclick="deleteManualTaskItem(${jsStr(tk.id)}, this)">🗑 ${esc(t('taskbar.delete_task_btn'))}</button>
    </div>
  </div>`;
}

function _renderAutoTaskCard(ak) {
  const m = _autoKindMeta(ak.kind);
  const isUrg = ak.priority === 'urgent';
  const waMsg = t('issue.wa_prefill_msg', { ref: ak.ref_no || ak.subject || '', subject: ak.subject || '', project: ak.project_name || '' });
  return `<div class="tp-card ${isUrg?'is-urgent':''}">
    <div class="tp-card-top">
      <div class="tp-title">${m.icon} ${esc(ak.ref_no ? `[${ak.ref_no}] ` : '')}${esc(ak.subject || ak.project_name || '')}</div>
      <span class="pill ${m.pill}">${esc(m.lbl)}</span>
    </div>
    <div class="tp-meta">
      <span class="pill pill-gray">[${esc(ak.project_code || '')}] ${esc(ak.project_name || '')}</span>
      ${ak.days ? `<span>⏱ ${esc(t('taskbar.days_ago', { days: ak.days }))}</span>` : ''}
      ${ak.date ? `<span class="ltr">${esc(ak.date)}</span>` : ''}
    </div>
    <div class="tp-acts">
      <button type="button" class="btn btn-sm btn-primary" onclick="openAutoTaskTarget(${jsStr(ak.project_id)}, ${jsStr(ak.target_view||'overview')}, ${jsStr(ak.section||'')})">📂 ${esc(t('taskbar.open_item_btn'))}</button>
      ${ak.file_rel ? `<button type="button" class="btn btn-sm btn-blue" onclick="openInlineDocPreview({pid:${jsStr(ak.project_id)},rel:${jsStr(ak.file_rel)},area:${jsStr(ak.file_area||'root')},title:${jsStr(ak.subject||ak.ref_no||'')},refNo:${jsStr(ak.ref_no||'')}})">👁 ${esc(t('doc_preview.btn'))}</button>` : ''}
      ${ak.ref_no ? `<button type="button" class="btn btn-sm" onclick="openSendWhatsAppModal('','',${jsStr(ak.file_rel||'')},${jsStr(waMsg)},${jsStr(ak.file_area||'root')})">💬 ${esc(t('issue.send_wa_btn'))}</button>` : ''}
      <button type="button" class="btn btn-sm" onclick="snoozeAutoTask(${jsStr(ak.auto_key)}, this)">✓ ${esc(t('taskbar.snooze_today_btn'))}</button>

function _syncTaskDraftFromDom() {
  const tEl = document.getElementById('tpQuickTitle');
  const pEl = document.getElementById('tpQuickProj');
  const prEl = document.getElementById('tpQuickPrio');
  const dEl = document.getElementById('tpQuickDue');
  if (!S.taskDraft) S.taskDraft = { title: '', project_id: '', priority: 'normal', due_date: '' };
  if (tEl) S.taskDraft.title = tEl.value;
  if (pEl) S.taskDraft.project_id = pEl.value;
  if (prEl) S.taskDraft.priority = prEl.value || 'normal';
  if (dEl) S.taskDraft.due_date = dEl.value || '';
}

function mountTaskPeekShell(forceRemount = false) {
  const dr = document.getElementById('taskPeekDrawer');
  if (!dr) return;
  if (!forceRemount && document.getElementById('tpBodyHost')) return;
  const projs = (S.hub && S.hub.projects) || [];
  const draft = S.taskDraft || { title: '', project_id: '', priority: 'normal', due_date: '' };
  const defProj = draft.project_id !== undefined && draft.project_id !== '' ? draft.project_id : (S.taskScopePid || S.pid || '');
  const scopeOpts = `<option value="">${esc(t('taskbar.all_projects_opt'))}</option>`
    + projs.map(p => `<option value="${esc(p.id)}" ${S.taskScopePid===p.id?'selected':''}>[${esc(p.code)}] ${esc(p.name)}</option>`).join('');
  const quickProjOpts = `<option value="">${esc(t('taskbar.no_project_opt'))}</option>`
    + projs.map(p => `<option value="${esc(p.id)}" ${defProj===p.id?'selected':''}>[${esc(p.code)}] ${esc(p.name)}</option>`).join('');
  dr.innerHTML = `
    <div class="tp-head">
      <div style="display:flex;align-items:center;gap:8px;min-width:0">
        <strong>📋 ${esc(t('taskbar.drawer_title'))}</strong>
        <span class="badge-count" id="tpHeadCount">${_taskBadgeTotal()}</span>
      </div>
      <div style="display:flex;gap:5px;align-items:center">
        <select id="tpScopeSelect" onchange="S.taskScopePid=this.value;loadTasksData()" style="max-width:145px;border-radius:6px;padding:3px 6px;border:1px solid rgba(255,255,255,.4);background:#034569;color:#fff;font-size:12px">${scopeOpts}</select>
        <button type="button" class="btn btn-sm" onclick="toggleTaskPeek(false)">✕</button>
      </div>
    </div>
    <div class="tp-quick-add">
      <div class="tp-quick-row">
        <input type="text" id="tpQuickTitle" style="flex:1;min-width:160px" placeholder="${esc(t('taskbar.title_ph'))}" value="${esc(draft.title || '')}" oninput="_syncTaskDraftFromDom()" onkeydown="if(event.key==='Enter'){event.preventDefault();addQuickTask(document.getElementById('tpQuickAddBtn'));}">
        <button type="button" class="btn btn-primary btn-sm" id="tpQuickAddBtn" onclick="addQuickTask(this)">➕ ${esc(t('taskbar.add_submit_btn'))}</button>
      </div>
      <div class="tp-quick-row">
        <select id="tpQuickProj" style="flex:1;min-width:120px" onchange="_syncTaskDraftFromDom()">${quickProjOpts}</select>
        <select id="tpQuickPrio" onchange="_syncTaskDraftFromDom()">
          <option value="normal" ${(draft.priority||'normal')==='normal'?'selected':''}>${esc(t('taskbar.prio_normal'))}</option>
          <option value="urgent" ${draft.priority==='urgent'?'selected':''}>🔥 ${esc(t('taskbar.prio_urgent'))}</option>
          <option value="low" ${draft.priority==='low'?'selected':''}>${esc(t('taskbar.prio_low'))}</option>
        </select>
        <input type="date" id="tpQuickDue" value="${esc(draft.due_date || '')}" oninput="_syncTaskDraftFromDom()" onchange="_syncTaskDraftFromDom()">
      </div>
      <div class="sub" style="font-size:11px">💡 ${esc(t('taskbar.quick_tip'))}</div>
    </div>
    <div class="tp-tabs" id="tpTabsHost"></div>
    <div id="tpManualFilterHost"></div>
    <div class="tp-body" id="tpBodyHost"></div>
  `;
}

function _renderDoneTaskCard(it) {
  const isManual = it.source === 'manual';
  const m = isManual ? { icon: '📝', lbl: t('taskbar.src_personal'), pill: 'pill-green' } : _autoKindMeta(it.kind);
  const doneTs = String(it.done_at || '').replace('T', ' ').slice(0, 16);
  const titleTxt = isManual ? (it.title || '') : `${it.ref_no ? `[${it.ref_no}] ` : ''}${it.subject || it.project_name || ''}`;
  const undoCall = isManual
    ? `toggleManualTaskDone(${jsStr(it.id)}, false, this)`
    : `restoreAutoTask(${jsStr(it.auto_key)}, this)`;
  return `<div class="tp-card is-done">
    <div class="tp-card-top">
      <div class="tp-title">${m.icon} ${esc(titleTxt)}</div>
      <span class="pill ${m.pill}">${esc(m.lbl)}</span>
    </div>
    <div class="tp-meta">
      ${it.project_code ? `<span class="pill pill-gray">[${esc(it.project_code)}] ${esc(it.project_name || '')}</span>` : ''}
      ${doneTs ? `<span class="ltr">✅ ${esc(t('taskbar.done_at_lbl', { date: doneTs }))}</span>` : ''}
      ${it.ref_no ? `<code class="ltr">${esc(it.ref_no)}</code>` : ''}
    </div>
    <div class="tp-acts">
      <button type="button" class="btn btn-sm btn-primary" onclick="${undoCall}">↩️ ${esc(t('taskbar.undo_btn'))}</button>
      ${it.project_id ? `<button type="button" class="btn btn-sm" onclick="openTaskProject(${jsStr(it.project_id)})">📂 ${esc(t('taskbar.open_item_btn'))}</button>` : ''}
      ${isManual ? `<button type="button" class="btn btn-sm btn-danger" onclick="deleteManualTaskItem(${jsStr(it.id)}, this)">🗑 ${esc(t('taskbar.delete_task_btn'))}</button>` : ''}
    </div>
  </div>`;
}

function renderTaskPeek() {
  const dr = document.getElementById('taskPeekDrawer');
  if (!dr || !S.taskPeekOpen) return;
  if (!document.getElementById('tpBodyHost')) mountTaskPeekShell(true);

  const d = S.tasksData || { manual_tasks: [], auto_tasks: [], today_focus: [], done_tasks: [], counts: {} };
  const c = d.counts || {};
  const cntEl = document.getElementById('tpHeadCount');
  if (cntEl) cntEl.textContent = String(Number(c.total_open || 0));

  const tabsEl = document.getElementById('tpTabsHost');
  if (tabsEl) {
    const doneCnt = Number(c.done_total !== undefined ? c.done_total : ((d.done_tasks || []).length || 0));
    tabsEl.innerHTML = `
      <button type="button" class="tp-tab ${S.taskPeekTab==='focus'?'active':''}" onclick="S.taskPeekTab='focus';renderTaskPeek()">🎯 ${esc(t('taskbar.tab_focus'))} (${Number(c.focus_count || 0)})</button>
      <button type="button" class="tp-tab ${S.taskPeekTab==='auto'?'active':''}" onclick="S.taskPeekTab='auto';renderTaskPeek()">⚡ ${esc(t('taskbar.tab_auto'))} (${Number(c.auto_open || 0)})</button>
      <button type="button" class="tp-tab ${S.taskPeekTab==='manual'?'active':''}" onclick="S.taskPeekTab='manual';renderTaskPeek()">📝 ${esc(t('taskbar.tab_manual'))} (${Number(c.manual_open || 0)})</button>
      <button type="button" class="tp-tab ${S.taskPeekTab==='done'?'active':''}" onclick="S.taskPeekTab='done';renderTaskPeek()">✅ ${esc(t('taskbar.tab_done'))} (${doneCnt})</button>
    `;
  }

  const fltEl = document.getElementById('tpManualFilterHost');
  if (fltEl) {
    fltEl.innerHTML = (S.taskPeekTab === 'done' && Number(c.manual_done || 0) > 0)
      ? `<div style="padding:6px 12px;border-bottom:1px solid var(--border);background:var(--surface-2);display:flex;justify-content:flex-end">
          <button type="button" class="btn btn-sm" onclick="clearDoneManualTasks(this)">🧹 ${esc(t('taskbar.clear_done_btn'))}</button>
        </div>`
      : '';
  }

  let listHtml = '';
  if (S.taskPeekTab === 'focus') {
    const fItems = d.today_focus || [];
    listHtml = fItems.length
      ? fItems.map(it => it.source === 'manual' ? _renderManualTaskCard(it) : _renderAutoTaskCard(it)).join('')
      : `<div class="alert alert-green">${esc(t('taskbar.empty_focus'))}</div>`;
  } else if (S.taskPeekTab === 'auto') {
    const aItems = d.auto_tasks || [];
    listHtml = aItems.length
      ? aItems.map(_renderAutoTaskCard).join('')
      : `<div class="alert alert-green">${esc(t('taskbar.empty_auto'))}</div>`;
  } else if (S.taskPeekTab === 'done') {
    const dItems = d.done_tasks || [];
    listHtml = dItems.length
      ? dItems.map(_renderDoneTaskCard).join('')
      : `<div class="banner">${esc(t('taskbar.empty_done'))}</div>`;
  } else {
    const mItems = (d.manual_tasks || []).filter(tk => !tk.done);
    listHtml = mItems.length
      ? mItems.map(_renderManualTaskCard).join('')
      : `<div class="banner">${esc(t('taskbar.empty_manual'))}</div>`;
  }

  const bodyEl = document.getElementById('tpBodyHost');
  if (bodyEl) bodyEl.innerHTML = listHtml;
}

async function addQuickTask(btnEl) {
  const titleEl = document.getElementById('tpQuickTitle');
  const title = (titleEl?.value || '').trim();
  if (!title) {
    toast(t('taskbar.title_req_toast'), 'warn');
    if (titleEl) titleEl.focus();
    return;
  }
  const pid = document.getElementById('tpQuickProj')?.value || '';
  const prio = document.getElementById('tpQuickPrio')?.value || 'normal';
  const due = document.getElementById('tpQuickDue')?.value || '';
  try {
    await withBusyButton(btnEl, async () => {
      await api('/api/tasks', { body: { title, project_id: pid, priority: prio, due_date: due } });
      if (titleEl) titleEl.value = '';
      if (S.taskDraft) { S.taskDraft.title = ''; S.taskDraft.due_date = ''; }
      const dEl = document.getElementById('tpQuickDue');
      if (dEl) dEl.value = '';
      toast(t('taskbar.task_added_toast'));
      await loadTasksData();
      if (titleEl) titleEl.focus();
    });
  } catch (e) { toast(e.message, 'err'); }
}

async function toggleManualTaskDone(taskId, doneVal, btnEl) {
  try {
    await withBusyButton(btnEl, async () => {
      await api(`/api/tasks/${encodeURIComponent(taskId)}`, { body: { done: Boolean(doneVal) } });
      toast(doneVal ? t('taskbar.task_done_toast') : t('taskbar.task_reopen_toast'));
      await loadTasksData();
    });
  } catch (e) { toast(e.message, 'err'); }
}

async function deleteManualTaskItem(taskId, btnEl) {
  try {
    await withBusyButton(btnEl, async () => {
      await api(`/api/tasks/${encodeURIComponent(taskId)}`, { body: { delete: true } });
      toast(t('taskbar.task_deleted_toast'));
      await loadTasksData();
    });
  } catch (e) { toast(e.message, 'err'); }
}

async function snoozeAutoTask(autoKey, btnEl) {
  try {
    await withBusyButton(btnEl, async () => {
      const d = S.tasksData || {};
      const srcItem = [...(d.auto_tasks || []), ...(d.today_focus || [])].find(x => x.auto_key === autoKey) || null;
      await api('/api/tasks/auto-dismiss', { body: { auto_key: autoKey, meta: srcItem } });
      toast(t('taskbar.snoozed_toast'));
      await loadTasksData();
    });
  } catch (e) { toast(e.message, 'err'); }
}

async function restoreAutoTask(autoKey, btnEl) {
  try {
    await withBusyButton(btnEl, async () => {
      await api('/api/tasks/auto-dismiss', { body: { auto_key: autoKey, restore: true } });
      toast(t('taskbar.auto_restored_toast'));
      await loadTasksData();
    });
  } catch (e) { toast(e.message, 'err'); }
}

async function clearDoneManualTasks(btnEl) {
  try {
    await withBusyButton(btnEl, async () => {
      await api('/api/tasks/clear-done', { body: { project_id: S.taskScopePid || '' } });
      toast(t('taskbar.done_cleared_toast'));
      await loadTasksData();
    });
  } catch (e) { toast(e.message, 'err'); }
}

function openTaskProject(pid) {
  if (!pid) return;
  S.pid = pid;
  toggleTaskPeek(false);
  navigate('overview', pid);
}

function openAutoTaskTarget(pid, targetView, sectionId) {
  if (pid) S.pid = pid;
  toggleTaskPeek(false);
  if (targetView === 'backup') { navigate('overview', pid); return; }
  if (targetView === 'section' && sectionId) { navigate('section', sectionId); return; }
  if (targetView === 'scanner') { navigate('scanner', pid); return; }
  navigate('overview', pid);
}

/* ── Ctrl+K Command Palette ─────────────────────────────────────────────── */
function _buildCommandCatalog() {
  const items = [];
  const add = (sec, icon, label, sub, run) => items.push({ sec, icon, label, sub, run });

  add(t('taskbar.cmd_sec_actions'), '📋', t('taskbar.action_tasks'), 'Side Peek', () => toggleTaskPeek(true));
  add(t('taskbar.cmd_sec_actions'), '➕', t('taskbar.quick_add_btn'), t('taskbar.action_tasks'), () => openQuickAddTaskPeek());
  add(t('taskbar.cmd_sec_actions'), '📌', t('taskbar.action_pin'), t('taskbar.tray_label'), () => pinCurrentContext());
  add(t('taskbar.cmd_sec_actions'), '🔍', t('taskbar.action_search'), '', () => navigate('search'));
  if (S.pid) {
    add(t('taskbar.cmd_sec_actions'), '📊', t('taskbar.action_weekly'), 'Excel + PDF', () => openWeeklyReportModal(S.pid));
    add(t('taskbar.cmd_sec_actions'), '📷', t('nav.scanner'), '', () => navigate('scanner'));
    add(t('taskbar.cmd_sec_actions'), '🧹', t('nav.organizer'), '', () => navigate('organizer'));
    add(t('taskbar.cmd_sec_actions'), '💬', t('nav.whatsapp_archive'), '', () => navigate('whatsapp'));
    add(t('taskbar.cmd_sec_actions'), '🧬', t('nav.duplicates'), '', () => navigate('duplicates'));
    add(t('taskbar.cmd_sec_actions'), '🎨', t('nav.templates'), '', () => navigate('templates'));
  }
  add(t('taskbar.cmd_sec_actions'), '⚠️', t('taskbar.action_decisions'), '', () => navigate('decisions'));
  add(t('taskbar.cmd_sec_actions'), '⚙️', t('taskbar.action_settings'), '', () => navigate('settings'));
  add(t('taskbar.cmd_sec_actions'), '➕', t('taskbar.action_new_proj'), '', () => openNewProjectModal());

  for (const p of ((S.hub && S.hub.projects) || [])) {
    add(t('taskbar.cmd_sec_projects'), '📁', `[${p.code}] ${p.name}`, p.location || p.contract_no || '', () => {
      S.pid = p.id;
      navigate('overview', p.id);
    });
  }
  const secs = (S.projDetail && S.projDetail.sections) || (S.hub && S.hub.sections) || [];
  if (S.pid) {
    for (const s of secs) {
      add(t('taskbar.cmd_sec_sections'), '📂', s.label, s.ref_prefix || '', () => navigate('section', s.id));
    }
  }
  for (const pin of (S.pinnedTray || [])) {
    add(t('taskbar.cmd_sec_pinned'), pin.icon || '📌', pin.title, '', () => openPinnedItem(pin.id));
  }
  if (S.tasksData && Array.isArray(S.tasksData.manual_tasks)) {
    for (const tk of S.tasksData.manual_tasks.filter(x => !x.done).slice(0, 8)) {
      add(t('taskbar.cmd_sec_tasks'), tk.priority === 'urgent' ? '🔥' : '📝', tk.title, tk.project_code || '', () => toggleTaskPeek(true, 'manual'));
    }
  }
  return items;
}

function openCommandPalette() {
  S.cmdOpen = true;
  S.cmdQuery = '';
  S.cmdIdx = 0;
  const bd = document.getElementById('cmdPaletteBackdrop');
  const inp = document.getElementById('cmdPaletteInput');
  const foot = document.getElementById('cmdPaletteFoot');
  if (!bd || !inp) return;
  bd.classList.add('show');
  inp.placeholder = t('taskbar.cmd_ph');
  inp.value = '';
  if (foot) foot.innerHTML = `<span>${esc(t('taskbar.cmd_hint'))}</span><span class="ltr">Ctrl+K</span>`;
  renderCommandPaletteResults();
  setTimeout(() => inp.focus(), 10);
}

function closeCommandPalette() {
  S.cmdOpen = false;
  const bd = document.getElementById('cmdPaletteBackdrop');
  if (bd) bd.classList.remove('show');
}

function onCommandPaletteInput(val) {
  S.cmdQuery = val || '';
  S.cmdIdx = 0;
  renderCommandPaletteResults();
}

function stepCommandSelection(delta) {
  if (!S.cmdItems.length) return;
  S.cmdIdx = (S.cmdIdx + delta + S.cmdItems.length) % S.cmdItems.length;
  renderCommandPaletteResults();
}

function runSelectedCommand(idx = null) {
  const target = idx === null ? S.cmdItems[S.cmdIdx] : S.cmdItems[idx];
  if (!target) return;
  closeCommandPalette();
  target.run();
}

function renderCommandPaletteResults() {
  const list = document.getElementById('cmdPaletteList');
  if (!list) return;
  const q = String(S.cmdQuery || '').trim().toLowerCase();
  const catalog = _buildCommandCatalog();
  const filtered = q
    ? catalog.filter(x => `${x.label} ${x.sub} ${x.sec}`.toLowerCase().includes(q))
    : catalog;
  S.cmdItems = filtered.slice(0, 24);
  if (S.cmdIdx >= S.cmdItems.length) S.cmdIdx = 0;
  if (!S.cmdItems.length) {
    list.innerHTML = `<div class="banner" style="margin:6px">${esc(t('taskbar.cmd_empty'))}</div>`;
    return;
  }
  let html = '';
  let lastSec = '';
  S.cmdItems.forEach((it, i) => {
    if (it.sec !== lastSec) {
      lastSec = it.sec;
      html += `<div class="cmd-sec">${esc(lastSec)}</div>`;
    }
    html += `<button type="button" class="cmd-item ${i===S.cmdIdx?'is-active':''}" onclick="runSelectedCommand(${i})">
      <span style="display:flex;align-items:center;gap:8px"><span>${esc(it.icon)}</span><strong>${esc(it.label)}</strong></span>
      <span class="sub">${esc(it.sub || '')}</span>
    </button>`;
  });
  list.innerHTML = html;
}

(async function boot() {
  loadTaskbarPrefs();
  window.addEventListener('resize', _syncTopbarHeight);
  try {
    const tb = document.getElementById('mainTopbar');
    if (tb && typeof ResizeObserver === 'function') {
      new ResizeObserver(_syncTopbarHeight).observe(tb);
    }
  } catch (_) {}
  await ensureI18nLoaded();
  applyStaticI18n();
  _syncTopbarHeight();
  await refreshHub();
  renderHubView();
  S.pollTimer = setInterval(() => { refreshHub(true); }, 12000);
})();
</script>
