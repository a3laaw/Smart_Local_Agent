/* ── Correspondence Cross-Linking UI (Multi-Party Threading + Smart Topic Match) ─ */
let _letterRowsCtx = [];
let _letterModalCtx = null;
let _autoLinkMatches = [];

function renderRelatedLinksCell(r, retView, retSec) {
  if (r.section !== 'incoming' && r.section !== 'outgoing') {
    return r.related_letters ? `<span class="sub">${esc(r.related_letters)}</span>` : '—';
  }
  const idx = _letterRowsCtx.length;
  _letterRowsCtx.push({ row: r, retView: retView || 'section', retSec: retSec || r.section });
  const items = Array.isArray(r.linked_letters) ? r.linked_letters : [];
  let badges = '';
  if (items.length) {
    badges = items.map(m => {
      const tip = `${m.party_label || ''}: ${m.ref_no || ''} — ${m.subject || ''}`.trim();
      return `<button type="button" class="pill pill-blue" style="border:none;cursor:pointer;text-align:right;margin:1px 0" title="${esc(tip)}" onclick="openLetterLinkModal(${idx})">🔗 ${esc(m.party_label || '')}: <span class="ltr">${esc(m.ref_no || '')}</span></button>`;
    }).join('<br>');
  } else if (r.related_letters) {
    badges = `<div class="sub" style="font-size:11.5px;margin-bottom:3px">${esc(r.related_letters)}</div>`;
  }
  const replyBtn = r.section === 'incoming'
    ? `<button type="button" class="btn btn-primary btn-sm" onclick="openReplyFromLetter(${idx})">↩️ ${esc(t('letters.issue_reply_btn'))}</button>`
    : '';
  const waBtn = `<button type="button" class="btn btn-sm" title="${esc(t('contacts.wa_row_btn'))}" onclick="openQuickWhatsAppForRow(${idx})">💬</button>`;
  return `<div style="display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:185px">
    ${badges}
    <div style="display:flex;gap:4px;flex-wrap:wrap">
      <button type="button" class="btn btn-sm" onclick="openLetterLinkModal(${idx})">🔗 ${esc(t('letters.link_btn'))}</button>
      ${replyBtn}
      ${waBtn}
    </div>
  </div>`;
}

async function openQuickWhatsAppForRow(rowIdx) {
  const ctx = _letterRowsCtx[rowIdx];
  if (!ctx || !ctx.row) return;
  const r = ctx.row;
  if (!S.projDetail || !S.projDetail.project || S.projDetail.project.id !== S.pid) {
    try { S.projDetail = await api(`/api/projects/${encodeURIComponent(S.pid)}`); } catch (_) {}
  }
  const projName = (S.projDetail && S.projDetail.project && S.projDetail.project.name) || '';
  const msg = t('contacts.wa_row_msg', {
    project: projName,
    ref: r.ref_no || '—',
    date: r.date || r.doc_date || '—',
    subject: r.subject || '—',
  });
  const rel = r.file_rel ? String(r.file_rel).replace(/^\.\.\//, '') : '';
  openSendWhatsAppModal('', r.party_label || r.party || '', rel, msg);
}

let _pendingReplyCtx = null;
async function openReplyFromLetter(rowIdx) {
  const ctx = _letterRowsCtx[rowIdx];
  if (!ctx || !ctx.row) return;
  const r = ctx.row;
  if (!S.projDetail || !S.projDetail.project || S.projDetail.project.id !== S.pid) {
    try { S.projDetail = await api(`/api/projects/${encodeURIComponent(S.pid)}`); } catch (_) {}
  }
  const tpls = (S.projDetail && S.projDetail.templates) || [];
  const outTpls = tpls.filter(x => x.section === 'outgoing' && x.ready_to_issue && !(x.orphan_fields && x.orphan_fields.length));
  const replyCtx = {
    ref_no: r.ref_no || '',
    sheet: r.sheet || '',
    section: r.section || 'incoming',
    subject: r.subject || '',
    party: r.party || r.party_label || '',
    doc_date: r.date || r.doc_date || '',
  };
  if (outTpls.length === 1) {
    openIssueModal(outTpls[0].name, false, replyCtx);
    return;
  }
  if (outTpls.length > 1) {
    _pendingReplyCtx = replyCtx;
    const btns = outTpls.map(tp => `<button type="button" class="btn btn-primary" style="justify-content:flex-start" onclick="const c=_pendingReplyCtx;_pendingReplyCtx=null;openIssueModal(${jsStr(tp.name)},false,c)">🚀 ${esc(tp.display_name || tp.name)} <span class="sub ltr" style="margin-right:auto">${esc(tp.name)}</span></button>`).join('');
    openModal(
      `↩️ ${esc(t('letters.pick_reply_tpl_title'))}`,
      `<p class="sub">${esc(t('letters.replying_to_banner', { ref: replyCtx.ref_no || '—' }))}</p>
       <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">${btns}</div>`,
      `<button class="btn" onclick="closeModal()">${esc(t('common.close'))}</button>`
    );
    return;
  }
  openModal(
    `↩️ ${esc(t('letters.issue_reply_btn'))}`,
    `<div class="banner warn"><span>⚠️</span><div>${esc(t('letters.no_reply_tpl_msg'))}</div></div>`,
    `<button class="btn" onclick="closeModal()">${esc(t('common.close'))}</button>
     <button class="btn" onclick="closeModal();openLetterLinkModal(${rowIdx})">🔗 ${esc(t('letters.link_existing_reply_btn'))}</button>
     <button class="btn btn-primary" onclick="closeModal();navigate('templates')">🎨 ${esc(t('letters.go_templates_btn'))}</button>`
  );
}

async function openLetterLinkModal(rowIdx) {
  const ctx = _letterRowsCtx[rowIdx];
  if (!ctx || !ctx.row) return;
  const r = ctx.row;
  try {
    const qs = new URLSearchParams({
      ref_no: r.ref_no || '',
      sheet: r.sheet || '',
      section: r.section || '',
      subject: r.subject || '',
      doc_date: r.date || r.doc_date || '',
    }).toString();
    const res = await api(`/api/projects/${encodeURIComponent(S.pid)}/letters/links?${qs}`);
    _letterModalCtx = {
      rowIdx,
      letter: r,
      retView: ctx.retView,
      retSec: ctx.retSec,
      allLetters: res.letters || [],
      suggestions: res.suggestions || [],
      threads: res.threads || [],
    };
    paintLetterLinkModal();
  } catch (e) { toast(e.message, 'err'); }
}

function paintLetterLinkModal() {
  if (!_letterModalCtx) return;
  const { letter, allLetters, suggestions } = _letterModalCtx;
  const selfNormRef = String(letter.ref_no || '').trim();
  const selfSheet = String(letter.sheet || '').trim();
  const freshSelf = allLetters.find(x => x.ref_no === selfNormRef && (!selfSheet || x.sheet === selfSheet)) || letter;
  const rawLinked = Array.isArray(freshSelf.linked_letters) ? freshSelf.linked_letters : (letter.linked_letters || []);
  const curLinked = [...rawLinked].sort((a, b) => {
    const da = String(a.doc_date || a.date || '');
    const db = String(b.doc_date || b.date || '');
    if (da && db && da !== db) return da.localeCompare(db);
    if (da && !db) return -1;
    if (!da && db) return 1;
    return String(a.ref_no || '').localeCompare(String(b.ref_no || ''));
  });
  _letterModalCtx.curLinked = curLinked;

  const linkedSet = new Set(curLinked.map(m => `${m.sheet || ''}::${m.ref_no || ''}`));
  const threadHtml = curLinked.length ? curLinked.map((m, i) => `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 9px;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;margin-bottom:5px">
      <div>
        <span class="pill pill-teal">${esc(m.party_label || '')}</span>
        <strong class="ltr">${esc(m.ref_no || '—')}</strong>
        ${m.doc_date ? `<span class="sub ltr">${esc(m.doc_date)}</span>` : ''}
        <div class="sub" style="margin-top:2px">${esc(m.subject || '')}</div>
      </div>
      <button type="button" class="btn btn-danger btn-sm" onclick="unlinkTargetLetter(${i}, this)">✕ ${esc(t('letters.unlink_action'))}</button>
    </div>`).join('') : `<p class="sub">${esc(t('letters.empty_thread'))}</p>`;

  const sugHtml = suggestions.length ? suggestions.map((sg, i) => {
    const kws = (sg.matched_keywords || []).join(' · ');
    return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 9px;border:1px dashed #2563eb;background:#eff6ff;border-radius:7px;margin-bottom:5px">
      <div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">
          <span class="pill pill-blue">${esc(t('letters.match_pct', { pct: sg.pct || 0 }))}</span>
          <span class="pill pill-teal">${esc(sg.party_label || '')}</span>
          <strong class="ltr">${esc(sg.ref_no || '—')}</strong>
          ${sg.doc_date ? `<span class="sub ltr">${esc(sg.doc_date)}</span>` : ''}
        </div>
        <div style="margin-top:2px">${esc(sg.subject || '')}</div>
        ${kws ? `<div class="sub" style="font-size:11px">${esc(t('letters.keywords_label', { words: kws }))}</div>` : ''}
      </div>
      <button type="button" class="btn btn-primary btn-sm" onclick="linkSuggestedLetter(${i}, this)">🔗 ${esc(t('letters.link_action'))}</button>
    </div>`;
  }).join('') : `<p class="sub">${esc(t('letters.empty_suggestions'))}</p>`;

  const searchCandidates = allLetters
    .filter(x => !(x.ref_no === selfNormRef && x.sheet === selfSheet) && !linkedSet.has(`${x.sheet || ''}::${x.ref_no || ''}`))
    .sort((a, b) => {
      const da = String(a.doc_date || a.date || '');
      const db = String(b.doc_date || b.date || '');
      if (da && db && da !== db) return db.localeCompare(da);
      if (db && !da) return 1;
      if (da && !db) return -1;
      return Number(b.row || 0) - Number(a.row || 0);
    });
  _letterModalCtx.searchCandidates = searchCandidates;

  openModal(
    `🔗 ${esc(t('letters.link_modal_title'))}`,
    `<div style="background:var(--surface-2);padding:10px;border-radius:8px;border:1px solid var(--border);margin-bottom:12px">
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <span class="pill pill-purple">${esc(freshSelf.party_label || letter.party_label || letter.sheet || '')}</span>
        <strong class="ltr">${esc(letter.ref_no || '—')}</strong>
        <span class="sub ltr">${esc(letter.date || letter.doc_date || '')}</span>
      </div>
      <div style="font-weight:700;margin-top:4px">${esc(letter.subject || '')}</div>
    </div>
    <h4 style="margin:0 0 6px">🔗 ${esc(t('letters.current_thread'))}</h4>
    <div style="margin-bottom:12px">${threadHtml}</div>
    <h4 style="margin:0 0 6px">✨ ${esc(t('letters.suggested_matches'))}</h4>
    <div style="margin-bottom:12px">${sugHtml}</div>
    <h4 style="margin:0 0 6px">📋 ${esc(t('letters.all_letters'))}</h4>
    <input id="llSearchInput" placeholder="${esc(t('overview.search_placeholder'))}" oninput="filterAllProjectLetters(this.value)" style="width:100%;padding:7px 10px;border:1px solid var(--border-strong);border-radius:7px;margin-bottom:8px">
    <div id="llAllBox" style="max-height:220px;overflow:auto">${buildAllLettersPickerHtml(searchCandidates, '')}</div>`,
    `<button class="btn" onclick="closeModal()">${esc(t('common.close'))}</button>`,
    true
  );
}

function buildAllLettersPickerHtml(list, q) {
  const ql = String(q || '').trim().toLowerCase();
  const filt = ql ? list.filter(x => `${x.ref_no} ${x.subject} ${x.party_label} ${x.sheet}`.toLowerCase().includes(ql)) : list;
  if (!filt.length) return `<p class="sub">${esc(t('overview.empty_search'))}</p>`;
  return filt.slice(0, 50).map(x => {
    const origIdx = (_letterModalCtx.searchCandidates || []).indexOf(x);
    return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--border)">
      <div>
        <span class="pill pill-gray">${esc(x.party_label || x.sheet || '')}</span>
        <strong class="ltr">${esc(x.ref_no || '—')}</strong>
        <span class="sub ltr">${esc(x.doc_date || '')}</span>
        <div class="sub">${esc(x.subject || '')}</div>
      </div>
      <button type="button" class="btn btn-sm" onclick="linkCandidateLetter(${origIdx}, this)">🔗 ${esc(t('letters.link_action'))}</button>
    </div>`;
  }).join('');
}

function filterAllProjectLetters(q) {
  if (!_letterModalCtx) return;
  const box = document.getElementById('llAllBox');
  if (box) box.innerHTML = buildAllLettersPickerHtml(_letterModalCtx.searchCandidates || [], q);
}

async function _execLinkPair(targetItem, btnEl) {
  if (!_letterModalCtx || !targetItem) return;
  const selfL = _letterModalCtx.letter;
  try {
    await withBusyButton(btnEl, async () => {
      const res = await api(`/api/projects/${encodeURIComponent(S.pid)}/letters/link`, {
        body: {
          items: [
            { ref_no: selfL.ref_no, sheet: selfL.sheet, section: selfL.section, subject: selfL.subject, doc_date: selfL.date || selfL.doc_date, party_role: selfL.party_role, log_name: selfL.log_name, row: selfL.row },
            { ref_no: targetItem.ref_no, sheet: targetItem.sheet, section: targetItem.section, subject: targetItem.subject, doc_date: targetItem.doc_date || targetItem.date, party_role: targetItem.party_role, log_name: targetItem.log_name, row: targetItem.row },
          ],
          sync_excel: true,
        }
      });
      toast(t(res.excel_locked ? 'letters.excel_locked_warn' : 'letters.linked_toast'), res.excel_locked ? 'warn' : 'ok');
      await refreshLetterModalAndView();
    });
  } catch (e) { toast(e.message, 'err'); }
}

function linkSuggestedLetter(i, btnEl) { _execLinkPair((_letterModalCtx?.suggestions || [])[i], btnEl); }
function linkCandidateLetter(i, btnEl) { _execLinkPair((_letterModalCtx?.searchCandidates || [])[i], btnEl); }

async function unlinkTargetLetter(i, btnEl) {
  if (!_letterModalCtx) return;
  const selfL = _letterModalCtx.letter;
  const tgt = (_letterModalCtx.curLinked || [])[i];
  if (!tgt) return;
  try {
    await withBusyButton(btnEl, async () => {
      await api(`/api/projects/${encodeURIComponent(S.pid)}/letters/unlink`, {
        body: {
          ref_no: selfL.ref_no,
          sheet: selfL.sheet,
          target_ref_no: tgt.ref_no,
          target_sheet: tgt.sheet,
          sync_excel: true,
        }
      });
      toast(t('letters.unlinked_toast'));
      await refreshLetterModalAndView();
    });
  } catch (e) { toast(e.message, 'err'); }
}

async function refreshLetterModalAndView() {
  if (!_letterModalCtx) return;
  const selfL = _letterModalCtx.letter;
  const qs = new URLSearchParams({
    ref_no: selfL.ref_no || '',
    sheet: selfL.sheet || '',
    section: selfL.section || '',
    subject: selfL.subject || '',
    doc_date: selfL.date || selfL.doc_date || '',
  }).toString();
  const res = await api(`/api/projects/${encodeURIComponent(S.pid)}/letters/links?${qs}`);
  _letterModalCtx.allLetters = res.letters || [];
  _letterModalCtx.suggestions = res.suggestions || [];
  paintLetterLinkModal();
  await refreshHub(true);
  if (_letterModalCtx.retView === 'overview') await renderOverviewView();
  else if (_letterModalCtx.retSec) await renderSectionView(_letterModalCtx.retSec);
}

async function openAutoLinkModal(retView = 'section', retSec = 'incoming', btnEl = null) {
  try {
    const res = await withBusyButton(btnEl, () => api(`/api/projects/${encodeURIComponent(S.pid)}/letters/auto-link`, {
      body: { apply: false, min_score: 0.58 }
    }));
    if (!res) return;
    _autoLinkMatches = res.matches || [];
    const listHtml = _autoLinkMatches.length ? _autoLinkMatches.map((m, i) => {
      const kws = (m.matched_keywords || []).join(' · ');
      return `<label style="display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--surface-2);cursor:pointer">
        <input type="checkbox" id="autolk_chk_${i}" checked style="margin-top:4px">
        <div style="flex:1">
          <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:4px">
            <span class="pill pill-blue">${esc(t('letters.match_pct', { pct: m.pct || 0 }))}</span>
            ${kws ? `<span class="sub" style="font-size:11.5px">${esc(t('letters.keywords_label', { words: kws }))}</span>` : ''}
          </div>
          <div style="margin-bottom:2px"><span class="pill pill-teal">${esc(m.a.party_label || '')}</span> <strong class="ltr">${esc(m.a.ref_no || '—')}</strong> — ${esc(m.a.subject || '')}</div>
          <div><span class="pill pill-purple">${esc(m.b.party_label || '')}</span> <strong class="ltr">${esc(m.b.ref_no || '—')}</strong> — ${esc(m.b.subject || '')}</div>
        </div>
      </label>`;
    }).join('') : `<div class="alert alert-blue">${esc(t('letters.empty_auto'))}</div>`;

    openModal(
      `🔗 ${esc(t('letters.auto_modal_title'))}`,
      `<div style="max-height:420px;overflow:auto">${listHtml}</div>`,
      `<button class="btn" onclick="closeModal()">${esc(t('common.close'))}</button>
       ${_autoLinkMatches.length ? `<button class="btn btn-primary" onclick="applySelectedAutoLinks(${jsStr(retView)},${jsStr(retSec)}, this)">✅ ${esc(t('letters.apply_auto_btn'))}</button>` : ''}`,
      true
    );
  } catch (e) { toast(e.message, 'err'); }
}

async function applySelectedAutoLinks(retView, retSec, btnEl) {
  const chosen = [];
  _autoLinkMatches.forEach((m, i) => {
    const el = document.getElementById('autolk_chk_' + i);
    if (el && el.checked) chosen.push(m);
  });
  if (!chosen.length) { toast(t('letters.empty_auto')); return; }
  try {
    await withBusyButton(btnEl, async () => {
      const res = await api(`/api/projects/${encodeURIComponent(S.pid)}/letters/auto-link`, {
        body: { apply: true, sync_excel: true, pairs: chosen }
      });
      closeModal();
      await refreshHub(true);
      if (retView === 'overview') await renderOverviewView();
      else if (retSec) await renderSectionView(retSec);
      toast(t('letters.auto_done_toast', { count: res.linked_pairs || chosen.length }));
      if (res.excel_locked) toast(t('letters.excel_locked_warn'), 'warn');
    });
  } catch (e) { toast(e.message, 'err'); }
}

/* ── Uploaded Templates Gallery ─────────────────────────────────────────── */
async function renderTemplatesView() {
  const res = await api(`/api/projects/${encodeURIComponent(S.pid)}/templates`);
  const tpls = res.templates || [];
  const mv = document.getElementById('mainView');

  const cards = tpls.map(t0 => {
    const orph = (t0.orphan_fields || []).length;
    const badge = orph
      ? `<span class="pill pill-red">⚠️ ${esc(t('templates.status_moved', { count: orph }))}</span>`
      : (t0.ready_to_issue ? `<span class="pill pill-green">✅ ${esc(t('templates.status_ready'))}</span>` : `<span class="pill pill-amber">⚙️ ${esc(t('templates.status_setup'))}</span>`);
    const secBadge = t0.section_confirmed && t0.section
      ? `<span class="pill pill-teal">${esc(secLabel(t0.section))}</span>`
      : (t0.suggested_section ? `<span class="pill pill-amber">[${esc(t('common.suggested_tag'))}] ${esc(secLabel(t0.suggested_section))}</span>` : `<span class="pill pill-gray">${esc(t('templates.no_section'))}</span>`);
    return `<div class="proj-card">
      <div style="display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap">
        <span class="pill pill-blue ltr">${esc(t0.ext)}</span>
        ${badge}
      </div>
      <div>
        <h3 style="margin:4px 0 2px;font-size:15px">${esc(t0.display_name || t0.name)}</h3>
        <div class="sub ltr">${esc(t0.name)}</div>
      </div>
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        ${secBadge}
        <span class="pill pill-gray">${esc(t('templates.fields_count', { count: t0.fields_count || 0 }))}</span>
        ${t0.tables_count ? `<span class="pill pill-purple">${esc(t('templates.tables_count', { count: t0.tables_count }))}</span>` : ''}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;align-items:center">
        ${t0.ready_to_issue && !orph
          ? `<button class="btn btn-primary btn-sm" onclick="openIssueModal(${jsStr(t0.name)})">🚀 ${esc(t('templates.issue_btn'))}</button>
             <button class="btn btn-blue btn-sm" onclick="navigate('studio',${jsStr(t0.name)})">🎨 ${esc(t('templates.setup_btn'))}</button>`
          : `<button class="btn btn-primary btn-sm" onclick="navigate('studio',${jsStr(t0.name)})">🎨 ${esc(t('templates.setup_btn'))}</button>`
        }
        <a class="btn btn-sm" href="/api/projects/${encodeURIComponent(S.pid)}/download?rel=${encodeURIComponent('4_Project_Templates/' + t0.name)}">⬇ ${esc(t('templates.download_orig'))}</a>
        <span class="action-sep">
          <button class="btn btn-danger btn-sm" onclick="archiveTemplateFile(${jsStr(t0.name)})">📦 ${esc(t('common.archive_move'))}</button>
        </span>
      </div>
    </div>`;
  }).join('');

  const headerCard = `
    <div class="card">
      <div class="card-header" style="margin-bottom:0">
        <div>
          <h2 class="card-title">🎨 ${esc(t('templates.title'))}</h2>
          <p class="sub">${esc(t('hub.tip_once'))}</p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="document.getElementById('tplUploadInput').click()">📤 ${esc(t('templates.upload_btn'))}</button>
          <button class="btn" onclick="openDesktopFolder('templates')">📁 ${esc(t('templates.open_folder'))}</button>
        </div>
      </div>
    </div>`;

  const uploadDropCard = `
    <div class="card">
      <div class="dropzone" onclick="document.getElementById('tplUploadInput').click()"
           ondragover="event.preventDefault();this.classList.add('drag')"
           ondragleave="this.classList.remove('drag')"
           ondrop="event.preventDefault();this.classList.remove('drag');uploadTemplateFiles(event.dataTransfer.files)">
        <input type="file" id="tplUploadInput" accept=".xlsx,.xlsm,.docx" style="display:none" onchange="uploadTemplateFiles(this.files)">
        <strong id="tplUploadLbl" style="font-size:15px">📤 ${esc(t('templates.upload_btn'))}</strong>
      </div>
    </div>`;

  const tplsListHtml = tpls.length
    ? `<div class="grid-cards" style="margin-bottom:14px">${cards}</div>`
    : `<div class="alert alert-blue">${esc(t('templates.empty'))}</div>`;

  mv.innerHTML = headerCard + (tpls.length ? (tplsListHtml + uploadDropCard) : (uploadDropCard + tplsListHtml));
}

async function uploadTemplateFiles(fileList, preselectSection = '') {
  if (!fileList || !fileList.length) return;
  const f = fileList[0];
  const lbl = document.getElementById('tplUploadLbl');
  const origTxt = lbl ? lbl.textContent : '';
  if (lbl) lbl.textContent = '⏳ ' + t('templates.uploading_progress');
  try {
    toast(t('templates.uploading_progress'));
    const data_b64 = await fileToBase64(f);
    const res = await api(`/api/projects/${encodeURIComponent(S.pid)}/templates/upload`, {
      body: { name: f.name, data_b64, section: preselectSection }
    });
    await refreshHub();
    const tname = res.template_name || res.name || f.name;
    toast(t('templates.uploaded_toast'));
    await navigate('studio', tname);
  } catch (e) {
    if (lbl && origTxt) lbl.textContent = origTxt;
    toast(e.message, 'err');
  }
}

function archiveTemplateFile(tname) {
  openConfirmModal(t('templates.archive_confirm', { name: tname }), t('templates.archive_confirm_btn'), async () => {
    try {
      await api(`/api/projects/${encodeURIComponent(S.pid)}/templates/${encodeURIComponent(tname)}/archive`, { body: {} });
      await refreshHub();
      await renderTemplatesView();
      toast(t('templates.archived_toast'));
    } catch (e) { toast(e.message, 'err'); }
  });
}

/* ── Split-View Visual Template Studio ───────────────────────────────────── */
async function renderStudioView(tplName, sheetOverride = '') {
  S.studioTpl = tplName;
  const encP = encodeURIComponent(S.pid), encT = encodeURIComponent(tplName);
  const [pRes, rRes] = await Promise.all([
    api(`/api/projects/${encP}/templates/${encT}/profile`),
    api(`/api/projects/${encP}/templates/${encT}/render${sheetOverride ? '?sheet=' + encodeURIComponent(sheetOverride) : ''}`)
  ]);
  if (!sheetOverride || !S.studioProfile || S.studioProfile.template_name !== tplName) {
    S.studioProfile = JSON.parse(JSON.stringify(pRes.profile));
    S.studioProfile._next_ref = pRes.next_ref;
    S.studioSel = null;
    S.studioRange = null;
    S.studioTab = 'inspector';
  }
  S.studioRender = rRes.render;
  S.studioSheet = rRes.render.active_sheet || '';
  if (rRes.render.kind === 'docx') S.studioDocxMode = 'html';
  paintStudio();
}

async function switchStudioSheet(sh) {
  const rRes = await api(`/api/projects/${encodeURIComponent(S.pid)}/templates/${encodeURIComponent(S.studioTpl)}/render?sheet=${encodeURIComponent(sh)}`);
  S.studioRender = rRes.render;
  S.studioSheet = rRes.render.active_sheet || sh;
  S.studioSel = null;
  S.studioRange = null;
  paintStudio();
}

function findMappedFieldForTarget(tgt) {
  const flds = (S.studioProfile && S.studioProfile.fields) || [];
  return flds.findIndex(f => {
    const tk = f.target || {};
    if (tgt.kind === 'xlsx_cell') return tk.kind === 'xlsx_cell' && tk.sheet === tgt.sheet && tk.coord === tgt.coord;
    if (tgt.kind === 'docx_cell') return tk.kind === 'docx_cell' && Number(tk.table_idx) === Number(tgt.table_idx) && Number(tk.row_idx) === Number(tgt.row_idx) && Number(tk.col_idx) === Number(tgt.col_idx);
    if (tgt.kind === 'docx_span') return tk.kind === 'docx_span' && Number(tk.para_idx) === Number(tgt.para_idx) && tk.match_text === tgt.match_text;
    if (tgt.kind === 'docx_paragraph') return tk.kind === 'docx_paragraph' && Number(tk.para_idx) === Number(tgt.para_idx);
    return false;
  });
}

function buildVisualCanvasHtml(ren, prof, interactive = true) {
  if (!ren) return `<div class="sub">${esc(t('studio.no_preview'))}</div>`;
  const curZoom = interactive ? (S.studioZoom || 100) : (S.issuePreviewZoom || 100);
  const zoomCss = `transform:scale(${curZoom / 100});`;

  if (ren.kind === 'xlsx') {
    const sh = ren.active_sheet;
    const fldByCoord = {};
    const suggByCoord = {};
    const tblByCoord = {};
    const protSet = new Set();
    if (prof) {
      for (const p of (prof.protected_cells || [])) if (p.sheet === sh) protSet.add(p.coord);
      for (const f of (prof.fields || [])) {
        if (f.target && f.target.sheet === sh && f.target.coord) fldByCoord[f.target.coord] = f;
      }
      for (const sf of ((prof.suggestions && prof.suggestions.fields) || [])) {
        if (sf.target && sf.target.sheet === sh && sf.target.coord && !fldByCoord[sf.target.coord]) suggByCoord[sf.target.coord] = sf;
      }
      for (const tb of (prof.repeating_tables || [])) {
        if (tb.sheet === sh) {
          for (const col of (tb.columns || [])) tblByCoord[`${col.col}${tb.template_row}`] = `${tb.label}: ${col.label}`;
        }
      }
    }

    const colOffsets = [38];
    for (const c of (ren.columns || [])) colOffsets.push(colOffsets[colOffsets.length - 1] + (c.hidden ? 0 : (c.width_px || 80)));
    const rowOffsets = [24];
    for (const r of (ren.rows || [])) rowOffsets.push(rowOffsets[rowOffsets.length - 1] + (r.hidden ? 0 : (r.height_px || 22)));

    const colHeaders = (ren.columns || []).filter(c => !c.hidden).map(c =>
      `<th class="xl-col-hdr ltr" style="width:${c.width_px||80}px;min-width:${c.width_px||80}px">${esc(c.letter)}</th>`
    ).join('');

    const rng = (interactive && S.studioRange && S.studioRange.sheet === sh) ? S.studioRange : null;
    const bodyRows = (ren.rows || []).filter(r => !r.hidden).map(row => {
      const tds = (row.cells || []).map(cell => {
        const st = cell.style || {};
        const css = [];
        if (st.bg) css.push(`background-color:${st.bg}`);
        if (st.color) css.push(`color:${st.color}`);
        if (st.bold) css.push('font-weight:700');
        if (st.italic) css.push('font-style:italic');
        if (st.underline) css.push('text-decoration:underline');
        if (st.size) css.push(`font-size:${Math.min(Math.max(st.size, 9), 22)}pt`);
        if (st.align) css.push(`text-align:${st.align}`);
        if (st.valign) css.push(`vertical-align:${st.valign}`);
        if (st.bt) css.push(`border-top:${st.bt}`);
        if (st.br) css.push(`border-right:${st.br}`);
        if (st.bb) css.push(`border-bottom:${st.bb}`);
        if (st.bl) css.push(`border-left:${st.bl}`);

        const cls = ['xl-cell'];
        if (st.wrap) cls.push('wrap');
        if (cell.filled) cls.push('filled-hl');
        if (interactive && S.studioSel && S.studioSel.kind === 'xlsx_cell' && S.studioSel.sheet === sh && S.studioSel.coord === cell.coord) cls.push('sel');
        if (rng) {
          const minR = Math.min(rng.r1, rng.r2), maxR = Math.max(rng.r1, rng.r2);
          const minC = Math.min(rng.c1, rng.c2), maxC = Math.max(rng.c1, rng.c2);
          if (cell.r >= minR && cell.r <= maxR && cell.c >= minC && cell.c <= maxC) cls.push('in-range');
        }

        let tag = '';
        if (interactive && prof) {
          const mf = fldByCoord[cell.coord];
          if (mf) {
            const rc = mf.role === 'formula_protected' ? 'tag-formula' : ('tag-' + mf.role);
            tag = `<span class="cell-tag ${rc}">${esc(mf.label)}</span>`;
          } else if (tblByCoord[cell.coord]) {
            tag = `<span class="cell-tag tag-table">🔁 ${esc(tblByCoord[cell.coord])}</span>`;
          } else if (cell.formula || protSet.has(cell.coord)) {
            tag = `<span class="cell-tag tag-formula">🔒 ƒx</span>`;
          } else if (suggByCoord[cell.coord]) {
            tag = `<span class="cell-tag tag-sugg">[${esc(t('common.suggested_tag'))}] ${esc(suggByCoord[cell.coord].label)}</span>`;
          }
        }

        const spanAttrs = `${cell.rowspan > 1 ? ` rowspan="${cell.rowspan}"` : ''}${cell.colspan > 1 ? ` colspan="${cell.colspan}"` : ''}`;
        const evAttrs = interactive
          ? ` data-coord="${esc(cell.coord)}" data-r="${cell.r}" data-c="${cell.c}" data-formula="${esc(cell.formula||'')}" data-merge="${esc(cell.merge||'')}" onmousedown="xlMouseDown(event,this)" onmouseenter="xlMouseEnter(event,this)"`
          : '';
        const titleTxt = `${cell.coord}${cell.merge ? ' ('+cell.merge+')' : ''}${cell.formula ? ' ' + cell.formula : ''}`;
        return `<td class="${cls.join(' ')}"${spanAttrs}${evAttrs} style="${css.join(';')}" title="${esc(titleTxt)}">${tag}${esc(cell.text)}</td>`;
      }).join('');
      return `<tr style="height:${row.height_px||22}px"><th class="xl-row-hdr ltr" style="width:38px">${row.row}</th>${tds}</tr>`;
    }).join('');

    const imgsHtml = (ren.images || []).map(im => {
      const top = rowOffsets[Math.max(0, Math.min((im.row || 1) - 1, rowOffsets.length - 1))] || 26;
      const offsetX = colOffsets[Math.max(0, Math.min((im.col || 1) - 1, colOffsets.length - 1))] || 40;
      const posSide = ren.rtl ? `right:${offsetX}px` : `left:${offsetX}px`;
      return `<img class="xl-img-overlay" src="${esc(im.data_uri)}" style="top:${top}px;${posSide};width:${im.width_px||120}px;height:${im.height_px||60}px" alt="logo">`;
    }).join('');

    return `<div class="xl-stage" dir="${ren.rtl ? 'rtl' : 'ltr'}" style="${zoomCss};transform-origin:${ren.rtl ? 'top right' : 'top left'}" onmouseup="xlMouseUp()">
      ${imgsHtml}
      <table class="xl-grid"><thead><tr><th class="xl-corner" style="width:38px">◢</th>${colHeaders}</tr></thead><tbody>${bodyRows}</tbody></table>
    </div>`;
  }

  if (interactive && S.studioDocxMode === 'png' && ren.has_page_images) {
    return `<div class="docx-pages-wrap" style="${zoomCss};transform-origin:top center">` + (ren.page_images || []).map(pg =>
      `<img class="docx-page-img" src="${esc(pg.data_uri)}" alt="${esc(t('studio.page_label', { num: pg.page }))}">`
    ).join('') + `</div>`;
  }

  const fldMap = new Map();
  if (prof && interactive) {
    for (const f of (prof.fields || [])) {
      const tk = f.target || {};
      if (tk.kind === 'docx_cell') fldMap.set(`T${tk.table_idx}:R${tk.row_idx}C${tk.col_idx}`, f);
      else if (tk.kind === 'docx_paragraph') fldMap.set(`P${tk.para_idx}`, f);
      else if (tk.kind === 'docx_span') fldMap.set(`S${tk.para_idx}:${tk.match_text}`, f);
    }
  }

  const renderPara = (pb, clickable) => {
    const dir = pb.rtl ? 'rtl' : 'ltr';
    const align = pb.align ? `text-align:${pb.align};` : '';
    let inner = '';
    for (const run of (pb.runs || [])) {
      const rs = run.style || {};
      const rcss = [];
      if (rs.bold) rcss.push('font-weight:700');
      if (rs.italic) rcss.push('font-style:italic');
      if (rs.underline) rcss.push('text-decoration:underline');
      if (rs.size) rcss.push(`font-size:${rs.size}pt`);
      if (rs.color) rcss.push(`color:${rs.color}`);
      const imgs = (run.images || []).map(im => `<img src="${esc(im.data_uri)}" style="width:${im.width_px||120}px;height:${im.height_px||56}px;vertical-align:middle" alt="logo">`).join('');
      inner += `${imgs}<span style="${rcss.join(';')}">${esc(run.text || '')}</span>`;
    }
    if (!clickable || pb.para_idx == null) {
      return `<div dir="${dir}" style="${align}margin:2px 0">${inner || '&nbsp;'}</div>`;
    }
    const pf = fldMap.get(`P${pb.para_idx}`);
    const isSel = S.studioSel && S.studioSel.kind === 'docx_paragraph' && S.studioSel.para_idx === pb.para_idx;
    const spansBar = (pb.spans || []).map(sp => {
      const sf = fldMap.get(`S${pb.para_idx}:${sp}`);
      const spSel = S.studioSel && S.studioSel.kind === 'docx_span' && S.studioSel.para_idx === pb.para_idx && S.studioSel.match_text === sp;
      return `<span class="docx-span-chip ${spSel?'sel':''}" onclick="event.stopPropagation();selectDocxSpan(${pb.para_idx},${jsStr(sp)})">${esc(sp)}${sf ? ` ✓(${esc(sf.label)})` : ''}</span>`;
    }).join(' ');
    const tag = pf ? `<span class="cell-tag tag-${pf.role}">${esc(pf.label)}</span>` : '';
    return `<div class="docx-para ${isSel?'sel':''} ${pb.filled?'filled-hl':''}" dir="${dir}" style="${align}" onclick="selectDocxPara(${pb.para_idx},${jsStr((pb.text||'').slice(0,90))})">${tag}${inner || '&nbsp;'} ${spansBar}</div>`;
  };

  const renderTbl = (tb, clickable) => {
    const tIdx = tb.table_idx;
    const rowsH = (tb.rows || []).map(r => {
      const tds = (r.cells || []).map(c => {
        const st = c.style || {};
        const css = [];
        if (st.bg) css.push(`background:${st.bg}`);
        if (st.bt) css.push(`border-top:${st.bt}`);
        if (st.br) css.push(`border-right:${st.br}`);
        if (st.bb) css.push(`border-bottom:${st.bb}`);
        if (st.bl) css.push(`border-left:${st.bl}`);
        if (st.valign) css.push(`vertical-align:${st.valign}`);
        const cBody = (c.paragraphs || []).map(p => renderPara(p, false)).join('');
        const sp = `${c.rowspan>1?` rowspan="${c.rowspan}"`:''}${c.colspan>1?` colspan="${c.colspan}"`:''}`;
        if (!clickable || tIdx < 0) return `<td${sp} style="padding:4px 6px;${css.join(';')}">${cBody}</td>`;
        const cf = fldMap.get(`T${tIdx}:R${c.r}C${c.c}`);
        const isSel = S.studioSel && S.studioSel.kind === 'docx_cell' && S.studioSel.table_idx === tIdx && S.studioSel.row_idx === c.r && S.studioSel.col_idx === c.c;
        const tag = cf ? `<span class="cell-tag tag-${cf.role}">${esc(cf.label)}</span>` : '';
        return `<td class="docx-cell ${isSel?'sel':''} ${c.filled?'filled-hl':''}"${sp} style="${css.join(';')}" onclick="selectDocxCell(${tIdx},${c.r},${c.c},${jsStr((c.text||'').slice(0,80))})">${tag}${cBody}</td>`;
      }).join('');
      return `<tr${r.height_px?` style="min-height:${r.height_px}px"`:''}>${tds}</tr>`;
    }).join('');
    const tblTool = (clickable && tIdx >= 0)
      ? `<div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#64748b;margin-top:6px"><span>${esc(t('studio.table_label', { num: tIdx + 1 }))}</span><button class="btn btn-sm" style="padding:1px 7px;font-size:11px" onclick="addDocxRepeatingTable(${tIdx})">🔁 ${esc(t('studio.make_items_table'))}</button></div>` : '';
    return `${tblTool}<table class="docx-tbl" dir="${tb.rtl?'rtl':'ltr'}"><tbody>${rowsH}</tbody></table>`;
  };

  const renderBlocks = (arr, clickable) => (arr || []).map(b => b.kind === 'table' ? renderTbl(b, clickable) : renderPara(b, clickable)).join('');
  return `<div class="docx-a4" style="${zoomCss}">
    ${(ren.header_blocks||[]).length ? `<div class="docx-hdr">${renderBlocks(ren.header_blocks, false)}</div>` : ''}
    <div>${renderBlocks(ren.body_blocks, interactive)}</div>
    ${(ren.footer_blocks||[]).length ? `<div class="docx-ftr">${renderBlocks(ren.footer_blocks, false)}</div>` : ''}
  </div>`;
}

function xlMouseDown(ev, td) {
  if (ev.button !== 0) return;
  const sh = S.studioRender.active_sheet;
  const r = Number(td.dataset.r), c = Number(td.dataset.c);
  const coord = td.dataset.coord, formula = td.dataset.formula || '', merge = td.dataset.merge || '';
  S.dragStart = { sheet: sh, r, c };
  S.studioRange = { sheet: sh, r1: r, c1: c, r2: r, c2: c };
  S.studioSel = { kind: 'xlsx_cell', sheet: sh, coord, r, c, formula, merge, text: td.textContent || '' };
  S.studioTab = 'inspector';
  paintStudio();
}
function xlMouseEnter(ev, td) {
  if (!S.dragStart || !(ev.buttons & 1)) return;
  const r = Number(td.dataset.r), c = Number(td.dataset.c);
  if (S.studioRange && (S.studioRange.r2 !== r || S.studioRange.c2 !== c)) {
    S.studioRange = { sheet: S.dragStart.sheet, r1: S.dragStart.r, c1: S.dragStart.c, r2: r, c2: c };
    paintStudio();
  }
}
function xlMouseUp() {
  if (!S.dragStart) return;
  if (S.studioRange && S.studioRange.r1 === S.studioRange.r2 && S.studioRange.c1 === S.studioRange.c2) {
    S.studioRange = null;
  }
  S.dragStart = null;
  paintStudio();
}
window.addEventListener('mouseup', () => { if (S.dragStart) xlMouseUp(); });

function selectDocxCell(table_idx, row_idx, col_idx, text) {
  S.studioSel = { kind: 'docx_cell', table_idx, row_idx, col_idx, text };
  S.studioTab = 'inspector';
  paintStudio();
}
function selectDocxPara(para_idx, text) {
  S.studioSel = { kind: 'docx_paragraph', para_idx, text };
  S.studioTab = 'inspector';
  paintStudio();
}
function selectDocxSpan(para_idx, match_text) {
  S.studioSel = { kind: 'docx_span', para_idx, match_text, text: match_text };
  S.studioTab = 'inspector';
  paintStudio();
}

function paintStudio() {
  const prof = S.studioProfile, ren = S.studioRender;
  if (!prof || !ren) return;
  const mv = document.getElementById('mainView');
  const secs = projSections();
  const suggSec = prof.section_suggestion && prof.section_suggestion.suggested_section;

  const secOpts = `<option value="">— ${esc(t('studio.pick_section'))} —</option>` + secs.map(s => {
    const isSugg = (!prof.section_confirmed && suggSec === s.id) ? ` [${t('common.suggested_tag')}]` : '';
    return `<option value="${esc(s.id)}" ${prof.section===s.id?'selected':''}>${esc(s.label)}${esc(isSugg)}</option>`;
  }).join('');

  const orphans = prof.orphan_fields || [];
  const rebounds = prof.rebound_fields || [];
  let driftHtml = '';
  if (orphans.length) {
    driftHtml += `<div class="alert alert-red">
      <strong>⛔ ${esc(t('studio.moved_warn', { count: orphans.length }))}</strong>
      <div style="margin-top:6px;display:flex;flex-direction:column;gap:5px">

        <button class="btn btn-sm" onclick="runStudioAiSuggest(this)">🤖 ${esc(t('studio.suggest_btn'))}</button>
        <button class="btn btn-sm" onclick="openIssueModal(S.studioTpl, true)">👁 ${esc(t('studio.preview_btn'))}</button>
        <button class="btn btn-primary btn-sm" onclick="saveStudioProfile(this)">💾 ${esc(t('studio.save_btn'))}</button>

      </div>

    ${driftHtml}
    <div class="studio-split">
      <div id="studioCanvasBox" class="studio-canvas-card ${S.studioFullscreen ? 'doc-viewer-fs' : ''}">
        ${canvasTop}

          <button class="tab-btn ${S.studioTab==='suggestions'?'active':''}" style="padding:6px 8px;font-size:12px" onclick="S.studioTab='suggestions';paintStudio()">${esc(t('studio.tab_suggested', { count: suggCount }))}</button>
        </div>
        ${renderStudioSideTab()}

    </div>
  `;
}

function onStudioSectionChange(val) {
  S.studioProfile.section = val;
  S.studioProfile.section_confirmed = Boolean(val);
  const s = projSections().find(x => x.id === val);
  if (s && !S.studioProfile.ref_prefix) S.studioProfile.ref_prefix = s.ref_prefix;
  paintStudio();
}

function previewDateSample(fmt) {
  const d = new Date();
  const y = String(d.getFullYear()), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  if (fmt === 'date.today_dmy') return `${day}/${m}/${y}`;
  if (fmt === 'date.today_dmy_dash') return `${day}-${m}-${y}`;
  if (fmt === 'date.month_year') return `${m}/${y}`;
  if (fmt === 'date.year') return y;
  if (fmt === 'date.day_name_ar') return new Intl.DateTimeFormat('ar-KW', { weekday: 'long' }).format(d);
  return `${y}-${m}-${day}`;
}

function previewCounterSample() {
  const pref = document.getElementById('fi_cnt_prefix')?.value || '';
  const num = Math.max(1, Number(document.getElementById('fi_cnt_next')?.value || 1));
  const dig = Math.max(1, Math.min(8, Number(document.getElementById('fi_cnt_digits')?.value || 3)));
  const suf = document.getElementById('fi_cnt_suffix')?.value || '';
  const out = `${pref}${String(num).padStart(dig, '0')}${suf}`;
  const el = document.getElementById('fi_cnt_preview');
  if (el) el.textContent = out;
  return out;
}

        ${isFormula ? `<div style="color:var(--red);font-size:12px;font-weight:700;margin-top:4px">🔒 ${esc(t('studio.formula_notice'))}</div>` : ''}
      </div>

        <div id="fi_box_opts" class="fg" style="margin-bottom:8px;display:${cur.input_type==='dropdown'?'flex':'none'}">

    return `${list || `<p class="sub">${esc(t('studio.empty_tables'))}</p>`}`;

  const sFlds = (prof.suggestions && prof.suggestions.fields) || [];
  const sTbls = (prof.suggestions && prof.suggestions.repeating_tables) || [];
  if (!sFlds.length && !sTbls.length) {

  document.getElementById('fi_box_manual').style.display = r === 'manual' ? 'block' : 'none';
  document.getElementById('fi_box_date').style.display = r === 'auto_date' ? 'block' : 'none';
  document.getElementById('fi_box_counter').style.display = r === 'auto_counter' ? 'block' : 'none';
}

function applyInspectorField(existIdx) {
  const sel = S.studioSel;
  if (!sel) return;
  const role = document.getElementById('fi_role').value;
  const label = document.getElementById('fi_label').value.trim() || (role === 'formula_protected' ? roleLabel('formula_protected') : '');
  if (!label && role !== 'formula_protected' && role !== 'fixed') {
    toast(t('studio.need_label_toast'), 'err'); return;
  }
  const target = sel.kind === 'xlsx_cell' ? { kind: 'xlsx_cell', sheet: sel.sheet, coord: sel.coord }
    : (sel.kind === 'docx_cell' ? { kind: 'docx_cell', table_idx: sel.table_idx, row_idx: sel.row_idx, col_idx: sel.col_idx, replace_mode: 'cell' }
    : (sel.kind === 'docx_span' ? { kind: 'docx_span', para_idx: sel.para_idx, match_text: sel.match_text }
    : { kind: 'docx_paragraph', para_idx: sel.para_idx, replace_mode: document.getElementById('fi_pmode')?.value || 'after_colon' }));

  if (role === 'formula_protected' && sel.kind === 'xlsx_cell') {
    S.studioProfile.protected_cells = S.studioProfile.protected_cells || [];
    if (!S.studioProfile.protected_cells.some(p => p.sheet === sel.sheet && p.coord === sel.coord)) {
      S.studioProfile.protected_cells.push({ sheet: sel.sheet, coord: sel.coord, formula: sel.formula || 'user_locked' });
    }
    if (existIdx >= 0) S.studioProfile.fields.splice(existIdx, 1);
    toast(t('studio.locked_toast'));
    paintStudio();
    return;
  }

  const itype = document.getElementById('fi_itype')?.value || 'text';
  const optsRaw = document.getElementById('fi_opts')?.value || '';
  const options = itype === 'dropdown' ? optsRaw.split(/[,\u060c]+/).map(s => s.trim()).filter(Boolean) : [];
  if (role === 'manual' && itype === 'dropdown' && !options.length) {
    toast(t('studio.need_opts_toast'), 'err'); return;
  }
  const source = role === 'auto_date' ? (document.getElementById('fi_src_date')?.value || 'date.today_iso')
    : (role === 'auto_counter' ? 'counter.custom' : '');

  const fld = {
    label: label || roleLabel('fixed'),
    key: document.getElementById('fi_key').value.trim(),
    role,
    source,
    input_type: itype,
    required: role === 'manual' ? Boolean(document.getElementById('fi_req')?.checked) : false,
    default_value: document.getElementById('fi_def')?.value ?? '',
    options,
    target,
    anchor: {},
  };
  if (role === 'auto_counter') {
    fld.counter_prefix = document.getElementById('fi_cnt_prefix')?.value ?? '';
    fld.counter_next = Math.max(1, Number(document.getElementById('fi_cnt_next')?.value || 1));
    fld.counter_digits = Math.max(1, Math.min(8, Number(document.getElementById('fi_cnt_digits')?.value || 3)));
    fld.counter_suffix = document.getElementById('fi_cnt_suffix')?.value ?? '';
    fld.sync_with_log = Boolean(document.getElementById('fi_cnt_sync')?.checked);
  }
  S.studioProfile.fields = S.studioProfile.fields || [];
  if (existIdx >= 0) S.studioProfile.fields[existIdx] = fld;
  else S.studioProfile.fields.push(fld);
  paintStudio();
  toast(t('studio.field_pinned_toast'));
}

function createTableFromRange() {
  const rg = S.studioRange;
  if (!rg) return;
  const c1 = Math.min(rg.c1, rg.c2), c2 = Math.max(rg.c1, rg.c2);
  const label = document.getElementById('rng_tlabel').value.trim() || t('studio.default_table_name');
  const header_row = Math.max(1, Number(document.getElementById('rng_hdr').value || 1));
  const template_row = Math.max(1, Number(document.getElementById('rng_trow').value || 2));
  const totRaw = document.getElementById('rng_tot').value.trim();
  const totals_row = totRaw ? Number(totRaw) : null;

  const hdrRowObj = (S.studioRender.rows || []).find(r => r.row === header_row);
  const tmplRowObj = (S.studioRender.rows || []).find(r => r.row === template_row);
  const columns = [];
  for (let c = c1; c <= c2; c++) {
    const cl = colLetter(c);
    const hCell = hdrRowObj && (hdrRowObj.cells || []).find(x => x.c === c);
    const tCell = tmplRowObj && (tmplRowObj.cells || []).find(x => x.c === c);
    const isF = Boolean(tCell && tCell.formula);
    const lbl = (hCell && hCell.text && hCell.text.trim()) || cl;
    columns.push({
      key: `col_${cl.toLowerCase()}`,
      label: lbl,
      col: cl,
      input_type: isF ? 'formula_protected' : 'text',
      required: false,
    });
  }
  S.studioProfile.repeating_tables = S.studioProfile.repeating_tables || [];
  S.studioProfile.repeating_tables.push({
    key: `items_${S.studioProfile.repeating_tables.length + 1}`,
    label,
    target_kind: 'xlsx_rows',
    sheet: rg.sheet,
    header_row,
    template_row,
    totals_row,
    columns,
  });
  S.studioRange = null;
  S.studioTab = 'tables';
  paintStudio();
  toast(t('studio.table_added_toast'));
}

function bulkLockRange() {
  const rg = S.studioRange;
  if (!rg) return;
  const r1 = Math.min(rg.r1, rg.r2), r2 = Math.max(rg.r1, rg.r2);
  const c1 = Math.min(rg.c1, rg.c2), c2 = Math.max(rg.c1, rg.c2);
  S.studioProfile.protected_cells = S.studioProfile.protected_cells || [];
  for (let r = r1; r <= r2; r++) {
    for (let c = c1; c <= c2; c++) {
      const coord = colLetter(c) + r;
      if (!S.studioProfile.protected_cells.some(p => p.sheet === rg.sheet && p.coord === coord)) {
        S.studioProfile.protected_cells.push({ sheet: rg.sheet, coord, formula: 'user_locked' });
      }
    }
  }
  S.studioRange = null;
  paintStudio();
  toast(t('studio.locked_toast'));
}

function addDocxRepeatingTable(tIdx) {
  const tb = (S.studioRender.body_blocks || []).find(b => b.kind === 'table' && b.table_idx === tIdx);
  if (!tb || !(tb.rows || []).length) return;
  const hdrCells = tb.rows[0].cells || [];
  const columns = hdrCells.map((c, idx) => ({
    key: `col_${idx}`,
    label: (c.text || `C${idx + 1}`).slice(0, 40),
    col_idx: c.c,
    input_type: idx === 0 ? 'auto_index' : 'text',
    required: false,
  }));
  S.studioProfile.repeating_tables = S.studioProfile.repeating_tables || [];
  S.studioProfile.repeating_tables.push({
    key: `items_${S.studioProfile.repeating_tables.length + 1}`,
    label: t('studio.table_label', { num: tIdx + 1 }),
    target_kind: 'docx_rows',
    table_idx: tIdx,
    header_row: 0,
    template_row: Math.min(1, tb.rows.length - 1),
    columns,
  });
  S.studioTab = 'tables';
  paintStudio();
  toast(t('studio.table_added_toast'));
}

function focusFieldTarget(idx) {
  const f = S.studioProfile.fields[idx];
  if (!f || !f.target) return;
  const tk = f.target;
  if (tk.kind === 'xlsx_cell' && tk.sheet !== S.studioRender.active_sheet) {
    switchStudioSheet(tk.sheet).then(() => { S.studioSel = { ...tk }; S.studioTab = 'inspector'; paintStudio(); });
    return;
  }
  S.studioSel = { ...tk };
  S.studioTab = 'inspector';
  paintStudio();
}

function acceptSuggestedField(i) {
  const sf = S.studioProfile.suggestions.fields.splice(i, 1)[0];
  if (!sf) return;
  delete sf.suggested;
  S.studioProfile.fields = S.studioProfile.fields || [];
  S.studioProfile.fields.push(sf);
  paintStudio();
}
function acceptSuggestedTable(i) {
  const st = S.studioProfile.suggestions.repeating_tables.splice(i, 1)[0];
  if (!st) return;
  delete st.suggested;
  S.studioProfile.repeating_tables = S.studioProfile.repeating_tables || [];
  S.studioProfile.repeating_tables.push(st);
  paintStudio();
}
function acceptAllSuggestions() {
  const sg = S.studioProfile.suggestions || {};
  for (const sf of (sg.fields || [])) { delete sf.suggested; S.studioProfile.fields.push(sf); }
  for (const st of (sg.repeating_tables || [])) { delete st.suggested; S.studioProfile.repeating_tables.push(st); }
  S.studioProfile.suggestions = { fields: [], repeating_tables: [] };
  S.studioTab = 'fields';
  paintStudio();
  toast(t('studio.field_pinned_toast'));
}

function rebindOrphanToSelected(oi) {
  if (!S.studioSel) { toast(t('studio.need_select_toast'), 'err'); return; }
  const orph = S.studioProfile.orphan_fields.splice(oi, 1)[0];
  const sel = S.studioSel;
  const newTarget = sel.kind === 'xlsx_cell' ? { kind: 'xlsx_cell', sheet: sel.sheet, coord: sel.coord }
    : (sel.kind === 'docx_cell' ? { kind: 'docx_cell', table_idx: sel.table_idx, row_idx: sel.row_idx, col_idx: sel.col_idx, replace_mode: 'cell' }
    : (sel.kind === 'docx_span' ? { kind: 'docx_span', para_idx: sel.para_idx, match_text: sel.match_text }
    : { kind: 'docx_paragraph', para_idx: sel.para_idx, replace_mode: 'after_colon' }));
  const f = (S.studioProfile.fields || []).find(x => x.id === orph.id || x.key === orph.key);
  if (f) { f.target = newTarget; f.anchor = {}; }
  else S.studioProfile.fields.push({ ...orph, target: newTarget, anchor: {} });
  paintStudio();
  toast(t('studio.field_pinned_toast'));
}
function dismissOrphan(oi) {
  const orph = S.studioProfile.orphan_fields.splice(oi, 1)[0];
  S.studioProfile.fields = (S.studioProfile.fields || []).filter(x => x.id !== orph.id && x.key !== orph.key);
  paintStudio();
}

let _issueCtx = null;

async function openIssueModal(tplName, useUnsavedStudioProfile = false, replyCtx = null) {
  try {
    let prof, nextRef;
    if (useUnsavedStudioProfile && S.studioProfile && S.studioTpl === tplName) {
      prof = S.studioProfile;
      nextRef = prof._next_ref || 'AUTO';
    } else {
      const pRes = await api(`/api/projects/${encodeURIComponent(S.pid)}/templates/${encodeURIComponent(tplName)}/profile`);
      prof = pRes.profile;
      nextRef = pRes.next_ref;
    }
    if ((prof.orphan_fields || []).length) {
      toast(t('server.tpl_moved_fields', { count: prof.orphan_fields.length, name: tplName }), 'err');
      return;
    }
    const initRows = {};
    for (const tb of (prof.repeating_tables || [])) initRows[tb.key] = [{}];
    _issueCtx = { tplName, prof, nextRef, useUnsaved: useUnsavedStudioProfile, tableRows: initRows, replyCtx };
    paintIssueModal();
  } catch (e) { toast(e.message, 'err'); }
}

function paintIssueModal() {
  const { tplName, prof, nextRef, useUnsaved, tableRows, replyCtx } = _issueCtx;

  const autoBadges = (prof.fields || []).filter(f => ['auto_date', 'auto_counter', 'auto_project', 'auto_system'].includes(f.role))

      if (f.role === 'auto_counter') return `<span class="pill pill-purple">🔢 ${esc(f.label)}: ${esc(formatCounter(f))}</span>`;
      return `<span class="pill pill-teal">⚡ ${esc(f.label)}</span>`;

  const manualInputs = (prof.fields || []).filter(f => f.role === 'manual').map(f => {

      }).join('')}

    ${tablesHtml}

async function loadIssueLetterOptions(subjectHint, preselectLink = null) {
  const sel = document.getElementById('iss_link_ref');
  if (!sel || !_issueCtx) return;
  const curVal = sel.value;
  const preObj = preselectLink ? {
    ref_no: preselectLink.ref_no || '',
    sheet: preselectLink.sheet || '',
    section: preselectLink.section || 'incoming',
    subject: preselectLink.subject || '',
  } : null;
  if (preObj) {
    const preVal = JSON.stringify(preObj);
    sel.innerHTML = `<option value="${esc(preVal)}" selected>${esc(preObj.sheet || '')}: ${esc(preObj.ref_no || '')} — ${esc((preObj.subject || '').slice(0, 50))}</option>`;
  }
  try {
    const qs = new URLSearchParams({
      subject: subjectHint || '',
      section: _issueCtx.prof?.section || 'outgoing',
    }).toString();
    const res = await api(`/api/projects/${encodeURIComponent(S.pid)}/letters/links?${qs}`);
    const sugs = res.suggestions || [];
    const sugKeys = new Set(sugs.map(s => `${s.sheet}::${s.ref_no}`));
    const others = (res.letters || []).filter(x => !sugKeys.has(`${x.sheet}::${x.ref_no}`)).slice(0, 40);
    const matchesPre = obj => preObj && obj.ref_no === preObj.ref_no && (!preObj.sheet || obj.sheet === preObj.sheet);
    const sugOpts = sugs.map(s => {
      const o = { ref_no: s.ref_no, sheet: s.sheet, section: s.section, subject: s.subject };
      return `<option value="${esc(JSON.stringify(o))}" ${matchesPre(o)?'selected':''}>✨ [${s.pct || 0}%] ${esc(s.party_label || '')}: ${esc(s.ref_no || '')} — ${esc((s.subject || '').slice(0, 50))}</option>`;
    }).join('');
    const othOpts = others.map(x => {
      const o = { ref_no: x.ref_no, sheet: x.sheet, section: x.section, subject: x.subject };
      return `<option value="${esc(JSON.stringify(o))}" ${matchesPre(o)?'selected':''}>${esc(x.party_label || x.sheet || '')}: ${esc(x.ref_no || '')} — ${esc((x.subject || '').slice(0, 50))}</option>`;
    }).join('');
    const preInList = sugs.some(matchesPre) || others.some(matchesPre);
    const preExtra = (preObj && !preInList)

function collectIssuePayload() {
  const { prof, useUnsaved, tableRows } = _issueCtx;
  document.querySelectorAll('.err-msg').forEach(el => el.textContent = '');
  const values = {};
  for (const f of (prof.fields || [])) {
    if (f.role !== 'manual') continue;
    const el = document.getElementById('iss_f_' + f.key);
    if (el) values[f.key] = el.value;
  }
  const tables = {};
  for (const tb of (prof.repeating_tables || [])) {
    const clean = (tableRows[tb.key] || []).filter(r => Object.values(r).some(v => String(v ?? '').trim() !== ''));
    if (clean.length) tables[tb.key] = clean;
  }
  const body = {
    ref_no: document.getElementById('iss_ref')?.value.trim() || '',
    revision: document.getElementById('iss_rev')?.value.trim() || 'R00',
    doc_date: document.getElementById('iss_date')?.value.trim() || '',
    discipline: document.getElementById('iss_disc')?.value.trim().toUpperCase() || '',
    subject: document.getElementById('iss_subj')?.value.trim() || '',
    party_name: document.getElementById('iss_party')?.value.trim() || '',
    values,
    tables,
  };
  const linkRaw = document.getElementById('iss_link_ref')?.value || '';
  if (linkRaw) {
    try { body.link_to_refs = [JSON.parse(linkRaw)]; } catch (_) {}
  }
  if (useUnsaved) body.profile = prof;
  return body;
}
function addIssueTableRow(tkey) { _issueCtx.tableRows[tkey].push({}); paintIssueModal(); }
function removeIssueTableRow(tkey, ri) { _issueCtx.tableRows[tkey].splice(ri, 1); if (!_issueCtx.tableRows[tkey].length) _issueCtx.tableRows[tkey].push({}); paintIssueModal(); }

function showIssueValidationErrors(err) {
  const errs = (err.data && err.data.errors) || [];
  for (const e of errs) {
    const sp = document.getElementById('err_' + e.key);
    if (sp) sp.textContent = e.error;
  }
  toast(err.message, 'err');
}

async function _collectIssueSubmitBody() {

function selectDecisionPreview(decId, ev = null, openModalZoom = false) {
  if (ev && openModalZoom) ev.stopPropagation();
  const changed = S.decSelectedId !== decId;
  S.decSelectedId = decId;
  if (changed) {
    S.decPreviewPage = 1;
    S.decPreviewTotal = 1;
  }
  document.querySelectorAll('.decision-card.selected').forEach(el => el.classList.remove('selected'));
  const card = document.getElementById('dec_card_' + decId);
  if (card) card.classList.add('selected');
  if (changed) loadDecisionSidePreview(decId, 1);
  if (openModalZoom) openDecisionZoomModal(decId, S.decPreviewPage || 1);
}

async function loadDecisionSidePreview(decId, pageNo = 1) {
  const stage = document.getElementById('decPreviewStage');
  const nameEl = document.getElementById('decPreviewName');
  const pageInfo = document.getElementById('decPageInfo');
  const prevBtn = document.getElementById('decPrevPageBtn');
  const nextBtn = document.getElementById('decNextPageBtn');
  const fileLink = document.getElementById('decOpenFileLink');
  if (!stage) return;

  const dec = _pendingDecisionsCache.find(x => x.id === decId);
  if (nameEl) nameEl.textContent = dec ? dec.file_name : '';
  const fileUrl = `/api/decisions/${encodeURIComponent(decId)}/file`;
  if (fileLink) fileLink.href = fileUrl;

  const reqSeq = ++S.decPreviewReqSeq;
  S.decPreviewPage = Math.max(1, Number(pageNo || 1));
  stage.innerHTML = `<div class="sub" style="padding:28px;text-align:center">⏳ ${esc(t('decisions.preview_loading'))}</div>`;

  try {
    const resp = await fetch(`/api/decisions/${encodeURIComponent(decId)}/preview?page=${S.decPreviewPage}&dpi=135`);
    if (reqSeq !== S.decPreviewReqSeq) return;
    if (!resp.ok) {
      throw new Error('preview_unavailable');
    }
    const tot = Math.max(1, Number(resp.headers.get('X-Total-Pages') || 1));
    S.decPreviewTotal = tot;
    const blob = await resp.blob();
    if (reqSeq !== S.decPreviewReqSeq) return;
    if (S.decPreviewBlobUrl) {
      try { URL.revokeObjectURL(S.decPreviewBlobUrl); } catch (_) {}
    }
    S.decPreviewBlobUrl = URL.createObjectURL(blob);
    if (pageInfo) pageInfo.textContent = t('decisions.page_of', { page: S.decPreviewPage, total: tot });
    if (prevBtn) prevBtn.disabled = S.decPreviewPage <= 1;
    if (nextBtn) nextBtn.disabled = S.decPreviewPage >= tot;

    const zoomPct = Math.max(50, Math.min(220, Number(S.decPreviewZoom || 100)));
    stage.innerHTML = `<img id="decPreviewImg" src="${S.decPreviewBlobUrl}" alt="${esc(dec ? dec.file_name : '')}" style="width:${zoomPct}%;max-width:${zoomPct > 100 ? 'none' : '100%'};cursor:zoom-in" onclick="openDecisionZoomModal(${jsStr(decId)}, ${S.decPreviewPage})">`;
  } catch (_) {
    if (reqSeq !== S.decPreviewReqSeq) return;
    if (pageInfo) pageInfo.textContent = '—';
    if (prevBtn) prevBtn.disabled = true;
    if (nextBtn) nextBtn.disabled = true;
    stage.innerHTML = `<div class="card" style="text-align:center;max-width:320px;margin:auto">
      <div style="font-size:36px;margin-bottom:8px">📄</div>
      <div class="sub" style="margin-bottom:12px">${esc(t('decisions.preview_unavailable'))}</div>
      <a class="btn btn-primary btn-sm" href="${esc(fileUrl)}" target="_blank" rel="noopener">👁 ${esc(t('common.open_file'))}</a>
    </div>`;
  }
}

function changeDecisionPage(delta) {
  if (!S.decSelectedId) return;
  const next = Math.max(1, Math.min(S.decPreviewTotal || 1, (S.decPreviewPage || 1) + delta));
  if (next === S.decPreviewPage) return;
  loadDecisionSidePreview(S.decSelectedId, next);
}

function setDecisionZoom(delta) {
  if (delta === 0) S.decPreviewZoom = 100;
  else S.decPreviewZoom = Math.max(50, Math.min(220, (S.decPreviewZoom || 100) + delta));
  const img = document.getElementById('decPreviewImg');
  if (img) {
    img.style.width = S.decPreviewZoom + '%';
    img.style.maxWidth = S.decPreviewZoom > 100 ? 'none' : '100%';
  }
}

function openDecisionZoomModal(decId, pageNo = 1) {
  const dec = _pendingDecisionsCache.find(x => x.id === decId);
  const src = `/api/decisions/${encodeURIComponent(decId)}/preview?page=${pageNo}&dpi=170`;
  const fileUrl = `/api/decisions/${encodeURIComponent(decId)}/file`;
  openModal(
    `🖼️ ${esc(dec ? dec.file_name : t('decisions.preview_title'))}`,
    `<div style="background:#cbd5e1;padding:10px;border-radius:8px;max-height:74vh;overflow:auto;text-align:center">
      <img src="${esc(src)}" style="max-width:100%;height:auto;background:#fff;border-radius:4px;box-shadow:0 4px 16px rgba(0,0,0,.22)">
    </div>`,
    `<button class="btn" onclick="closeModal()">${esc(t('common.back'))}</button>
     <a class="btn btn-blue" href="${esc(fileUrl)}" target="_blank" rel="noopener">👁 ${esc(t('common.open_file'))}</a>`,
    true
  );
}

async function confirmIgnorePattern(decId, btnEl) {
  const pat = document.getElementById('ign_pat_in')?.value.trim() || '';
  if (!pat) { toast(t('validation.rule_pattern_req'), 'err'); return; }
  closeModal();

async function resolveDecision(id, action, explicitPattern = '', btnEl) {
  const body = {
    action,
    target_project_id: document.getElementById('dc_proj_' + id)?.value || '',
    new_name: document.getElementById('dc_name_' + id)?.value.trim() || '',
    entity_name: document.getElementById('dc_ent_' + id)?.value.trim() || '',
    remember_rule: Boolean(document.getElementById('dc_rem_' + id)?.checked),
  };
  if (explicitPattern) body.pattern = explicitPattern;
  try {
    await withBusyButton(btnEl, async () => {
      await api(`/api/decisions/${encodeURIComponent(id)}/resolve`, { body });
      await refreshHub();
      await renderDecisionsView();
      toast(t('decisions.resolved_toast'));
    });
  } catch (e) { toast(e.message, 'err'); }
}

async function undoRename(entryId, projId, btnEl) {
  try {
    await withBusyButton(btnEl, async () => {
      await api(`/api/rename-journal/${encodeURIComponent(entryId)}/undo`, { body: { project_id: projId } });
      await renderDecisionsView();
      toast(t('journal.undone_toast'));

  } catch (e) { toast(e.message, 'err'); }
}

async function addLearnedRule(btnEl) {
  const pattern = document.getElementById('lr_pat').value.trim();

  try {
    await withBusyButton(btnEl, async () => {
      await api('/api/learned-rules', {
        body: {
          match_type: document.getElementById('lr_mtype').value,
          pattern,
          action: document.getElementById('lr_act').value,
          target_project_id: document.getElementById('lr_tproj').value,
          entity_name: document.getElementById('lr_ent').value.trim(),

      await renderDecisionsView();
      toast(t('rules.saved_toast'));

  } catch (e) { toast(e.message, 'err'); }
}

// ── Bulk Project Organizer (1,000-10,000+ files), Audit & PDF Tools ──────────
function _orgSyncTimer(job) {
  if (job && job.running) {
    if (!S.orgPollTimer) {
      S.orgPollTimer = setInterval(async () => {
        if (S.view !== 'organizer' || !S.pid) {
          clearInterval(S.orgPollTimer);
          S.orgPollTimer = null;
          S.orgPollBusy = false;
          return;
        }
        if (S.orgPollBusy) return;
        S.orgPollBusy = true;
        try {
          await renderOrganizerView(true);
        } finally {
          S.orgPollBusy = false;
        }
      }, 850);
    }
  } else if (S.orgPollTimer) {
    clearInterval(S.orgPollTimer);
    S.orgPollTimer = null;
    S.orgPollBusy = false;
  }
}

function _fmtElapsed(sec) {
  const s = Math.max(0, Number(sec) || 0);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
}

function _orgPhaseLabel(phase) {
  const known = {
    walking: 'organizer.phase_walking',
    extracting: 'organizer.phase_extracting',
    hashing: 'organizer.phase_hashing',
    analyzing: 'organizer.phase_analyzing',
    executing: 'organizer.phase_executing',
    ai_renaming: 'organizer.phase_ai_renaming',
  };
  return known[phase] ? t(known[phase]) : String(phase || '');
}

function _renderOrgProgressHtml(job) {
  return _renderUnifiedJobHtml('organizer', job, { canStop: true });
}

async function fetchOrganizerPage(page = S.orgPage) {
  S.orgPage = Math.max(1, page || 1);
  const qs = new URLSearchParams({
    page: String(S.orgPage),
    per_page: '50',
    filter: S.orgFilter || 'all',
    section: S.orgSection || '',
    q: S.orgQuery || '',
    show_resolved: S.orgShowResolved ? '1' : '0',
  });
  const res = await api(`/api/projects/${encodeURIComponent(S.pid)}/organizer?${qs.toString()}`, { method: 'GET' });
  S.orgPlan = res;
  if (!S.orgFolder && res.source_folder) S.orgFolder = res.source_folder;
  _orgSyncTimer(res.job);
  updateGlobalActivityBar();
  _ensureLiveTick();
  return res;
}

async function renderOrganizerView(fromPoll = false) {
  const mv = document.getElementById('mainView');
  if (S.orgLoadedPid !== S.pid) {
    S.orgLoadedPid = S.pid;
    S.orgAudit = null;
    S.orgPdfSplitRes = null;
    S.orgPdfMergeRes = null;
    S.orgMergeList = [];
  }
  if (!fromPoll) {
    mv.innerHTML = `<div class="card">${esc(t('common.loading'))}</div>`;
  }
  const prevJobRunning = Boolean(S.orgPlan && S.orgPlan.job && S.orgPlan.job.running);
  const prevJobKind = S.orgPlan && S.orgPlan.job ? S.orgPlan.job.kind : '';
  const data = await fetchOrganizerPage(S.orgPage);
  const job = data.job || { running: false };
  if (fromPoll && prevJobRunning && job.running && S.orgTab === 'organize') {
    const progHost = document.getElementById('orgProgressHost');
    if (progHost) {
      progHost.innerHTML = _renderOrgProgressHtml(job);
      return;
    }
  }
  if (fromPoll && prevJobRunning && !job.running && job.phase === 'done') {
    const sm = job.summary || {};
    S.orgShowResolved = false;
    S.orgPage = 1;
    if (prevJobKind === 'scan') {
      S.orgFilter = 'all';
      toast(t('organizer.scan_done_toast', { total: sm.total || 0 }));
    } else if (prevJobKind === 'execute') {
      S.orgFilter = 'all';
      S.orgSection = '';
      S.orgQuery = '';
      S.orgFolder = '';
      S.orgPage = 1;
      S.orgShowResolved = false;
      toast(t('organizer.exec_done_toast', { copied: sm.copied || 0 }));
    } else if (prevJobKind === 'ai_rename') {
      if ((sm.total_targets || 0) === 0) {
        toast(t('organizer.ai_none_msg'));
      } else {
        toast(t('organizer.ai_done_msg', { updated: sm.updated || 0, total: sm.processed || sm.total_targets || 0 }));
      }
    }
  } else if (fromPoll && prevJobRunning && !job.running && job.phase === 'stopped') {
    toast(t('jobs.stopped_by_user'), 'warn');
  } else if (fromPoll && job.phase === 'error' && job.error) {
    toast(job.error, 'err');
  }

  const tabsHtml = `
    <div class="card" style="padding-bottom:6px">
      <div class="card-header" style="margin-bottom:8px">
        <div>
          <h2 class="card-title">🧹 ${esc(t('organizer.title'))}</h2>
          <p class="tip">${esc(t('organizer.tip_scale'))}</p>
        </div>
        <button class="btn btn-sm" onclick="openDesktopFolder('reports')">📂 ${esc(t('organizer.open_reports_btn'))}</button>
      </div>
      <div class="tabs" style="margin-bottom:0;border-bottom:none">
        <button class="tab-btn ${S.orgTab==='organize'?'active':''}" onclick="S.orgTab='organize';renderOrganizerView()">🧹 ${esc(t('organizer.tab_organize'))}</button>
        <button class="tab-btn ${S.orgTab==='audit'?'active':''}" onclick="S.orgTab='audit';renderOrganizerView()">📊 ${esc(t('organizer.tab_audit'))}</button>
        <button class="tab-btn ${S.orgTab==='pdf'?'active':''}" onclick="S.orgTab='pdf';renderOrganizerView()">✂️ ${esc(t('organizer.tab_pdf'))}</button>
      </div>
    </div>`;

  let bodyHtml = '';
  if (S.orgTab === 'organize') {
    bodyHtml = _renderOrganizerMainTab(data, job);
  } else if (S.orgTab === 'audit') {
    bodyHtml = _renderOrganizerAuditTab();
  } else {
    bodyHtml = _renderOrganizerPdfTab();
  }
  mv.innerHTML = tabsHtml + bodyHtml;
}

function _renderOrganizerMainTab(data, job) {
  const counts = data.counts || {};
  const secs = projSections();
  const hasPlan = Boolean(data.has_plan && (data.total || 0) > 0);
  const jobRunning = Boolean(job && job.running);
  const jobStoppedOrErr = Boolean(job && job.kind === 'execute' && (job.phase === 'stopped' || job.phase === 'error'));
  const rawExec = (!jobRunning && !jobStoppedOrErr)
    ? ((job && job.kind === 'execute' && job.phase === 'done' && job.summary) ? job.summary : data.last_execution)
    : null;
  const execSum = (rawExec && !rawExec.stopped && rawExec.cleared && (rawExec.copied || 0) > 0) ? rawExec : null;

  const progHtml = `<div id="orgProgressHost">${_renderOrgProgressHtml(job)}</div>`;
  const orgScanLbl = (jobRunning && job.kind === 'scan') ? ('⏳ ' + esc(t('jobs.busy_wait'))) : ('🔎 ' + esc(t('organizer.scan_btn')));
  const orgAiLbl = (jobRunning && job.kind === 'ai_rename') ? ('⏳ ' + esc(t('jobs.busy_wait'))) : ('🤖 ' + esc(t('organizer.ai_rename_btn')));
  const orgExecLbl = (jobRunning && job.kind === 'execute') ? ('⏳ ' + esc(t('jobs.busy_wait'))) : ('🚀 ' + esc(t('organizer.execute_btn')));

  const scanCard = `
    <div class="card">
      <div class="form-grid">
        <div class="fg" style="grid-column:1/-1">
          <label>${esc(t('organizer.src_folder_label'))}</label>
          <div class="path-row">
            <input id="org_folder_in" class="ltr" value="${esc(S.orgFolder || ((!hasPlan && execSum && execSum.cleared) ? '' : (data.source_folder || '')))}" placeholder="${esc(t('organizer.src_folder_ph'))}" onchange="S.orgFolder=this.value">
            <button type="button" class="btn btn-sm" onclick="browseOrganizerFolder()">📁 ${esc(t('common.browse_folder'))}</button>
            <button type="button" class="btn btn-primary" ${jobRunning ? 'disabled' : ''} onclick="startOrganizerScan(this)">${orgScanLbl}</button>
          </div>
        </div>
        <div class="fg" style="grid-column:1/-1;display:flex;gap:18px;flex-wrap:wrap">
          <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="org_ext_arc" checked> ${esc(t('organizer.opt_extract_archives'))}</label>
          <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="org_read_txt" checked> ${esc(t('organizer.opt_read_text'))}</label>
        </div>
      </div>
      ${progHtml}
    </div>`;

  let execResultHtml = '';
  if (execSum) {
    const repRel = (execSum.report_exists !== false) ? (execSum.report_rel || '') : '';
    const dlUrl = repRel ? `/api/projects/${encodeURIComponent(S.pid)}/download?rel=${encodeURIComponent(repRel)}&area=root` : '';
    execResultHtml = `
      <div class="alert alert-green" style="margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <div>
          <div style="font-weight:700">✅ ${esc(t('organizer.exec_done_toast', { copied: execSum.copied || 0 }))}</div>
          ${!hasPlan ? `<div class="sub" style="margin-top:3px">${esc(t('organizer.exec_cleared_tip'))}</div>` : ''}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${dlUrl ? `<a class="btn btn-primary btn-sm" href="${dlUrl}" download>📥 ${esc(t('organizer.download_report_btn'))}</a>` : ''}
          <button type="button" class="btn btn-sm" onclick="openDesktopFolder('archive')">📂 ${esc(t('organizer.open_archive_btn'))}</button>
        </div>
      </div>`;
  }

  if (!hasPlan) {
    return scanCard + (execResultHtml ? `<div class="card">${execResultHtml}</div>` : `<div class="card"><div class="empty">${esc(t('organizer.empty_plan'))}</div></div>`);
  }

  const secOpts = secs.map(s => `<option value="${esc(s.id)}" ${S.orgSection===s.id?'selected':''}>${esc(s.label)}</option>`).join('');
  const decisionBadge = (it) => {
    const st = it.status || 'keep';
    const dec = it.decision || (st === 'duplicate' || st === 'near_duplicate' || st === 'superseded' ? 'pending' : '');
    if (st === 'duplicate' || st === 'near_duplicate' || st === 'superseded') {
      if (dec === 'excluded') return `<span class="badge b-gray">🚫 ${esc(t('organizer.dup_excluded_badge'))}</span>`;
      if (dec === 'isolated') return `<span class="badge b-teal">📁 ${esc(t('organizer.dup_isolated_badge'))}</span>`;
      return `<span class="badge b-amber">⏳ ${esc(t('organizer.dup_pending_badge'))}</span>`;
    }
    if (dec === 'kept') return `<span class="badge b-green">✅ ${esc(t('organizer.dup_kept_badge'))}</span>`;
    return '';
  };
  const nearReasonBadge = (r) => {
    const map = {
      name: 'organizer.reason_name',
      content: 'organizer.reason_content',
      ref: 'organizer.reason_ref',
      name_and_content: 'organizer.reason_name_content',
    };
    return map[r] ? `<span class="badge b-blue">${esc(t(map[r]))}</span>` : '';
  };
  const statusChip = (it) => {
    if (it.status === 'duplicate') return `<span class="badge b-amber">${esc(t('organizer.status_dup'))}</span>`;
    if (it.status === 'near_duplicate') return `<span class="badge pill-purple">${esc(t('organizer.status_near_dup'))}</span>`;
    if (it.status === 'superseded') return `<span class="badge b-amber">${esc(t('organizer.status_sup'))}</span>`;
    if (it.status === 'skip') return `<span class="badge b-gray">${esc(t('organizer.status_skip'))}</span>`;
    return `<span class="badge b-green">${esc(t('organizer.status_keep'))}</span>`;
  };

  const rowsHtml = (data.items || []).map(it => {
    const itSecOpts = secs.map(s => `<option value="${esc(s.id)}" ${s.id===it.section?'selected':''}>${esc(s.label)}</option>`).join('');
    const logTag = it.log_status === 'matched' ? `<span class="badge b-green">✓ LOG</span>` : `<span class="badge b-red">! LOG</span>`;
    const isDupOrSup = it.status === 'duplicate' || it.status === 'near_duplicate' || it.status === 'superseded';
    const dec = it.decision || (isDupOrSup ? 'pending' : '');
    const matchInfo = it.status === 'duplicate' && it.duplicate_of
      ? `<div style="font-size:11.5px;color:#b45309;margin-top:2px">📎 ${esc(t('organizer.dup_match_label'))}: <span class="ltr">${esc(it.duplicate_of)}</span></div>`

           <button type="button" class="btn btn-sm ${dec==='isolated'?'btn-amber':''}" ${jobRunning ? 'disabled' : ''} style="padding:2px 7px;font-size:11px" onclick="updateOrganizerItem(${jsStr(it.id)},{decision:'isolated'},this)">📁 ${esc(t('organizer.act_isolate_btn'))}</button>
           <button type="button" class="btn btn-sm ${dec==='excluded'?'btn-danger':''}" ${jobRunning ? 'disabled' : ''} style="padding:2px 7px;font-size:11px" onclick="updateOrganizerItem(${jsStr(it.id)},{decision:'excluded'},this)">🚫 ${esc(t('organizer.act_exclude_btn'))}</button>
         </div>`

      : (it.custom_name ? `<span class="badge b-blue">✎ ${esc(t('organizer.custom_name_badge'))}</span>` : '');
    const rowAiBtn = it.status === 'keep'
      ? `<button type="button" class="btn btn-sm" ${jobRunning ? 'disabled' : ''} style="padding:3px 7px;font-size:11px;white-space:nowrap" onclick="aiRenameSingle(${jsStr(it.id)}, this)" title="${esc(t('organizer.ai_row_btn'))}">🤖 ${esc(t('organizer.ai_row_btn'))}</button>`

            <select class="ctrl-in" style="max-width:170px;font-size:12px" onchange="updateOrganizerItem(${jsStr(it.id)},{section:this.value})">${itSecOpts}</select>

    : ((S.orgFilter === 'near_duplicate' && (counts.near_duplicate_resolved || 0) > 0)
        ? `<button type="button" class="btn btn-sm" onclick="S.orgShowResolved=!S.orgShowResolved;S.orgPage=1;renderOrganizerView()">${S.orgShowResolved ? '🙈 ' + esc(t('organizer.hide_resolved_btn')) : '👁 ' + esc(t('organizer.show_resolved_btn'))} (${counts.near_duplicate_resolved})</button>`
        : ((S.orgFilter === 'superseded' && (counts.superseded_resolved || 0) > 0)
            ? `<button type="button" class="btn btn-sm" onclick="S.orgShowResolved=!S.orgShowResolved;S.orgPage=1;renderOrganizerView()">${S.orgShowResolved ? '🙈 ' + esc(t('organizer.hide_resolved_btn')) : '👁 ' + esc(t('organizer.show_resolved_btn'))} (${counts.superseded_resolved})</button>`
            : ''));
