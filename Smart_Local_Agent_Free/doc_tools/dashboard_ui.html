async function runGlobalSearch(btnEl = null) {
  const inp = document.getElementById('gSearchInput');
  const sel = document.getElementById('gSearchPid');
  if (inp) S.searchQuery = inp.value.trim();
  if (sel) S.searchPid = sel.value;
  if (!S.searchQuery) { S.searchData = null; return renderSearchView(); }
  try {
    const res = await withBusyButton(btnEl, () => api(
      `/api/search?q=${encodeURIComponent(S.searchQuery)}&project_id=${encodeURIComponent(S.searchPid || '')}&kind=${encodeURIComponent(S.searchKind || 'all')}`
    ));
    S.searchData = res;
    await renderSearchView();
  } catch (e) { toast(e.message, 'err'); }
}

function setSearchKindFilter(kind) {
  S.searchKind = kind || 'all';
  if (S.searchQuery) runGlobalSearch();
}

function jumpFromSearch(pid, viewName, secId = '') {
  S.pid = pid;
  if (viewName === 'section' && secId) navigate('section', secId);
  else if (viewName === 'whatsapp') navigate('whatsapp', pid);
  else navigate('overview', pid);
}

/* ── Inline Document Preview Modal (Feature 4) ───────────────────────────── */
async function openInlineDocPreview({ pid = '', rel = '', area = 'root', title = '', refNo = '' }) {
  const targetPid = pid || S.pid;
  if (!targetPid || !rel) return;
  if (S.docPreview.blobUrl) {
    try { URL.revokeObjectURL(S.docPreview.blobUrl); } catch (_) {}
  }
  const seq = (S.docPreview.seq || 0) + 1;
  S.docPreview = { pid: targetPid, rel, area: area || 'root', title: title || rel, refNo: refNo || '', page: 1, total: 1, zoom: 100, blobUrl: '', kind: '', downloadUrl: '', seq };

  openModal(
    `👁 ${esc(t('doc_preview.title'))}${title ? ' — ' + esc(title) : ''}`,
    `<div id="inlineDocPreviewBox" class="studio-canvas-card" style="height:72vh">
      <div class="doc-viewer-bar">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <button type="button" class="btn btn-sm" id="inlinePrevBtn" onclick="changeInlineDocPage(-1)" disabled>◀ ${esc(t('doc_preview.prev_btn'))}</button>
          <span id="inlinePageLbl" class="pill pill-gray">—</span>
          <button type="button" class="btn btn-sm" id="inlineNextBtn" onclick="changeInlineDocPage(1)" disabled>${esc(t('doc_preview.next_btn'))} ▶</button>
        </div>
        <div class="doc-viewer-controls">
          <button type="button" class="btn btn-sm" onclick="stepInlineDocZoom(-15)" title="${esc(t('viewer.zoom_out_title'))}">🔍−</button>
          <button type="button" class="btn btn-sm" id="inlineZoomLbl" onclick="stepInlineDocZoom(0)" title="${esc(t('viewer.zoom_reset_title'))}">100%</button>
          <button type="button" class="btn btn-sm" onclick="stepInlineDocZoom(15)" title="${esc(t('viewer.zoom_in_title'))}">🔍+</button>
          <button type="button" class="btn btn-primary btn-sm" id="inlineFsBtn" onclick="toggleDocViewerFullscreen('inlineDocPreviewBox','inlineFsBtn')">⛶ ${esc(t('viewer.expand_btn'))}</button>
        </div>
      </div>
      <div id="inlinePreviewStage" class="doc-viewer-scroll" style="padding:14px;overflow:auto;flex:1;background:#cbd5e1;text-align:center">
        <div class="card" style="max-width:340px;margin:24px auto">${esc(t('doc_preview.loading'))}</div>
      </div>
    </div>`,
    `<button type="button" class="btn" onclick="closeModal()">${esc(t('common.close'))}</button>
     <button type="button" class="btn" onclick="pinToTray({kind:'doc',pid:${jsStr(targetPid)},rel:${jsStr(rel)},area:${jsStr(area||'root')},title:${jsStr(title||refNo||rel)},refNo:${jsStr(refNo||'')}})">📌 ${esc(t('taskbar.pin_doc_btn'))}</button>
     <a class="btn btn-blue" id="inlinePreviewDlBtn" href="#" style="display:none">⬇ ${esc(t('doc_preview.download_btn'))}</a>
     <button type="button" class="btn btn-primary" onclick="openSendWhatsAppModal('','',${jsStr(rel)},${jsStr(t('issue.wa_prefill_msg',{ref:refNo||title||'',subject:title||'',project:(S.projDetail&&S.projDetail.project&&S.projDetail.project.name)||''}))},${jsStr(area||'root')})">💬 ${esc(t('issue.send_wa_btn'))}</button>`,
    true
  );

  try {
    const info = await api(`/api/projects/${encodeURIComponent(targetPid)}/preview-info?rel=${encodeURIComponent(rel)}&area=${encodeURIComponent(area || 'root')}`);
    if (S.docPreview.seq !== seq) return;
    S.docPreview.kind = info.kind || 'unsupported';
    S.docPreview.total = Math.max(1, Number(info.total_pages || 1));
    S.docPreview.downloadUrl = info.download_url || '';
    const dlEl = document.getElementById('inlinePreviewDlBtn');
    if (dlEl && S.docPreview.downloadUrl) {
      dlEl.href = S.docPreview.downloadUrl;
      dlEl.style.display = 'inline-flex';
    }
    const stage = document.getElementById('inlinePreviewStage');
    if (!stage) return;
    if (info.kind === 'office' && info.render) {
      stage.style.background = '#fff';
      stage.style.textAlign = 'right';
      const pLbl = document.getElementById('inlinePageLbl');
      if (pLbl) pLbl.textContent = info.name || '';
      stage.innerHTML = buildVisualCanvasHtml(info.render, null, false);
      return;
    }
    if (info.kind === 'pdf_no_fitz') {
      stage.innerHTML = `<div class="card" style="max-width:440px;margin:24px auto;text-align:center">
        <div style="font-size:40px;margin-bottom:8px">📄</div>
        <div class="alert alert-amber">${esc(t('doc_preview.pymupdf_needed'))}</div>
        ${S.docPreview.downloadUrl ? `<a class="btn btn-primary" href="${esc(S.docPreview.downloadUrl)}">⬇ ${esc(t('doc_preview.download_btn'))}</a>` : ''}
      </div>`;
      return;
    }
    if (info.kind === 'image' || info.kind === 'pdf') {
      await loadInlineDocPage(1);
      return;
    }
    stage.innerHTML = `<div class="card" style="max-width:440px;margin:24px auto;text-align:center">
      <div class="alert alert-amber">${esc(t('doc_preview.unsupported'))}</div>
      ${S.docPreview.downloadUrl ? `<a class="btn btn-primary" href="${esc(S.docPreview.downloadUrl)}">⬇ ${esc(t('doc_preview.download_btn'))}</a>` : ''}
    </div>`;
  } catch (e) {
    const stage = document.getElementById('inlinePreviewStage');
    if (stage) stage.innerHTML = `<div class="card" style="max-width:420px;margin:24px auto"><div class="alert alert-red">${esc(e.message)}</div></div>`;
  }
}

async function loadInlineDocPage(pageNo) {
  const dp = S.docPreview;
  if (!dp || !dp.pid || !dp.rel) return;
  const seq = dp.seq;
  dp.page = Math.max(1, Math.min(dp.total || 1, Number(pageNo || 1)));
  const stage = document.getElementById('inlinePreviewStage');
  const pLbl = document.getElementById('inlinePageLbl');
  const prevBtn = document.getElementById('inlinePrevBtn');
  const nextBtn = document.getElementById('inlineNextBtn');
  if (stage) stage.innerHTML = `<div class="card" style="max-width:300px;margin:24px auto">${esc(t('doc_preview.loading'))}</div>`;
  try {
    const resp = await fetch(`/api/projects/${encodeURIComponent(dp.pid)}/preview-page?rel=${encodeURIComponent(dp.rel)}&area=${encodeURIComponent(dp.area)}&page=${dp.page}&dpi=135`);
    if (S.docPreview.seq !== seq) return;
    if (!resp.ok) throw new Error(t('doc_preview.unsupported'));
    dp.total = Math.max(1, Number(resp.headers.get('X-Total-Pages') || dp.total || 1));
    const blob = await resp.blob();
    if (S.docPreview.seq !== seq) return;
    if (dp.blobUrl) { try { URL.revokeObjectURL(dp.blobUrl); } catch (_) {} }
    dp.blobUrl = URL.createObjectURL(blob);
    if (pLbl) pLbl.textContent = t('doc_preview.page_of', { page: dp.page, total: dp.total });
    if (prevBtn) prevBtn.disabled = dp.page <= 1;
    if (nextBtn) nextBtn.disabled = dp.page >= dp.total;
    if (stage) {
      stage.innerHTML = `<img id="inlinePreviewImg" src="${dp.blobUrl}" alt="${esc(dp.title)}" style="width:${dp.zoom}%;max-width:${dp.zoom > 100 ? 'none' : '100%'};background:#fff;border-radius:6px;box-shadow:var(--shadow-lg)">`;
    }
  } catch (e) {
    if (stage) stage.innerHTML = `<div class="card" style="max-width:420px;margin:24px auto"><div class="alert alert-amber">${esc(e.message)}</div></div>`;
  }
}

function changeInlineDocPage(delta) {
  const dp = S.docPreview;
  if (!dp) return;
  const next = Math.max(1, Math.min(dp.total || 1, (dp.page || 1) + delta));
  if (next !== dp.page) loadInlineDocPage(next);
}

function stepInlineDocZoom(delta) {
  const dp = S.docPreview;
  if (!dp) return;
  dp.zoom = delta === 0 ? 100 : Math.max(50, Math.min(220, (dp.zoom || 100) + delta));
  const lbl = document.getElementById('inlineZoomLbl');
  if (lbl) lbl.textContent = dp.zoom + '%';
  const img = document.getElementById('inlinePreviewImg');
  if (img) {
    img.style.width = dp.zoom + '%';
    img.style.maxWidth = dp.zoom > 100 ? 'none' : '100%';
    return;
  }
  const inner = document.querySelector('#inlinePreviewStage > div');
  if (inner) {
    inner.style.transformOrigin = 'top center';
    inner.style.transform = dp.zoom === 100 ? '' : `scale(${dp.zoom / 100})`;
  }
}

async function submitNewProject(btnEl) {
  const name = document.getElementById('np_name').value.trim();
  if (!name) { toast(t('new_project.name_required'), 'err'); return; }
  const body = {
    name,
    code: document.getElementById('np_code').value.trim() || 'PRJ',
    root: document.getElementById('np_root').value.trim(),
    inbox_dir: document.getElementById('np_inbox').value.trim(),
    archive_dir: document.getElementById('np_archive').value.trim(),
    aliases: document.getElementById('np_aliases')?.value.trim() || '',
    subcontractors: document.getElementById('np_subs')?.value.trim() || '',
    unrelated_policy: document.getElementById('np_policy')?.value || '',
    set_active: true,
  };
  const logFile = document.getElementById('np_log').files[0];
  try {
    await withBusyButton(btnEl, async () => {
      if (logFile) {
        body.initial_log = { name: logFile.name, data_b64: await fileToBase64(logFile) };
      } else {
        const linkedLog = document.getElementById('np_linked_log')?.value.trim() || '';
        if (linkedLog) body.linked_log_path = linkedLog;
      }
      const res = await api('/api/projects', { body });
      closeModal();
      S.pid = res.project.id;
      await refreshHub();
      toast(t('new_project.created_toast'));
      await navigate(logFile ? 'logs' : 'overview');
    });
  } catch (e) { toast(e.message, 'err'); }
}

/* ── Dedicated Scanner Triage Screen ─────────────────────────────────────── */
function _scannerSyncTimer(job) {
  if (job && job.running) {
    if (!S.scannerPollTimer) {
      S.scannerPollTimer = setInterval(async () => {
        if (S.view !== 'scanner' || !S.pid) {
          clearInterval(S.scannerPollTimer);
          S.scannerPollTimer = null;
          S.scannerPollBusy = false;
          return;
        }
        if (S.scannerPollBusy) return;
        S.scannerPollBusy = true;
        try {
          await renderScannerView(true);
        } finally {
          S.scannerPollBusy = false;
        }
      }, 850);
    }
  } else if (S.scannerPollTimer) {
    clearInterval(S.scannerPollTimer);
    S.scannerPollTimer = null;
    S.scannerPollBusy = false;
  }
}

async function renderScannerView(fromPoll = false) {
  const mv = document.getElementById('mainView');
  if (!fromPoll && !S.scannerState) {
    mv.innerHTML = `<div class="card">${esc(t('common.loading'))}</div>`;
  }
  const prevRunning = Boolean(S.scannerJob && S.scannerJob.running);
  const [res, pd] = await Promise.all([
    api(`/api/projects/${encodeURIComponent(S.pid)}/scanner`),
    api(`/api/projects/${encodeURIComponent(S.pid)}`),
  ]);
  S.projDetail = pd;
  S.scannerState = res;
  const job = res.job || S.scannerJob || { running: false };
  S.scannerJob = (job.running || job.phase === 'done' || job.phase === 'error') ? job : S.scannerJob;
  _scannerSyncTimer(job);
  updateGlobalActivityBar();
  _ensureLiveTick();
  if (fromPoll && prevRunning && job.running) {
    const host = document.getElementById('scannerJobHost');
    if (host) {
      host.innerHTML = _renderUnifiedJobHtml('scanner', job, { canStop: false });
      return;
    }
  }
  if (fromPoll && prevRunning && !job.running) {
    await refreshHub(true);
    if (job.phase === 'done') {
      const ss = job.summary || job.last_summary || {};
      toast(t('scanner.scanned_toast', { count: ss.added ?? 0 }));
      if (Array.isArray(ss.errors) && ss.errors.length) {
        toast(t('scanner.scan_errors_hint', { errs: ss.errors.slice(0, 2).join(' | ') }), 'err');
      }
    } else if (job.phase === 'error' && job.error) {
      toast(job.error, 'err');
    }
  }
  const pend = res.pending || [];
  const appr = res.approved || [];
  const rej = res.rejected || [];
  const secs = projSections();
  const watcherOn = Boolean(res.watcher_running);
  const scannerBusy = Boolean(S.scannerJob && S.scannerJob.running);
  const scanBtnLbl = scannerBusy ? ('⏳ ' + esc(t('jobs.busy_wait'))) : ('🔍 ' + esc(t('scanner.scan_btn')));

  const badgeFolder = res.inbox_exists
    ? `<span class="pill pill-green">● ${esc(t('scanner.status_connected'))} (${res.folder_files_count || 0})</span>`
    : `<span class="pill pill-red">● ${esc(t('scanner.status_missing'))}</span>`;
  const lastErrs = (pd && Array.isArray(pd.last_scan_errors) ? pd.last_scan_errors : []).filter(Boolean);
  const netWarnBanner = !res.inbox_exists
    ? `<div class="banner warn" style="margin-top:10px"><span>⚠️</span><div>${esc(t('scanner.network_missing_hint'))}</div></div>`
    : (lastErrs.length
        ? `<div class="banner err" style="margin-top:10px"><span>⚠️</span><div>${esc(t('scanner.scan_errors_hint', { errs: lastErrs.slice(0, 3).join(' | ') }))}</div></div>`
        : '');

  let bodyHtml = '';
  if (S.scannerTab === 'pending') {
    if (!pend.length) {
      bodyHtml = `<div class="card" style="text-align:center;padding:30px">
        <p class="sub" style="margin-bottom:12px">${esc(t('scanner.empty_pending'))}</p>
        <button class="btn btn-primary" ${scannerBusy ? 'disabled' : ''} onclick="scanScannerNow(this)">${scanBtnLbl}</button>
      </div>`;
    } else {
      const multiCount = (res.counts && res.counts.multipage != null)

async function scanScannerNow(btnEl) {
  try {
    S.scannerJob = { running: true, kind: 'scanner_scan', phase: 'scanning', started_ts: Date.now() / 1000, elapsed_seconds: 0 };
    const host = document.getElementById('scannerJobHost');
    if (host) host.innerHTML = _renderUnifiedJobHtml('scanner', S.scannerJob, { canStop: false });
    updateGlobalActivityBar();
    _ensureLiveTick();
    const res = await withBusyButton(btnEl, () => api(`/api/projects/${encodeURIComponent(S.pid)}/scanner/scan`, { body: { blocking: false } }));
    if (res && res.job) S.scannerJob = res.job;
    _scannerSyncTimer(S.scannerJob);
    await renderScannerView(true);
  } catch (e) {
    S.scannerJob = { running: false, kind: 'scanner_scan', phase: 'error', error: e.message, elapsed_seconds: 0 };
    updateGlobalActivityBar();
    toast(e.message, 'err');
    await renderScannerView(true);
  }
}

let _splitModalCtx = null;
async function openScannerSplitModal(itemId, forceRefresh = false, btnEl = null) {
  const pend = (S.scannerState && S.scannerState.pending) || [];
  const item = pend.find(x => x.id === itemId);
  const titleNm = item ? item.file_name : itemId;
  if (!forceRefresh) {
    openModal(
      `🤖 ${esc(t('scanner.split_modal_title'))} — ${esc(titleNm)}`,
      `<div id="splitModalBody" style="padding:26px;text-align:center">
        <div class="pill pill-blue" style="font-size:14px;padding:7px 14px">⏳ ${esc(t('scanner.split_analyzing'))}</div>
      </div>`,
      `<button class="btn" onclick="closeModal()">${esc(t('common.close'))}</button>`,
      true
    );
  }
  try {
    const reqCall = () => api(`/api/projects/${encodeURIComponent(S.pid)}/scanner/analyze-split`, {
      body: { id: itemId, force_refresh: Boolean(forceRefresh) },
    });
    const res = btnEl ? await withBusyButton(btnEl, reqCall) : await reqCall();
    _splitModalCtx = {
      itemId,
      fileName: res.file_name || titleNm,
      pageCount: Number(res.page_count || 1),
      mode: res.mode || 'heuristic',
      fromCache: Boolean(res.from_cache),
      cachedAt: res.cached_at || '',
      warning: res.warning || '',
      zoomPage: 0,
      ranges: (res.documents || []).map(d => ({ ...d })),
    };
    renderScannerSplitModalBody();
  } catch (e) {
    const b = document.getElementById('splitModalBody');
    if (b) b.innerHTML = `<div class="banner err"><span>⚠️</span><div>${esc(e.message)}</div></div>`;
  }
}

function renderScannerSplitModalBody() {
  if (!_splitModalCtx) return;
  const ctx = _splitModalCtx;
  const secs = projSections();
  const modePill = ctx.mode === 'ai'
    ? `<span class="pill pill-purple">✨ ${esc(t('scanner.split_ai_used', { count: ctx.ranges.length }))}</span>`
    : `<span class="pill pill-blue">🧭 ${esc(t('scanner.split_heuristic_used', { count: ctx.ranges.length }))}</span>`;
  const cachePill = ctx.fromCache
    ? ` <span class="pill pill-green" title="${esc(ctx.cachedAt || '')}">${esc(t('scanner.split_cached_badge'))}</span>`
    : '';
  const singleHint = ctx.ranges.length === 1
    ? `<div class="sub" style="margin-top:4px">ℹ️ ${esc(t('scanner.split_single_hint'))}</div>` : '';
  const warnBox = ctx.warning
    ? `<div class="sub" style="margin-top:4px;color:var(--amber)">⚠️ ${esc(ctx.warning)}</div>` : '';

  const groupColors = ['#035D89', '#D96B07', '#059BE5', '#99640A', '#C8522E', '#0284C7'];
  const pageGroupIdx = p => {
    for (let i = 0; i < ctx.ranges.length; i++) {
      if (p >= Number(ctx.ranges[i].start_page) && p <= Number(ctx.ranges[i].end_page)) return i;
    }
    return -1;
  };

  let thumbsHtml = '';
  for (let p = 1; p <= ctx.pageCount; p++) {
    const gi = pageGroupIdx(p);
    const clr = gi >= 0 ? groupColors[gi % groupColors.length] : '#94a3b8';
    const thumbUrl = `/api/projects/${encodeURIComponent(S.pid)}/scanner/page-thumb?id=${encodeURIComponent(ctx.itemId)}&page=${p}&dpi=100`;
    thumbsHtml += `<div class="split-thumb-card" style="border-color:${ctx.zoomPage===p?'#F6820D':clr}" onclick="previewSplitPageLarge(${p})">
      <img src="${esc(thumbUrl)}" alt="p.${p}" loading="lazy">
      <div style="margin-top:4px;display:flex;justify-content:space-between;align-items:center;font-size:11px">
        <strong class="ltr">P.${p}</strong>
        ${gi >= 0 ? `<span class="pill" style="background:${clr};color:#fff;padding:1px 6px;font-size:10px">#${gi + 1}</span>` : ''}
      </div>
    </div>`;
  }

  const zoomBox = ctx.zoomPage > 0 ? `<div style="margin:8px 0;padding:10px;background:#f8fafc;border:1px solid var(--border-strong);border-radius:8px;text-align:center">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <strong>👁 ${esc(t('scanner.split_preview_page'))} #${ctx.zoomPage}</strong>
      <button type="button" class="btn btn-sm" onclick="_splitModalCtx.zoomPage=0;renderScannerSplitModalBody()">✕</button>
    </div>
    <img src="/api/projects/${encodeURIComponent(S.pid)}/scanner/page-thumb?id=${encodeURIComponent(ctx.itemId)}&page=${ctx.zoomPage}&dpi=170" style="max-width:100%;max-height:420px;border:1px solid var(--border);border-radius:6px">
  </div>` : '';

  const rangesHtml = ctx.ranges.map((r, idx) => {
    const clr = groupColors[idx % groupColors.length];
    const secOpts = secs.map(s => `<option value="${esc(s.id)}" ${r.section===s.id?'selected':''}>${esc(s.label)}</option>`).join('');
    return `<div class="split-range-card" style="border-right-color:${clr}">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span class="pill" style="background:${clr};color:#fff">#${idx + 1}</span>
          <span class="pill pill-gray ltr">${esc(t('scanner.split_from_page'))}: ${r.start_page} → ${esc(t('scanner.split_to_page'))}: ${r.end_page}</span>
          ${r.reason ? `<span class="sub">${esc(r.reason)}</span>` : ''}
        </div>
        ${idx > 0 ? `<button type="button" class="btn btn-sm" onclick="mergeSplitRange(${idx})">🔗 ${esc(t('scanner.split_merge_prev'))}</button>` : ''}
      </div>
      <div class="form-grid">
        <div class="fg"><label>${esc(t('scanner.split_from_page'))}</label><input type="number" class="ltr" min="1" max="${ctx.pageCount}" value="${r.start_page}" onchange="updateSplitRangeField(${idx},'start_page',Number(this.value||1))"></div>
        <div class="fg"><label>${esc(t('scanner.split_to_page'))}</label><input type="number" class="ltr" min="1" max="${ctx.pageCount}" value="${r.end_page}" onchange="updateSplitRangeField(${idx},'end_page',Number(this.value||1))"></div>
        <div class="fg"><label>${esc(t('scanner.section_label'))}</label><select onchange="updateSplitRangeField(${idx},'section',this.value)">${secOpts}</select></div>
        <div class="fg"><label>${esc(t('scanner.subject_label'))}</label><input value="${esc(r.title || '')}" onchange="updateSplitRangeField(${idx},'title',this.value)"></div>
        <div class="fg"><label>${esc(t('scanner.ref_label'))}</label><input class="ltr" value="${esc(r.ref_no || '')}" onchange="updateSplitRangeField(${idx},'ref_no',this.value)"></div>
        <div class="fg"><label>${esc(t('issue.party'))}</label><input value="${esc(r.party_name || '')}" onchange="updateSplitRangeField(${idx},'party_name',this.value)"></div>
        <div class="fg"><label>${esc(t('issue.doc_date'))}</label><input type="date" value="${esc(r.doc_date || '')}" onchange="updateSplitRangeField(${idx},'doc_date',this.value)"></div>
      </div>
    </div>`;
  }).join('');

  const bodyEl = document.getElementById('splitModalBody');
  if (bodyEl) {
    bodyEl.style.padding = '0';
    bodyEl.style.textAlign = 'right';
    bodyEl.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <div>${modePill}${cachePill} ${singleHint}${warnBox}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button type="button" class="btn btn-sm" onclick="openScannerSplitModal(${jsStr(ctx.itemId)}, true, this)">🔄 ${esc(t('scanner.split_reanalyze_btn'))}</button>
          <button type="button" class="btn btn-sm" onclick="addSplitRange()">+ ${esc(t('scanner.split_add_range'))}</button>
        </div>
      </div>
      <div class="split-thumbs-strip">${thumbsHtml}</div>
      ${zoomBox}
      <div>${rangesHtml}</div>
    `;
  }
  const ftEl = document.getElementById('modalFoot');
  if (ftEl) {
    ftEl.innerHTML = `
      <button class="btn" onclick="closeModal()">${esc(t('common.close'))}</button>
      <button class="btn btn-blue" onclick="submitScannerSplit(false, this)">✂️ ${esc(t('scanner.split_to_inbox_btn'))}</button>
      <button class="btn btn-primary" onclick="submitScannerSplit(true, this)">⚡ ${esc(t('scanner.split_and_archive_btn'))}</button>
    `;
  }
}

function previewSplitPageLarge(p) {
  if (!_splitModalCtx) return;
  _splitModalCtx.zoomPage = (_splitModalCtx.zoomPage === p) ? 0 : p;
  renderScannerSplitModalBody();
}

function updateSplitRangeField(idx, key, val) {
  if (!_splitModalCtx || !_splitModalCtx.ranges[idx]) return;
  _splitModalCtx.ranges[idx][key] = val;
  if (key === 'start_page' || key === 'end_page') renderScannerSplitModalBody();
}

function addSplitRange() {
  if (!_splitModalCtx) return;
  const ctx = _splitModalCtx;
  const last = ctx.ranges[ctx.ranges.length - 1];
  if (last && Number(last.end_page) > Number(last.start_page)) {
    const mid = Math.floor((Number(last.start_page) + Number(last.end_page)) / 2);
    const oldEnd = Number(last.end_page);
    last.end_page = mid;
    ctx.ranges.push({
      start_page: mid + 1,
      end_page: oldEnd,
      title: '',
      section: last.section || 'general',
      ref_no: '',
      party_name: last.party_name || '',
      doc_date: last.doc_date || '',
      reason: '',
    });
  } else {
    ctx.ranges.push({
      start_page: 1,
      end_page: ctx.pageCount,
      title: '',
      section: 'general',
      ref_no: '',
      party_name: '',
      doc_date: '',
      reason: '',
    });
  }
  renderScannerSplitModalBody();
}

function mergeSplitRange(idx) {
  if (!_splitModalCtx || idx <= 0 || idx >= _splitModalCtx.ranges.length) return;
  const prev = _splitModalCtx.ranges[idx - 1];
  const cur = _splitModalCtx.ranges[idx];
  prev.end_page = Math.max(Number(prev.end_page), Number(cur.end_page));
  _splitModalCtx.ranges.splice(idx, 1);
  renderScannerSplitModalBody();
}

async function submitScannerSplit(autoApprove, btnEl) {
  if (!_splitModalCtx) return;
  const ctx = _splitModalCtx;
  const seen = new Set();
  for (const rg of ctx.ranges) {
    const sp = Number(rg.start_page || 0);
    const ep = Number(rg.end_page || 0);
    if (sp < 1 || ep < sp || ep > ctx.pageCount) {
      toast(t('scanner.split_bad_range'), 'err');
      return;
    }
    for (let p = sp; p <= ep; p++) {
      if (seen.has(p)) {
        toast(t('scanner.split_bad_range'), 'err');
        return;
      }
      seen.add(p);
    }
  }
  try {
    await withBusyButton(btnEl, async () => {
      const res = await api(`/api/projects/${encodeURIComponent(S.pid)}/scanner/apply-split`, {
        body: { id: ctx.itemId, ranges: ctx.ranges, auto_approve: Boolean(autoApprove) },
      });
      const sr = res.split_result || {};
      closeModal();
      await refreshHub(true);
      await renderScannerView();
      const cnt = sr.split_count || ctx.ranges.length;
      toast(autoApprove ? t('scanner.split_archived_toast', { count: cnt }) : t('scanner.split_done_toast', { count: cnt }));
    });
  } catch (e) { toast(e.message, 'err'); }
}

async function toggleScannerWatcher(enabled, btnEl) {

      await api('/api/watcher/toggle', { body: { enable: Boolean(enabled) } });
      await refreshHub(true);
      await renderScannerView();
    });
  } catch (e) { toast(e.message, 'err'); }
}

async function approveScannerItem(itemId, btnEl) {
  const section = document.getElementById('sc_sec_' + itemId)?.value || '';
  const subject_ar = document.getElementById('sc_subj_' + itemId)?.value.trim() || '';
  const ref_no = document.getElementById('sc_ref_' + itemId)?.value.trim() || '';
  const sBox = document.getElementById('sc_submittal_box_' + itemId);
  const subVis = String(section).startsWith('submittal') || (sBox && sBox.style.display !== 'none');
  const authority = subVis ? (document.getElementById('sc_auth_' + itemId)?.value || '') : '';
  const consultant_reply_date = subVis ? (document.getElementById('sc_crd_' + itemId)?.value.trim() || '') : '';
  const moh_reply_date = subVis ? (document.getElementById('sc_mrd_' + itemId)?.value.trim() || '') : '';
  const overrides = { section, subject_ar, ref_no };
  if (authority) overrides.authority = authority;
  if (consultant_reply_date) overrides.consultant_reply_date = consultant_reply_date;
  if (moh_reply_date) overrides.moh_reply_date = moh_reply_date;
  if (authority === 'MOH+CONSULTANT') overrides.has_both_stamps = true;
  const linkRaw = (section === 'incoming' || section === 'outgoing') ? (document.getElementById('sc_link_' + itemId)?.value || '') : '';
  if (linkRaw) {
    try { overrides.link_to_refs = [JSON.parse(linkRaw)]; } catch (_) {}
  }
  try {
    await withBusyButton(btnEl, async () => {
      await api(`/api/projects/${encodeURIComponent(S.pid)}/scanner/approve`, {
        body: { id: itemId, overrides }
      });
      await refreshHub(true);
      await renderScannerView();
      toast(t('scanner.approved_toast'));
    });
  } catch (e) { toast(e.message, 'err'); }
}

/* ── Custom Project Sections Manager ─────────────────────────────────────── */
let _secDraft = [];
async function openManageSectionsModal() {
  if (!S.pid) return;
  try {
    const res = await api(`/api/projects/${encodeURIComponent(S.pid)}/sections`);
    _secDraft = (res.all_sections || res.sections || []).map(s => ({
      ...s,
      hidden: Boolean(s.hidden),
      enabled: !Boolean(s.hidden),
      archive_folder: s.archive_folder || s.folder || '',
    }));
    paintManageSectionsModal();
  } catch (e) { toast(e.message, 'err'); }
}

function paintManageSectionsModal() {
  const rows = _secDraft.map((s, idx) => `<tr>
    <td><input type="checkbox" ${!s.hidden?'checked':''} onchange="_secDraft[${idx}].hidden=!this.checked;_secDraft[${idx}].enabled=this.checked"></td>
    <td><input value="${esc(s.label)}" onchange="_secDraft[${idx}].label=this.value" style="width:100%;padding:4px 6px;border:1px solid var(--border-strong);border-radius:5px"></td>
    <td><input class="ltr" value="${esc(s.ref_prefix||'')}" onchange="_secDraft[${idx}].ref_prefix=this.value.toUpperCase()" style="width:80px;padding:4px 6px;border:1px solid var(--border-strong);border-radius:5px"></td>
    <td><input class="ltr" value="${esc(s.archive_folder||'')}" onchange="_secDraft[${idx}].archive_folder=this.value" style="width:100%;padding:4px 6px;border:1px solid var(--border-strong);border-radius:5px"></td>
    <td>${s.is_custom ? `<button class="btn btn-danger btn-sm" onclick="_secDraft.splice(${idx},1);paintManageSectionsModal()">✕</button>` : ''}</td>
  </tr>`).join('');

  openModal(
    '✏️ ' + esc(t('sections.manage_title')),
    `<div class="tbl-wrap" style="max-height:360px"><table class="dtbl">
      <thead><tr><th>${esc(t('sections.visible_label'))}</th><th>${esc(t('sections.name_label'))}</th><th>${esc(t('sections.prefix_label'))}</th><th>${esc(t('sections.folder_label'))}</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input id="new_sec_label" placeholder="${esc(t('sections.name_label'))}" style="padding:6px 9px;border:1px solid var(--border-strong);border-radius:7px;flex:1;min-width:160px">
      <input id="new_sec_pref" class="ltr" placeholder="${esc(t('sections.prefix_label'))}" style="padding:6px 9px;border:1px solid var(--border-strong);border-radius:7px;width:90px">
      <input id="new_sec_fold" class="ltr" placeholder="${esc(t('sections.folder_label'))}" style="padding:6px 9px;border:1px solid var(--border-strong);border-radius:7px;width:150px">
      <button class="btn btn-sm" onclick="addCustomSectionRow()">+ ${esc(t('sections.add_btn'))}</button>
    </div>`,
    `<button class="btn" onclick="closeModal()">${esc(t('common.back'))}</button>
     <button class="btn btn-primary" onclick="saveCustomSections(this)">💾 ${esc(t('sections.save_btn'))}</button>`,
    true
  );
}

function addCustomSectionRow() {
  const label = document.getElementById('new_sec_label').value.trim();
  if (!label) { toast(t('sections.name_required'), 'err'); return; }
  const pref = document.getElementById('new_sec_pref').value.trim().toUpperCase() || 'DOC';
  const fold = document.getElementById('new_sec_fold').value.trim() || ('Custom_' + pref);
  const id = 'custom_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 5);
  _secDraft.push({ id, label, ref_prefix: pref, archive_folder: fold, hidden: false, enabled: true, is_custom: true });
  paintManageSectionsModal();
}

async function saveCustomSections(btnEl) {
  try {
    await withBusyButton(btnEl, async () => {
      const res = await api(`/api/projects/${encodeURIComponent(S.pid)}/sections`, { body: { sections: _secDraft } });
      if (S.projDetail && S.projDetail.project && S.projDetail.project.id === S.pid) {
        S.projDetail.sections = res.sections;
      }
      closeModal();
      await refreshHub(true);
      if (S.view === 'scanner') await renderScannerView();
      else if (S.view === 'studio') paintStudio();
      toast(t('sections.saved_toast'));
    });
  } catch (e) { toast(e.message, 'err'); }
}

/* ── Project Overview & Inbox View ───────────────────────────────────────── */
function _buildOverviewTableHtml(rows, pid, hasLog, query) {
  _letterRowsCtx = [];
  if (!rows.length) {
    return `<p class="sub" style="text-align:center;padding:18px">${esc(hasLog ? (query || S.ovSecFilter ? t('overview.empty_search') : t('overview.empty_rows')) : t('logs.empty'))}</p>`;
  }
  const vis = rows.slice(0, 80);
  const hasRevCol = vis.some(r => String(r.revision || '').trim() !== '');
  const hasMohCol = vis.some(r => Boolean(r.moh_status));
  const hasLinksCol = vis.some(r => r.section === 'incoming' || r.section === 'outgoing' || (r.linked_letters && r.linked_letters.length) || r.related_letters);
  const hasAmtCol = vis.some(r => (r.amount_kwd ?? r.amount) != null && (r.amount_kwd ?? r.amount) !== '');
  const hasFileCol = vis.some(r => Boolean(r.file_rel));

  const rowsHtml = vis.map(r => {
    const cleanRel = r.file_rel ? String(r.file_rel).replace(/^\.\.\//, '') : '';
    const fArea = r.file_area || 'root';
    const areaQ = fArea === 'archive' ? '&area=archive' : '';
    const prevBtn = (cleanRel && r.is_previewable)
      ? `<button type="button" class="btn btn-sm" onclick="openInlineDocPreview({pid:${jsStr(pid)},rel:${jsStr(cleanRel)},area:${jsStr(fArea)},title:${jsStr(r.subject||r.ref_no||'')},refNo:${jsStr(r.ref_no||'')}})">👁 ${esc(t('doc_preview.btn'))}</button>`
      : '';
    const dl = cleanRel
      ? `<div style="display:flex;gap:4px;flex-wrap:wrap">${prevBtn}<a class="btn btn-sm" href="/api/projects/${encodeURIComponent(pid)}/download?rel=${encodeURIComponent(cleanRel)}${areaQ}">⬇ ${esc(t('common.open'))}</a></div>`
      : '—';
    const waitTip = (r.section === 'incoming' && r.unreplied && r.days_waiting != null)
      ? `<div class="sub" style="color:var(--amber);font-size:11px;margin-top:2px">⏳ ${esc(t('letters.days_waiting', { days: r.days_waiting }))}</div>` : '';
    return `<tr>
      <td class="ltr"><strong>${esc(r.ref_no || '—')}</strong></td>
      ${hasRevCol ? `<td>${esc(r.revision || '')}</td>` : ''}
      <td><span class="pill pill-gray">${esc(r.sheet || '')}</span></td>
      <td>${esc(r.subject || '')}</td>
      <td class="ltr">${esc(r.date || r.doc_date || '')}</td>
      <td>${statusPill(r.status)}${waitTip}</td>
      ${hasMohCol ? `<td>${statusPill(r.moh_status)}</td>` : ''}
      ${hasLinksCol ? `<td>${renderRelatedLinksCell(r, 'overview', '')}</td>` : ''}
      ${hasAmtCol ? `<td class="ltr">${(r.amount_kwd ?? r.amount) != null && (r.amount_kwd ?? r.amount) !== '' ? fmtKwd(r.amount_kwd ?? r.amount) : '—'}</td>` : ''}
      ${hasFileCol ? `<td>${dl}</td>` : ''}
    </tr>`;
  }).join('');

  return `<div class="tbl-wrap"><table class="dtbl">
    <thead><tr><th>${esc(t('table.col_ref'))}</th>${hasRevCol ? `<th>${esc(t('table.col_rev'))}</th>` : ''}<th>${esc(t('table.col_sheet'))}</th><th>${esc(t('table.col_subject'))}</th><th>${esc(t('table.col_date'))}</th><th>${esc(t('table.col_status'))}</th>${hasMohCol ? `<th>${esc(t('table.col_moh'))}</th>` : ''}${hasLinksCol ? `<th>${esc(t('table.col_related'))}</th>` : ''}${hasAmtCol ? `<th>${esc(t('table.col_amount'))}</th>` : ''}${hasFileCol ? `<th>${esc(t('table.col_file'))}</th>` : ''}</tr></thead>
    <tbody>${rowsHtml}</tbody></table></div>`;
}

function setOverviewSecFilter(secKey) {
  S.ovSecFilter = secKey || '';
  const d = S.projDetail;
  if (!d || !d.project || d.project.id !== S.pid) {
    renderOverviewView(document.getElementById('ovSearch')?.value || '');
    return;
  }
  const allRows = d.recent_rows || [];
  const filtered = S.ovSecFilter === '__unreplied__'
    ? allRows.filter(r => r.section === 'incoming' && r.unreplied)
    : (S.ovSecFilter ? allRows.filter(r => (r.section || '') === S.ovSecFilter) : allRows);
  const hasLog = (d.logs || []).length > 0;
  const query = document.getElementById('ovSearch')?.value || '';
  const bodyEl = document.getElementById('ovRowsBody');
  if (bodyEl) bodyEl.innerHTML = _buildOverviewTableHtml(filtered, d.project.id, hasLog, query);
  document.querySelectorAll('#ovSecPills .filter-pill').forEach(btn => {
    btn.classList.toggle('active', (btn.dataset.sec || '') === S.ovSecFilter);
  });
}

function _ovSyncTimer(job) {
  if (job && job.running) {
    if (!S.ovPollTimer) {
      S.ovPollTimer = setInterval(async () => {
        if (S.view !== 'overview' || !S.pid) {
          clearInterval(S.ovPollTimer);
          S.ovPollTimer = null;
          S.ovPollBusy = false;
          return;
        }
        if (S.ovPollBusy) return;
        S.ovPollBusy = true;
        try {
          const st = await api(`/api/projects/${encodeURIComponent(S.pid)}/scanner`);
          const j = st.job || { running: false };
          S.ovJob = j;
          updateGlobalActivityBar();
          _ensureLiveTick();
          const host = document.getElementById('ovJobHost');
          if (host) host.innerHTML = _renderUnifiedJobHtml('overview', j, { canStop: false });
          if (!j.running) {
            clearInterval(S.ovPollTimer);
            S.ovPollTimer = null;
            S.ovPollBusy = false;
            await refreshHub(true);
            await renderOverviewView(document.getElementById('ovSearch')?.value || '');
            if (j.phase === 'done') {
              const sum = j.summary || j.last_summary || {};
              const errs = sum.errors || [];
              if (errs.length) toast(t('overview.scan_errors_toast', { count: errs.length }), 'err');
              else toast(t('overview.scan_done_toast', { archived: sum.archived || 0, pending: sum.pending_decisions || 0 }));
            } else if (j.phase === 'error' && j.error) {
              toast(j.error, 'err');
            }
          }
        } catch (e) {
          const host = document.getElementById('ovJobHost');
          if (host) host.innerHTML = _renderUnifiedJobHtml('overview', { running: false, phase: 'error', error: e.message }, { canStop: false });
        } finally {
          S.ovPollBusy = false;
        }
      }, 850);
    }
  } else if (S.ovPollTimer) {
    clearInterval(S.ovPollTimer);
    S.ovPollTimer = null;
    S.ovPollBusy = false;
  }
}

async function uploadToInbox(fileList) {
  if (!fileList || !fileList.length) return;
  const filesArr = Array.from(fileList);
  const host = document.getElementById('ovJobHost');
  try {
    S.ovJob = { running: true, kind: 'inbox_sync', phase: 'uploading', processed: 0, total: filesArr.length, discovered: filesArr.length, started_ts: Date.now() / 1000 };
    if (host) host.innerHTML = _renderUnifiedJobHtml('overview', S.ovJob, { canStop: false });
    updateGlobalActivityBar();
    _ensureLiveTick();
    const files = [];
    for (let i = 0; i < filesArr.length; i++) {
      const f = filesArr[i];
      S.ovJob = { ...S.ovJob, processed: i, current_file: f.name };
      if (host) host.innerHTML = _renderUnifiedJobHtml('overview', S.ovJob, { canStop: false });
      files.push({ name: f.name, data_b64: await fileToBase64(f) });
    }
    const res = await api(`/api/projects/${encodeURIComponent(S.pid)}/upload`, { body: { target: 'inbox', files } });
    S.ovJob = { running: false, kind: 'inbox_sync', phase: 'done', elapsed_seconds: 0, summary: { archived: res.saved.length, pending_decisions: 0 } };
    if (host) host.innerHTML = _renderUnifiedJobHtml('overview', S.ovJob, { canStop: false, doneText: t('overview.files_uploaded_toast', { count: res.saved.length }) });
    toast(t('overview.files_uploaded_toast', { count: res.saved.length }));
    updateGlobalActivityBar();
    _ensureLiveTick();
  } catch (e) {
    S.ovJob = { running: false, kind: 'inbox_sync', phase: 'error', error: e.message };
    if (host) host.innerHTML = _renderUnifiedJobHtml('overview', S.ovJob, { canStop: false });
    updateGlobalActivityBar();
    toast(e.message, 'err');
  }
}

async function scanInboxNow(btnEl) {
  try {
    S.ovJob = { running: true, kind: 'inbox_sync', phase: 'scanning', started_ts: Date.now() / 1000 };
    const host = document.getElementById('ovJobHost');
    if (host) host.innerHTML = _renderUnifiedJobHtml('overview', S.ovJob, { canStop: false });
    updateGlobalActivityBar();
    _ensureLiveTick();
    const res = await withBusyButton(btnEl, () => api(`/api/projects/${encodeURIComponent(S.pid)}/organize`, { body: { blocking: false } }));
    if (res && res.job) S.ovJob = res.job;
    else {
      await refreshHub();
      await renderOverviewView();
      const sum = res.summary || res;
      S.ovJob = { running: false, kind: 'inbox_sync', phase: 'done', summary: sum };
    }
    _ovSyncTimer(S.ovJob);
    if (host) host.innerHTML = _renderUnifiedJobHtml('overview', S.ovJob, { canStop: false });
    updateGlobalActivityBar();
  } catch (e) {
    S.ovJob = { running: false, kind: 'inbox_sync', phase: 'error', error: e.message };
    const host = document.getElementById('ovJobHost');
    if (host) host.innerHTML = _renderUnifiedJobHtml('overview', S.ovJob, { canStop: false });
    updateGlobalActivityBar();
    toast(e.message, 'err');
  }
}

async function handleUploadProjectLog(fileList) {
  if (!fileList || !fileList.length) return;

function captureCurrentLogSheetEdits() {
  if (!S.logMapData || !S.logMapSheet) return;
  const sObj = (S.logMapData.sheets || []).find(s => s.sheet === S.logMapSheet);
  const enEl = document.getElementById('lm_enabled');
  if (!sObj || !enEl) return;
  sObj.layout = document.getElementById('lm_layout').value;
  sObj.enabled = sObj.layout === 'skip' ? false : enEl.checked;
  if (sObj.layout !== 'skip') {
    const hdrEl = document.getElementById('lm_hdr');
    const dsEl = document.getElementById('lm_dstart');
    if (hdrEl) sObj.header_row = Math.max(1, Number(hdrEl.value || 1));
    if (dsEl) sObj.data_start_row = Math.max(2, Number(dsEl.value || 2));
    const routesEl = document.getElementById('lm_routes');
    const routesVal = routesEl ? routesEl.value.trim() : '';
    if (routesVal) {
      const toks = routesVal.split(/[,\u060c\s]+/).map(x => x.trim()).filter(Boolean);
      const prev0 = (sObj.routes && sObj.routes[0] && typeof sObj.routes[0] === 'object') ? sObj.routes[0] : { section: 'submittal_mar', disciplines: [], subtypes: [], party_role: '' };
      const discs = toks.filter(x => /^[A-Za-z]{2,5}$/.test(x) && x.toUpperCase() === x);
      const secs = toks.filter(x => !discs.includes(x));
      sObj.routes = [{ ...prev0, section: secs[0] || prev0.section || 'submittal_mar', disciplines: discs.length ? discs : prev0.disciplines }];
    }
    const cols = {};
    for (const [role] of logColRoles()) {
      const sel = document.getElementById('lm_col_' + role);
      if (sel && sel.value) {
        const colNum = Number(sel.value);
        const prev = (sObj.columns || {})[role] || {};
        const optTxt = sel.options[sel.selectedIndex]?.dataset?.hdr || prev.header || role;
        cols[role] = { col: colNum, col_letter: colLetter(colNum), header: optTxt, is_formula: Boolean(prev.is_formula) };
      }
    }
    sObj.columns = cols;
  }
}

function onLogMapperLayoutChange(newLayout) {

  renderLogMapperContent(S.logMapPreview);
}

function onLogMapperEnabledChange(checked) {

}

function renderLogMapperContent(preview) {
  S.logMapPreview = preview;
  const lmap = S.logMapData;
  const shName = preview.active_sheet;
  let sObj = (lmap.sheets || []).find(s => s.sheet === shName);
  if (!sObj) {
    sObj = { sheet: shName, layout: 'flat', enabled: true, header_row: 1, data_start_row: 2, routes: [], columns: {}, rev_groups: [], formula_cols: [] };
    lmap.sheets.push(sObj);
  }
  const isSkip = sObj.layout === 'skip';
  const tabs = (preview.sheets || []).map(sn => {
    const meta = (lmap.sheets || []).find(x => x.sheet === sn);
    const dot = meta && meta.enabled && meta.layout !== 'skip' ? '🟢' : '⚪';
    return `<button class="sheet-tab ${sn===shName?'active':''}" onclick="switchLogMapperSheet(${jsStr(sn)})">${dot} ${esc(sn)}</button>`;
  }).join('');

  const hdrRowObj = (preview.rows || []).find(r => r.row === Number(sObj.header_row)) || (preview.rows || [])[0] || { cells: [] };
  const colLetters = preview.col_letters || [];

  const coreSet = new Set(['ref_no', 'subject', 'doc_date', 'status', 'file_link']);
  const allRoles = logColRoles();
  const buildSelector = ([role, lbl]) => {
    const cur = (sObj.columns && sObj.columns[role] && sObj.columns[role].col) || 0;
    let opts = `<option value="">— ${esc(t('log_mapper.auto_col'))} —</option>`;
    colLetters.forEach((cl, idx) => {
      const cNum = idx + 1;
      const hTxt = (hdrRowObj.cells && hdrRowObj.cells[idx]) || '';
      const isF = (sObj.formula_cols || []).includes(cNum);
      opts += `<option value="${cNum}" data-hdr="${esc(hTxt)}" ${cur===cNum?'selected':''}>${cl} ${hTxt ? '— ' + esc(hTxt.slice(0,28)) : ''}${isF?' [ƒx]':''}</option>`;
    });
    return `<div class="fg"><label>${esc(lbl)}</label><select id="lm_col_${role}">${opts}</select></div>`;
  };
  const coreSelectors = allRoles.filter(r => coreSet.has(r[0])).map(buildSelector).join('');
  const extraRoles = allRoles.filter(r => !coreSet.has(r[0]));
  const extraSelectors = extraRoles.map(buildSelector).join('');
  const mappedCount = Object.keys(sObj.columns || {}).length;

  const colBadgeByNum = {};
  for (const [role, lbl] of allRoles) {
    const cm = (sObj.columns || {})[role];
    if (cm && cm.col) colBadgeByNum[Number(cm.col)] = lbl;
  }

  const revInfo = (!isSkip && (sObj.rev_groups || []).length)
    ? `<div class="alert alert-green" style="padding:7px 10px;font-size:12px">✅ ${esc(t('log_mapper.multirev_detected', { count: sObj.rev_groups.length }))}</div>` : '';
  const fInfo = (!isSkip && (sObj.formula_cols || []).length)
    ? `<div class="sub" style="margin-bottom:8px">🔒 ${esc(t('log_mapper.formula_cols'))}: <strong>${sObj.formula_cols.map(colLetter).join(', ')}</strong></div>` : '';

  const routeStr = (sObj.routes || []).map(rt => {
    if (typeof rt === 'string') return rt;
    return [rt.section, ...(rt.disciplines || []), ...(rt.subtypes || [])].filter(Boolean).join(', ');
  }).join(', ');

  const prevRows = (preview.rows || []).slice(0, 45).map(r => {
    const bg = r.row === sObj.header_row ? 'background:#dbeafe;font-weight:700' : (r.row === sObj.data_start_row ? 'background:#dcfce7' : '');
    return `<tr style="${bg}"><td class="ltr" style="font-weight:700;background:#f1f5f9">${r.row}</td>${r.cells.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`;
  }).join('');

  const mappingSectionHtml = isSkip
    ? `<div class="alert alert-amber">ℹ️ ${esc(t('log_mapper.skip_notice'))}</div>`
    : `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px">
         <h4 style="margin:0">${esc(t('log_mapper.core_cols_title'))}</h4>
         <span class="pill pill-teal">${esc(t('log_mapper.auto_summary', { count: mappedCount }))}</span>
       </div>
       <div class="form-grid" style="margin-bottom:10px">${coreSelectors}</div>
       <details style="margin-bottom:12px;border:1px solid var(--border);border-radius:8px;padding:8px 10px">
         <summary style="cursor:pointer;font-weight:700;font-size:12.5px">➕ ${esc(t('log_mapper.extra_cols_title', { count: extraRoles.length }))}</summary>
         <div class="form-grid" style="margin-top:10px">${extraSelectors}</div>
       </details>`;

  openModal(
    `🧭 ${esc(t('log_mapper.title'))} — <span class="ltr">${esc(S.logMapName)}</span>`,
    `<div class="sheet-tabs" style="border-radius:8px;margin-bottom:12px">${tabs}</div>
     ${revInfo}${fInfo}
     <div class="form-grid" style="margin-bottom:12px;background:var(--surface-2);padding:10px;border-radius:8px;border:1px solid var(--border)">
       <div class="fg"><label style="display:flex;align-items:center;gap:6px;margin-top:18px"><input type="checkbox" id="lm_enabled" ${sObj.enabled && !isSkip?'checked':''} onchange="onLogMapperEnabledChange(this.checked)"> ${esc(t('log_mapper.sheet_enabled'))}</label></div>
       <div class="fg"><label>${esc(t('log_mapper.layout'))}</label>
         <select id="lm_layout" onchange="onLogMapperLayoutChange(this.value)">
           <option value="flat" ${sObj.layout==='flat'?'selected':''}>${esc(t('log_mapper.layout_standard'))}</option>
           <option value="multi_rev" ${sObj.layout==='multi_rev'?'selected':''}>${esc(t('log_mapper.layout_multirev'))}</option>
           <option value="skip" ${sObj.layout==='skip'?'selected':''}>${esc(t('log_mapper.layout_skip'))}</option>
         </select>
       </div>
       ${!isSkip ? `
         <div class="fg"><label>${esc(t('log_mapper.header_row'))}</label><input type="number" id="lm_hdr" value="${sObj.header_row||1}" min="1"></div>
         <div class="fg"><label>${esc(t('log_mapper.data_row'))}</label><input type="number" id="lm_dstart" value="${sObj.data_start_row||2}" min="2"></div>
         <div class="fg" style="grid-column:1/-1"><label>${esc(t('log_mapper.routes'))}</label>
           <input id="lm_routes" class="ltr" value="${esc(routeStr)}">
           <span class="hint">${esc(t('log_mapper.routes_help'))}</span>
         </div>` : ''}
     </div>
     ${mappingSectionHtml}
     <div id="logMapperViewer" class="${S.logMapFullscreen ? 'doc-viewer-fs' : ''}" style="border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;background:#f8fafc">
       <div class="doc-viewer-bar">
         <strong style="font-size:13px">📊 ${esc(t('log_mapper.preview_title'))} — ${esc(shName)}</strong>
         ${S.logMapFullscreen ? `<div style="display:flex;gap:4px;flex-wrap:wrap">${tabs}</div>` : ''}
         <div class="doc-viewer-controls">
           <button class="btn btn-sm" type="button" onclick="stepDocViewerZoom('logmap', -15)" title="${esc(t('viewer.zoom_out_title'))}">🔍−</button>
           <button class="btn btn-sm" type="button" id="logMapZoomLbl" onclick="stepDocViewerZoom('logmap', 0)" title="${esc(t('viewer.zoom_reset_title'))}">${S.logMapZoom || 100}%</button>
           <button class="btn btn-sm" type="button" onclick="stepDocViewerZoom('logmap', 15)" title="${esc(t('viewer.zoom_in_title'))}">🔍+</button>
           <button class="btn btn-primary btn-sm" type="button" id="logMapFsBtn" onclick="toggleDocViewerFullscreen('logMapperViewer','logMapFsBtn')">
             ${S.logMapFullscreen ? `🗗 ${esc(t('viewer.collapse_btn'))}` : `⛶ ${esc(t('viewer.expand_btn'))}`}
           </button>
         </div>
       </div>
       <div id="logMapperScroll" class="tbl-wrap doc-viewer-scroll" style="max-height:280px;border:none;border-radius:0"><table class="dtbl" style="font-size:${Math.round(12.5 * ((S.logMapZoom || 100) / 100) * 10) / 10}px">
         <thead><tr><th>#</th>${colLetters.map((c, idx) => {
           const lbl = colBadgeByNum[idx + 1];
           return `<th class="ltr">${c}${lbl ? `<br><span class="col-mapped-badge">${esc(lbl)}</span>` : ''}</th>`;
         }).join('')}</tr></thead>
         <tbody>${prevRows || `<tr><td colspan="99" class="sub">${esc(t('log_mapper.empty_sheet'))}</td></tr>`}</tbody>
       </table></div>
     </div>`,
    `<button class="btn" onclick="closeModal()">${esc(t('common.back'))}</button>
     <button class="btn btn-primary" onclick="saveLogMapper(this)">💾 ${esc(t('log_mapper.save_btn'))}</button>`,
    true
  );
}

      ${secReplyPills}
