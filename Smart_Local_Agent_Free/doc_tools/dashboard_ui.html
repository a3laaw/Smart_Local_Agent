<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#059BE5">
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/manifest.webmanifest">
<title>Smart Projects Hub</title>
<style>
:root {
  --bg: #f6f8fb;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --text: #0f172a;
  --text-muted: #475569;
  --text-soft: #64748b;
  --muted: #64748b;
  --brand-amber: #FFA611;
  --brand-orange: #F6820D;
  --brand-gold: #FFCB2B;
  --brand-blue: #059BE5;
  --brand-coral: #FF8964;
  --primary: #059BE5;
  --primary-btn: #0377B5;
  --primary-hover: #035D89;
  --primary-soft: #e0f4fd;
  --accent: #F6820D;
  --accent-hover: #944E08;
  --accent-soft: #fff2e0;
  --blue: #0377B5;
  --blue-soft: #e0f4fd;
  --amber: #944E08;
  --amber-soft: #fff4d8;
  --red: #b91c1c;
  --red-soft: #fee2e2;
  --coral: #FF8964;
  --coral-soft: #ffebe4;
  --coral-dark: #99523C;
  --purple: #6d28d9;
  --purple-soft: #ede9fe;
  --green: #15803d;
  --green-soft: #dcfce7;
  --teal: #059BE5;
  --navy: #04283d;
  --radius: 10px;
  --topbar-h: 54px;
  --shadow-sm: 0 1px 2px rgba(4,40,61,.06);
  --shadow: 0 1px 3px rgba(4,40,61,.08), 0 1px 2px rgba(4,40,61,.04);
  --shadow-lg: 0 12px 32px rgba(4,40,61,.18);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif; font-size: 14px; line-height: 1.5; }
button, input, select, textarea { font-family: inherit; font-size: 13px; }
button { cursor: pointer; }
a { color: var(--primary-hover); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Global Top Banner */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: linear-gradient(125deg, #035D89 0%, #0377B5 54%, #059BE5 100%);
  border-bottom: 4px solid transparent;
  border-image: linear-gradient(90deg, #FFA611 0%, #F6820D 34%, #FFCB2B 68%, #FF8964 100%) 1;
  color: #fff; padding: 8px 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  box-shadow: 0 3px 14px rgba(3,93,137,.28);
}
.topbar-main { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.brand { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 14.5px; white-space: nowrap; }
.brand-ver { background: #FFCB2B; color: #3b2300; border: 1px solid #FFA611; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 800; }
.active-switcher {
  display: flex; align-items: center; gap: 6px;
  background: rgba(3,52,82,.38); border: 1px solid rgba(255,203,43,.55);
  padding: 4px 8px; border-radius: 8px; min-width: 0;
}
.active-switcher label { font-size: 11.5px; color: #FFCB2B; white-space: nowrap; font-weight: 700; }
.active-switcher select {
  background: #034569; color: #fff; border: 1px solid rgba(255,166,17,.65);
  border-radius: 6px; padding: 3px 7px; min-width: 155px; max-width: 230px; font-weight: 600; font-size: 12.5px;
}
.topbar-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tbtn {
  border: 1px solid rgba(255,255,255,.32); background: rgba(3,52,82,.36);
  color: #fff; padding: 5px 10px; border-radius: 7px; font-weight: 600; font-size: 12px;
  display: inline-flex; align-items: center; gap: 5px; transition: .15s;
  white-space: nowrap; flex-shrink: 0; line-height: 1.35;
}
.tbtn:hover { background: rgba(3,52,82,.56); }
.tbtn.start { background: #FFCB2B; border-color: #FFA611; color: #3b2300; font-weight: 700; }
.tbtn.start:hover { background: #ffe066; }
.tbtn.end { background: #FFA611; border-color: #F6820D; color: #3b1c00; font-weight: 700; }
.tbtn.end:hover { background: #F6820D; color: #fff; }
.tbtn.watch-on { background: #ffffff; border-color: #FFCB2B; color: #035D89; box-shadow: 0 0 0 2px rgba(255,203,43,.35); font-weight: 700; }
.tbtn.app-btn { background: rgba(255,166,17,.24); border-color: #FFA611; color: #fff; }
.tbtn.app-btn:hover { background: rgba(255,166,17,.40); }
.tbtn.danger-soft { background: rgba(255,137,100,.28); border-color: #FF8964; color: #fff; }
.tbtn.danger-soft:hover { background: #FF8964; color: #3b1003; }
.badge-count {
  background: #FF8964; color: #3b1003; border: 1px solid rgba(255,255,255,.75); border-radius: 99px;
  padding: 1px 6px; font-size: 10.5px; font-weight: 800;
}
.device-pill { font-size: 11px; color: #e0f4fd; background: rgba(3,45,72,.45); border: 1px solid rgba(255,255,255,.18); padding: 4px 8px; border-radius: 6px; direction: ltr; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dryrun-pill { background: #FF8964; color: #3b1003; padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 800; white-space: nowrap; }
.ai-pill { background: rgba(3,52,82,.36); color: #e0f4fd; border: 1px solid rgba(255,255,255,.24); padding: 4px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.ai-pill.on { background: #fff4d8; color: #944E08; border: 1px solid #FFA611; font-weight: 700; }

/* Global Warning Strip */
.warn-strip { background: #fff6df; border-bottom: 1px solid #FFCB2B; padding: 7px 16px; display: none; flex-direction: column; gap: 4px; font-size: 12.5px; color: #944E08; }
.warn-strip.show { display: flex; }
.warn-item { display: flex; align-items: center; gap: 8px; }

/* App Shell */
.shell { display: grid; grid-template-columns: 245px minmax(0, 1fr); min-height: calc(100vh - var(--topbar-h)); transition: grid-template-columns .18s ease; }
.shell.sb-collapsed { grid-template-columns: 58px minmax(0, 1fr); }
.sidebar {
  background: var(--surface); border-left: 1px solid var(--border);
  padding: 10px; display: flex; flex-direction: column; gap: 4px;
  overflow-y: auto; max-height: calc(100vh - var(--topbar-h)); position: sticky; top: var(--topbar-h);
}
.sidebar-toggle-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  padding-bottom: 7px; margin-bottom: 4px; border-bottom: 1px solid var(--border);
}
.sidebar-collapse-btn {
  width: 100%; border: 1px solid var(--border-strong); background: var(--surface-2);
  color: var(--primary-hover); border-radius: 7px; padding: 5px 9px;
  font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: .15s;
}
.sidebar-collapse-btn:hover { background: var(--primary-soft); border-color: var(--primary); }
.nav-group-title {
  font-size: 11px; font-weight: 700; color: var(--text-soft);
  padding: 6px 8px 3px; text-transform: uppercase; letter-spacing: .3px;
}
.nav-group-hdr {
  display: flex; align-items: center; justify-content: space-between; gap: 4px;
  margin-top: 8px; padding: 5px 8px; border-radius: 7px;
  font-size: 11.5px; font-weight: 700; color: var(--text-soft);
  transition: background .12s, color .12s; user-select: none;
}
.nav-group-hdr:hover { background: var(--surface-2); color: var(--primary-hover); }
.nav-group-hdr.is-active-grp { color: var(--amber); background: #fff8eb; }
.nav-group-toggle {
  flex: 1; min-width: 0; border: none; background: transparent; padding: 0;
  color: inherit; font: inherit; text-align: right;
  display: flex; align-items: center; justify-content: space-between; gap: 5px;
}
.nav-group-meta { display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; }
.nav-grp-cnt { font-size: 10.5px; background: var(--bg); color: var(--text-muted); padding: 0 6px; border-radius: 99px; font-weight: 700; }
.nav-chev { font-size: 11px; color: var(--text-soft); line-height: 1; }
.nav-group-body { display: flex; flex-direction: column; gap: 3px; }
.nav-group-body.is-collapsed { display: none; }
.nav-group-sep { display: none; width: 28px; height: 1px; background: var(--border); margin: 4px auto; }
.sb-mini-sections { display: none; }
.nav-btn {
  width: 100%; text-align: right; border: none; background: transparent;
  padding: 8px 10px; border-radius: 8px; color: var(--text); font-weight: 600;
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
}
.nav-ic-wrap { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.nav-ic { flex-shrink: 0; line-height: 1; }
.nav-lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-btn:hover { background: var(--surface-2); }
.nav-btn.active { background: linear-gradient(90deg, #fff5df 0%, #ffebd1 100%); color: #944E08; border-right: 3.5px solid #F6820D; }
.nav-btn.sec-btn { font-size: 12.5px; font-weight: 500; padding: 6px 10px; }
.nav-pill { font-size: 11px; padding: 1px 6px; border-radius: 99px; background: var(--bg); color: var(--text-muted); font-weight: 700; flex-shrink: 0; }
.nav-pill.red { background: var(--red-soft); color: var(--red); }
.nav-pill.amber { background: var(--amber-soft); color: var(--amber); }
.sidebar-footer { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }

.sidebar.is-collapsed { padding: 10px 6px; align-items: center; }
.sidebar.is-collapsed .sidebar-toggle-bar { width: 100%; justify-content: center; }
.sidebar.is-collapsed .sidebar-collapse-btn { width: 42px; height: 34px; padding: 0; }
.sidebar.is-collapsed .sb-lbl,
.sidebar.is-collapsed .nav-lbl,
.sidebar.is-collapsed .nav-group-title,
.sidebar.is-collapsed .nav-group-hdr { display: none; }
.sidebar.is-collapsed .nav-group-sep { display: block; }
.sidebar.is-collapsed .nav-group-body { display: flex; align-items: center; width: 100%; }
.sidebar.is-collapsed .nav-group-body.is-collapsed { display: flex; }
.sidebar.is-collapsed .nav-group-body .sec-btn { display: none; }
.sidebar.is-collapsed .sb-mini-sections { display: flex; }
.sidebar.is-collapsed .nav-btn {
  width: 42px; height: 38px; padding: 0; justify-content: center; position: relative; border-radius: 9px;
}
.sidebar.is-collapsed .nav-ic { font-size: 17px; }
.sidebar.is-collapsed .nav-btn.active { border-right: none; box-shadow: inset 0 0 0 2px #F6820D; }
.sidebar.is-collapsed .nav-btn .nav-pill {
  position: absolute; top: -4px; left: -4px; font-size: 9.5px; padding: 0 4px;
  min-width: 16px; text-align: center; line-height: 15px; border: 1px solid #fff;
}
.sidebar.is-collapsed .sidebar-footer { width: 100%; align-items: center; }

.main { padding: 18px 20px; min-width: 0; overflow-x: hidden; }

/* Cards, Buttons, Badges, Forms */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
.card-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.card-title { margin: 0; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.sub, .tip { color: var(--text-muted); font-size: 12.5px; margin: 2px 0 0; }

.btn {
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
  padding: 7px 13px; border-radius: 8px; font-weight: 600; display: inline-flex;
  align-items: center; justify-content: center; gap: 6px; transition: .15s;
  white-space: nowrap; flex-shrink: 0; line-height: 1.35;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: linear-gradient(180deg, #059BE5 0%, #0377B5 100%); border-color: #0377B5; color: #fff; }
.btn-primary:hover { background: #035D89; border-color: #035D89; }
.btn-blue { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; }
.btn-blue:hover { background: #044668; }
.btn-amber { background: var(--amber-soft); border-color: #FFA611; color: var(--amber); }
.btn-danger { background: var(--red-soft); border-color: #fca5a5; color: var(--red); }
.btn-sm { padding: 4px 9px; font-size: 12px; border-radius: 6px; }
.actions-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.action-sep { margin-right: auto; display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.toolbar-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.toolbar-sub {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 8px 10px; border-radius: 8px; background: var(--surface-2);
  border: 1px solid var(--border); margin-bottom: 10px;
}
.toolbar-lbl { font-size: 11.5px; font-weight: 700; color: var(--text-soft); margin-left: 4px; white-space: nowrap; }
.proj-actions-wrap { margin-top: auto; padding-top: 6px; display: flex; flex-direction: column; gap: 7px; }
.proj-actions-main { display: flex; gap: 6px; flex-wrap: wrap; }
.proj-actions-sub {
  display: flex; gap: 5px; flex-wrap: wrap; align-items: center; justify-content: space-between;
  padding-top: 7px; border-top: 1px dashed var(--border);
}
.ov-tools-tray { display: none; flex-direction: column; gap: 8px; padding-top: 10px; margin-top: 10px; border-top: 1px dashed var(--border); }
.ov-tools-tray.open { display: flex; }
.ov-tools-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

.pill, .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.pill-green, .b-green { background: var(--green-soft); color: var(--green); }
.pill-amber, .b-amber { background: var(--amber-soft); color: var(--amber); }
.pill-red, .b-red { background: var(--red-soft); color: var(--red); }
.pill-blue, .b-blue { background: var(--blue-soft); color: var(--primary-hover); }
.pill-purple { background: var(--purple-soft); color: var(--purple); }
.pill-gray, .b-gray { background: #e2e8f0; color: #334155; }
.pill-teal, .b-teal { background: var(--coral-soft); color: var(--coral-dark); }

.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--brand-blue); border-radius: var(--radius); padding: 12px 14px; }
.kpi .k-lbl { font-size: 12px; color: var(--text-soft); }
.kpi .k-val { font-size: 22px; font-weight: 800; margin-top: 3px; }
.empty { text-align: center; padding: 24px 16px; color: var(--text-soft); font-size: 13px; }
.search-in, .ctrl-in { border: 1px solid var(--border-strong); border-radius: 7px; padding: 6px 10px; background: #fff; color: var(--text); }
.search-in:focus, .ctrl-in:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
.filter-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.filter-pill { border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text-muted); padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; transition: .15s; }
.filter-pill:hover { background: #e2e8f0; color: var(--text); }
.filter-pill.active { background: var(--primary-btn); border-color: var(--primary); color: #fff; }

.proj-card { background: var(--surface); border: 2px solid var(--border); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
.proj-card.is-clickable { cursor: pointer; transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
.proj-card.is-clickable:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(4,40,61,.11); border-color: var(--primary); }
.proj-card.is-clickable:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.proj-card.is-active { border-color: var(--brand-orange); background: linear-gradient(180deg, #fff6e5 0%, #ffffff 68px); }
.proj-card.is-disabled { opacity: 0.72; border-style: dashed; background: #f8fafc; }

.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 11px; }
.fg { display: flex; flex-direction: column; gap: 4px; }
.fg label { font-size: 12.5px; font-weight: 600; color: var(--text); }
.fg input, .fg select, .fg textarea {
  border: 1px solid var(--border-strong); border-radius: 7px; padding: 7px 9px;
  background: #fff; color: var(--text); width: 100%;
}
.fg input[type="checkbox"], .fg input[type="radio"] { width: auto; padding: 0; margin: 0; flex-shrink: 0; }
.fg input:focus, .fg select:focus, .fg textarea:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
.fg .err-msg { color: var(--red); font-size: 11.5px; font-weight: 600; }
.fg .hint { color: var(--text-soft); font-size: 11.5px; }
.ltr { direction: ltr; text-align: left; }

/* Upload Dropzone */
.dropzone {
  border: 2px dashed #94a3b8; border-radius: 10px; padding: 20px;
  text-align: center; background: var(--surface-2); transition: .15s; cursor: pointer;
}
.dropzone:hover, .dropzone.drag { border-color: var(--primary); background: #ebf8ff; }

/* Data Tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
.tbl-wrap > table, table.dtbl { width: 100%; border-collapse: collapse; font-size: 12.5px; background: #fff; }
.tbl-wrap > table th, table.dtbl th { background: #f8fafc; color: var(--text-muted); font-weight: 700; text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl-wrap > table td, table.dtbl td { padding: 7px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
.tbl-wrap > table tr:hover td, table.dtbl tr:hover td { background: #f8fafc; }
.tbl-wrap select, .tbl-wrap input:not([type="checkbox"]):not([type="radio"]) { border: 1px solid var(--border-strong); border-radius: 6px; padding: 4px 7px; background: #fff; color: var(--text); }
.card select:not(.ctrl-in):not([class*="xl-"]),
.card input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="hidden"]):not(.search-in):not(.ctrl-in),
.modal-body select:not(.ctrl-in),
.modal-body input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="hidden"]):not(.search-in):not(.ctrl-in) {
  border: 1px solid var(--border-strong); border-radius: 7px; padding: 6px 9px; background: #fff; color: var(--text);
}

/* Tabs */
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin-bottom: 12px; flex-wrap: wrap; }
.tab-btn {
  border: none; background: transparent; padding: 8px 13px; font-weight: 700;
  color: var(--text-muted); border-bottom: 3px solid transparent; margin-bottom: -1px;
}
.tab-btn.active { color: var(--primary-hover); border-bottom-color: var(--brand-orange); }

/* Alerts & Banners */
.alert { padding: 10px 13px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; border: 1px solid transparent; }
.alert-red { background: var(--red-soft); border-color: #fca5a5; color: #7f1d1d; }
.alert-amber { background: var(--amber-soft); border-color: #FFCB2B; color: #78350f; }
.alert-green { background: var(--green-soft); border-color: #86efac; color: #14532d; }
.alert-blue { background: var(--blue-soft); border-color: #7dd3fc; color: #035D89; }
.banner { display: flex; align-items: flex-start; gap: 8px; padding: 10px 13px; border-radius: 8px; font-size: 13px; border: 1px solid transparent; }
.banner.warn { background: var(--amber-soft); border-color: #FFCB2B; color: #78350f; }
.banner.err { background: var(--red-soft); border-color: #fca5a5; color: #7f1d1d; }

/* Visual Template Studio Split View */
.studio-bar {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px 12px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
}
.studio-bar-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.studio-bar-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.studio-split {
  display: grid; grid-template-columns: minmax(0, 1.55fr) 390px; gap: 12px;
  align-items: start;
}
.studio-canvas-card {
  background: #e2e8f0; border: 1px solid var(--border-strong); border-radius: var(--radius);
  overflow: hidden; display: flex; flex-direction: column; max-height: 76vh;
}
.doc-viewer-fs {
  position: fixed !important; inset: 10px !important; z-index: 950 !important;
  max-height: none !important; height: calc(100vh - 20px) !important; width: calc(100vw - 20px) !important;
  margin: 0 !important; background: #e2e8f0 !important; border: 2px solid var(--primary) !important;
  border-radius: 12px !important; box-shadow: 0 24px 60px rgba(15,23,42,.45) !important;
  display: flex !important; flex-direction: column !important; overflow: hidden !important;
}
.doc-viewer-fs .canvas-scroll,
.doc-viewer-fs .doc-viewer-scroll {
  flex: 1 !important; max-height: none !important; overflow: auto !important;
}
.doc-viewer-bar {

/* Faithful Excel Grid */
.xl-stage { position: relative; display: inline-block; background: #fff; box-shadow: 0 4px 16px rgba(15,23,42,.14); transform-origin: top right; }
table.xl-grid { border-collapse: collapse; table-layout: fixed; background: #fff; }
table.xl-grid th.xl-col-hdr, table.xl-grid th.xl-row-hdr, table.xl-grid th.xl-corner {

  border: 1px solid #cbd5e1; text-align: center; padding: 2px 4px; user-select: none;
}
table.xl-grid td.xl-cell {
  border: 1px solid #e2e8f0; padding: 2px 5px; font-size: 12px; position: relative;
  cursor: cell; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
table.xl-grid td.xl-cell.wrap { white-space: pre-wrap; word-break: break-word; }
table.xl-grid td.xl-cell:hover { outline: 2px solid #059BE5; outline-offset: -2px; z-index: 2; }
table.xl-grid td.xl-cell.sel { outline: 2.5px solid #059BE5 !important; outline-offset: -2px; background-image: linear-gradient(rgba(5,155,229,.12), rgba(5,155,229,.12)); z-index: 3; }
table.xl-grid td.xl-cell.in-range { background-image: linear-gradient(rgba(246,130,13,.13), rgba(246,130,13,.13)); outline: 1px dashed #F6820D; outline-offset: -1px; }
table.xl-grid td.xl-cell.filled-hl { box-shadow: inset 0 0 0 2px #16a34a; background-image: linear-gradient(rgba(22,163,74,.10), rgba(22,163,74,.10)); }
.cell-tag {
  position: absolute; top: 1px; left: 1px; font-size: 9.5px; font-weight: 700;
  padding: 0 4px; border-radius: 3px; line-height: 1.35; pointer-events: none; max-width: 92%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tag-manual { background: #0377B5; color: #fff; }
.tag-auto_date { background: #059BE5; color: #032436; font-weight: 800; }
.tag-auto_counter { background: #7c3aed; color: #fff; }
.tag-auto_project { background: #035D89; color: #fff; }
.tag-auto_system { background: #7c3aed; color: #fff; }
.tag-fixed { background: #64748b; color: #fff; }
.tag-formula { background: #dc2626; color: #fff; }
.tag-table { background: #F6820D; color: #3a1900; font-weight: 800; }
.tag-sugg { background: #fff3c4; color: #805200; border: 1px dashed #FFA611; }
.xl-img-overlay { pointer-events: none; position: absolute; z-index: 1; opacity: .95; border-radius: 2px; }
.path-row { display: flex; gap: 6px; align-items: stretch; }
.path-row input { flex: 1; min-width: 0; }
.scanner-card {
  background: var(--surface); border: 1px solid var(--border); border-right: 4px solid var(--brand-blue);
  border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(4,40,61,.04);
}
.scanner-card-multipage {

}
.kpi-clickable { cursor: pointer; transition: transform .12s ease, border-color .12s ease; }
.kpi-clickable:hover { border-color: var(--primary); transform: translateY(-1px); }
.split-thumbs-strip {

  border: 1px solid var(--border); border-radius: 8px; margin: 10px 0;
}
.split-thumb-card {
  flex: 0 0 108px; border: 2px solid var(--border); border-radius: 7px; background: #fff;
  padding: 5px; cursor: pointer; text-align: center; transition: border-color .12s;
}
.split-thumb-card:hover { border-color: var(--primary); }
.split-thumb-card img { width: 100%; height: 126px; object-fit: contain; display: block; background: #f8fafc; border-radius: 4px; }
.split-range-card {

}
.scanner-summary-box {

}
.col-mapped-badge {
  display: inline-block; background: var(--primary-btn); color: #fff; font-size: 10px;
  padding: 1px 5px; border-radius: 4px; margin-top: 2px; font-weight: 700;
}

/* Faithful Word A4 Canvas */
.docx-a4 {
  width: 794px; min-height: 980px; margin: 0 auto; background: #fff;

}
.docx-hdr { border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; margin-bottom: 14px; }
.docx-ftr { border-top: 1px dashed #cbd5e1; padding-top: 10px; margin-top: 20px; font-size: 11.5px; color: #475569; }
.docx-para { margin: 4px 0; padding: 3px 5px; border-radius: 4px; position: relative; cursor: pointer; min-height: 18px; }
.docx-para:hover { outline: 1.5px dashed #059BE5; }
.docx-para.sel { outline: 2px solid #059BE5; background: rgba(5,155,229,.08); }
.docx-para.filled-hl, td.docx-cell.filled-hl { background: rgba(22,163,74,.11) !important; outline: 2px solid #16a34a; }
.docx-span-chip { background: #fff3c4; border: 1px dashed #FFA611; border-radius: 3px; padding: 0 4px; cursor: pointer; font-weight: 600; }
.docx-span-chip:hover, .docx-span-chip.sel { background: #ffe494; outline: 2px solid #F6820D; }
table.docx-tbl { width: 100%; border-collapse: collapse; margin: 8px 0; }
td.docx-cell { padding: 5px 7px; position: relative; cursor: pointer; vertical-align: top; }
td.docx-cell:hover { outline: 2px solid #059BE5; outline-offset: -2px; }
td.docx-cell.sel { outline: 2.5px solid #059BE5 !important; outline-offset: -2px; background-image: linear-gradient(rgba(5,155,229,.10), rgba(5,155,229,.10)); }
.docx-page-img { display: block; max-width: 100%; margin: 0 auto 14px; box-shadow: 0 4px 16px rgba(0,0,0,.18); background: #fff; }

.studio-inspector {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px; max-height: 76vh; overflow-y: auto; position: sticky; top: calc(var(--topbar-h) + 10px);
}

/* Decisions Side-by-Side Preview */
.decisions-split {
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(360px, 0.95fr);
  gap: 14px;
  align-items: start;
}
.decisions-list { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.decision-card {
  background: var(--surface); border: 1.5px solid var(--border);
  border-right: 4px solid #FFA611; border-radius: var(--radius);
  padding: 13px; box-shadow: var(--shadow); cursor: pointer;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
.decision-card:hover { border-color: var(--border-strong); }
.decision-card.selected {
  border-color: var(--primary);

.decision-card-body {

  align-items: start;
}
.decision-mini-thumb {

  cursor: zoom-in; position: relative; flex-shrink: 0;
}
.decision-mini-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; background: #fff; }
.decision-mini-fb {

  gap: 4px; color: var(--text-soft); font-size: 11px; text-align: center; padding: 6px;
}
.decisions-preview-pane {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  position: sticky; top: 64px;
  display: flex; flex-direction: column;
  max-height: calc(100vh - 82px);
}
.preview-pane-head {
  padding: 10px 12px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap;
  background: var(--surface-2); border-radius: var(--radius) var(--radius) 0 0;
}
.preview-pane-stage {
  flex: 1; overflow: auto; background: #cbd5e1;

  min-height: 440px; border-radius: 0 0 var(--radius) var(--radius);
}
.preview-pane-stage img {
  background: #fff; border-radius: 4px;
  box-shadow: 0 6px 20px rgba(15,23,42,.24);

}
.scanner-card-row {
  display: grid; grid-template-columns: minmax(0, 1fr) 114px; gap: 12px; align-items: start;
}
@media (max-width: 1140px) {
  .decisions-split { grid-template-columns: 1fr; }
  .decisions-preview-pane { position: static; max-height: 75vh; }
}
@media (max-width: 680px) {
  .decision-card-body, .scanner-card-row { grid-template-columns: 1fr; }
}

/* Live Organizer Progress Counters */
.org-prog-card {
  margin-top: 12px; padding: 13px 15px; border-radius: 10px;
  background: linear-gradient(180deg, #ebf8ff 0%, #fffaf2 100%);
  border: 1.5px solid #059BE5; box-shadow: var(--shadow);
}
.org-pulse-dot {
  display: inline-block; width: 9px; height: 9px; border-radius: 50%;
  background: #F6820D; margin-left: 6px; vertical-align: middle;
  animation: orgPulse 1.2s ease-in-out infinite;
}
@keyframes orgPulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.35); opacity: .45; }
}
.org-bar-track {
  margin-top: 9px; background: #e0f4fd; border-radius: 99px; height: 10px;
  overflow: hidden; position: relative;
}
.org-bar-fill {
  background: linear-gradient(90deg, #059BE5, #FFA611, #F6820D); height: 100%;
  border-radius: 99px; transition: width .25s ease;
}
.org-bar-indet {
  position: absolute; top: 0; bottom: 0; width: 38%; border-radius: 99px;
  background: linear-gradient(90deg, #059BE5, #FFA611, #F6820D);
  animation: orgIndet 1.4s ease-in-out infinite;
}
@keyframes orgIndet {
  0% { right: -38%; }
  100% { right: 100%; }
}
.org-kpis {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(125px, 1fr));
  gap: 8px; margin-top: 10px;
}
.org-kpi {
  background: #fff; border: 1px solid var(--border); border-radius: 8px;
  padding: 7px 10px;
}
.org-kpi .ok-lbl { font-size: 11px; color: var(--text-soft); }
.org-kpi .ok-val { font-size: 16px; font-weight: 800; color: var(--text); margin-top: 1px; }
.org-cur-line {

}
.org-cur-file {
  font-family: ui-monospace, Consolas, monospace; font-size: 11.5px;
  color: var(--primary); background: #fff; border: 1px solid var(--border);

  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.org-prog-card.is-done {
  background: linear-gradient(180deg, #ecfdf5 0%, #f8fafc 100%);
  border-color: #6ee7b7;
}
.org-prog-card.is-error {
  background: linear-gradient(180deg, #fef2f2 0%, #fff 100%);
  border-color: #fca5a5;
}
.org-prog-card.is-stopped {
  background: linear-gradient(180deg, #fffbeb 0%, #fff 100%);
  border-color: #fcd34d;
}
.job-pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 700;
  border-radius: 99px !important; padding: 4px 10px !important;
}
.job-pill.is-running { background: #034a70 !important; border-color: #FFCB2B !important; color: #FFCB2B !important; }
.job-pill.is-done { background: #065f46 !important; border-color: #6ee7b7 !important; color: #ecfdf5 !important; }
.job-pill.is-error, .job-pill.is-offline { background: #991b1b !important; border-color: #FF8964 !important; color: #fee2e2 !important; }
.job-pill.is-stopped { background: #944E08 !important; border-color: #FFA611 !important; color: #fff4d8 !important; }
.btn.is-busy { opacity: .78; cursor: wait !important; }

/* Modal & Toast */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(15,23,42,.55); z-index: 100;
  display: none; align-items: center; justify-content: center; padding: 16px;
}
.modal-backdrop.show { display: flex; }
.modal {

  max-height: 90vh; display: flex; flex-direction: column; box-shadow: var(--shadow-lg);
}
.modal.wide { max-width: 1120px; }
.modal-head { padding: 13px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 700; font-size: 15px; }

.modal-body { padding: 16px; overflow-y: auto; flex: 1; }

#toast {

.wa-dropzone {

}

}
.wa-thumb-icon {
  width: 56px; height: 56px; border-radius: 8px; border: 1px solid var(--border);

}

.dup-group-card {

  margin-bottom: 14px; overflow: hidden; box-shadow: var(--shadow-sm);
}
.dup-group-head {

}

}

}

.dup-preview-box {
  width: 100%; height: 150px; border-radius: 8px; overflow: hidden;

}
.dup-preview-img { width: 100%; height: 100%; object-fit: contain; background: #f1f5f9; }
.dup-sim-chip {

/* Smart Taskbar (v10.13.0 — Option C Hybrid: Notion Side Peek + ClickUp Tray + Ctrl+K) */
body.has-taskbar .main { padding-bottom: 64px; }
body.has-taskbar #toast { bottom: 56px; }
.smart-taskbar {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 65;
  background: linear-gradient(90deg, #04283d 0%, #035D89 54%, #034569 100%);

.tb-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }

}
.tb-btn {

}
.tb-btn:hover { background: rgba(255,255,255,.2); }
.tb-btn.tb-primary {

}

.tb-btn.tb-accent {
  background: rgba(255,166,17,.22); border-color: var(--brand-amber); color: #fff;
}
.tb-pin-chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(5,155,229,.26); border: 1px solid rgba(255,203,43,.52);

  max-width: 195px; cursor: pointer; transition: .15s;
}
.tb-pin-chip:hover { background: rgba(5,155,229,.45); }
.tb-pin-lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; }

.tb-empty-hint { font-size: 11px; color: rgba(255,255,255,.68); white-space: nowrap; }
.tb-kbd {

}
.tb-restore-fab {

}
.task-peek-backdrop.show { display: block; }

.tp-tab {

.tp-tab.active {

}

.tp-card {

}
.tp-card.is-urgent { border-right-color: var(--brand-coral); background: var(--coral-soft); }
.tp-card.is-done { opacity: .66; border-right-color: var(--green); background: var(--surface-2); }
.tp-card.is-done .tp-title { text-decoration: line-through; }
.tp-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
.tp-title { font-weight: 700; font-size: 13px; color: var(--text); word-break: break-word; }
.tp-meta { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; font-size: 11.5px; color: var(--text-muted); }
.tp-acts { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }

/* Ctrl+K Command Palette */
.cmd-backdrop {
  position: fixed; inset: 0; z-index: 130; background: rgba(4,40,61,.5);
  display: none; align-items: flex-start; justify-content: center; padding: 9vh 14px 14px;
}
.cmd-backdrop.show { display: flex; }
.cmd-box {
  width: 100%; max-width: 620px; background: var(--surface); border-radius: 12px;
  border: 2px solid var(--brand-amber); box-shadow: var(--shadow-lg); overflow: hidden;
  display: flex; flex-direction: column; max-height: 76vh;
}
.cmd-top {
  padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px;
}
.cmd-input {
  flex: 1; border: none; outline: none; font-size: 14.5px; font-weight: 600; background: transparent; color: var(--text);
}
.cmd-list { overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 3px; }
.cmd-sec { font-size: 11px; font-weight: 700; color: var(--text-soft); padding: 6px 8px 2px; }
.cmd-item {
  width: 100%; text-align: right; border: 1px solid transparent; background: transparent;
  border-radius: 8px; padding: 8px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.cmd-item:hover, .cmd-item.is-active {
  background: var(--primary-soft); border-color: var(--primary); color: var(--primary-hover);
}
.cmd-foot {
  padding: 7px 12px; border-top: 1px solid var(--border); background: var(--surface-2);
  font-size: 11.5px; color: var(--text-soft); display: flex; justify-content: space-between; gap: 8px;
}

@media (max-width: 1024px) {
  .shell, .shell.sb-collapsed { grid-template-columns: 1fr; }
  .sidebar, .sidebar.is-collapsed { position: static; max-height: none; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 5px; padding: 10px 12px; border-left: none; border-bottom: 1px solid var(--border); }
  .sidebar-toggle-bar { width: 100%; margin-bottom: 2px; padding-bottom: 6px; }
  .sidebar.is-collapsed .sidebar-toggle-bar { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .sidebar.is-collapsed .sidebar-collapse-btn { width: 100%; height: auto; padding: 5px 9px; }
  .sidebar.is-collapsed .sb-lbl { display: inline; }
  .sidebar.is-collapsed .nav-btn,
  .sidebar.is-collapsed .nav-group-body,
  .sidebar.is-collapsed .sidebar-footer,
  .sidebar.is-collapsed .nav-group-sep,
  .sidebar.is-collapsed .sb-mini-sections { display: none !important; }
  .sidebar .nav-btn { width: auto; height: auto; padding: 6px 10px; font-size: 12.5px; border: 1px solid var(--border); background: var(--surface-2); }
  .sidebar .nav-btn.active { border-color: var(--primary); background: var(--primary-soft); border-right: 1px solid var(--primary); box-shadow: none; }
  .sidebar .nav-group-title, .sidebar .nav-group-hdr { width: 100%; margin-top: 4px; }
  .sidebar .nav-group-body { flex-direction: row; flex-wrap: wrap; gap: 5px; width: 100%; }
  .sidebar-footer { width: 100%; margin-top: 4px; padding-top: 6px; flex-direction: row; flex-wrap: wrap; }
  .studio-split { grid-template-columns: 1fr; }
  .studio-inspector { position: static; max-height: none; }
}
@media (max-width: 680px) {
  .main { padding: 12px 10px; }
  .grid-cards { grid-template-columns: 1fr; }
  .topbar { padding: 8px 10px; }
  .active-switcher select { min-width: 120px; max-width: 170px; }
}

<body>

  <div class="topbar-main">

      <span class="brand-ver" id="hdrVersion">v10.13.2</span>

      <select id="activeProjSelect" onchange="onSwitchActiveProject(this.value)"></select>

    <button class="tbtn start" id="btnStartWork" onclick="startWorkSync('', this)"></button>

<div class="shell" id="appShell">

  <main class="main" id="mainView">
    <div class="card" id="bootLoadingCard">Loading...</div>

</div>

<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()">

    <div class="modal-head">
      <span id="modalTitle"></span>

</div>

<div id="smartTaskbar" class="smart-taskbar" style="display:none"></div>

<aside id="taskPeekDrawer" class="task-peek-drawer" style="display:none"></aside>

  <div class="cmd-box" id="cmdPaletteBox">

      <span>⌘</span>
      <input type="text" id="cmdPaletteInput" class="cmd-input" oninput="onCommandPaletteInput(this.value)">
      <button type="button" class="btn btn-sm" onclick="closeCommandPalette()">✕</button>
    </div>
    <div class="cmd-list" id="cmdPaletteList"></div>

<script>
const __I18N_BOOT__ = /*__I18N_BUNDLE__*/null;

const S = {
  hub: null,
  pid: null,
  projDetail: null,
  view: 'hub',
  sectionId: '',
  scannerTab: 'pending',
  scannerState: null,
  decTab: 'pending',
  decSelectedId: null,
  decPreviewPage: 1,
  decPreviewTotal: 1,
  decPreviewZoom: 100,

  decPreviewReqSeq: 0,

  tasksData: null,

  taskPeekTab: 'focus',
  taskScopePid: '',
  taskShowDone: false,

  taskDraft: { title: '', project_id: '', priority: 'normal', due_date: '' },
  pinnedTray: [],
  taskbarHidden: false,
  cmdOpen: false,
  cmdQuery: '',
  cmdIdx: 0,
  cmdItems: [],

  ovSecFilter: '',

  dupScope: 'all',

  dupSubfolders: true,
  dupFilter: 'all',
  dupQuery: '',
  dupPage: 1,
  dupExecMode: 'quarantine',
  dupPlan: null,
  dupUploadProg: '',
  waJob: null,
  waPollTimer: null,
  waPollBusy: false,
  dupJob: null,
  dupPollTimer: null,
  dupPollBusy: false,
  scannerJob: null,
  scannerPollTimer: null,
  scannerPollBusy: false,
  ovJob: null,
  ovPollTimer: null,
  ovPollBusy: false,
  uiTickTimer: null,
  serverOffline: false,
  lastGlobalTask: null,
  sidebarCollapsed: (function() { try { return localStorage.getItem('sla_sidebar_collapsed') === '1'; } catch (_) { return false; } })(),
  navCollapsed: (function() {
    const rd = (k, defV) => { try { const v = localStorage.getItem(k); if (v === '1') return true; if (v === '0') return false; } catch (_) {} return defV; };
    return {
      project: rd('sla_nav_grp_project', false),
      tools: rd('sla_nav_grp_tools', false),
      sections: rd('sla_nav_grp_sections', true),
    };
  })(),
};

function t(key, vars = {}) {
  const bundle = S.i18n || {};
  const map = bundle.strings || {};
  const entry = map[key];
  if (!entry) return key;
  const st = bundle.active_style || bundle.default_style || 'msa';
  let txt = String(entry[st] || entry.msa || key);
  for (const [k, v] of Object.entries(vars || {})) {
    txt = txt.split('{' + k + '}').join(String(v == null ? '' : v));
  }
  return txt;
}

async function ensureI18nLoaded(styleOverride = '') {
  if (S.i18n && S.i18n.strings && Object.keys(S.i18n.strings).length && !styleOverride) return;
  try {
    const qs = styleOverride ? ('?style=' + encodeURIComponent(styleOverride)) : '';
    const res = await fetch('/api/i18n' + qs);
    const data = await res.json();
    if (data && data.strings) {
      S.i18n = {
        default_style: data.default_style || 'msa',
        active_style: data.active_style || styleOverride || 'msa',
        strings: data.strings,
      };
    }
  } catch (_) {}
}

function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function jsStr(v) {
  return esc(
    JSON.stringify(String(v == null ? '' : v))
      .replace(/\u2028/g, '\\u2028')
      .replace(/\u2029/g, '\\u2029')
  );
}
function fmtKwd(v) {
  const n = Number(v || 0);
  const num = isFinite(n) ? n.toLocaleString('en-US', { minimumFractionDigits: 3, maximumFractionDigits: 3 }) : '0.000';
  return t('common.kwd_unit', { amount: num });
}
function colLetter(n) {
  let s = '', c = Number(n);
  while (c > 0) { const m = (c - 1) % 26; s = String.fromCharCode(65 + m) + s; c = Math.floor((c - 1) / 26); }
  return s || 'A';
}
function toast(msg, kind = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = kind === 'err' ? 'err' : (kind === 'warn' ? 'warn' : 'ok');
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, 4200);
}
function openModal(title, bodyHtml, footHtml = '', wide = false) {
  document.getElementById('modalTitle').innerHTML = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalFoot').innerHTML = footHtml;
  document.getElementById('modalBox').className = wide ? 'modal wide' : 'modal';
  document.getElementById('modalBackdrop').classList.add('show');
}
function closeModal() {
  const modalBox = document.getElementById('modalBox');
  if (modalBox) {
    modalBox.querySelectorAll('.doc-viewer-fs').forEach(el => el.classList.remove('doc-viewer-fs'));
  }
  if (S.docPreview && S.docPreview.blobUrl) {
    try { URL.revokeObjectURL(S.docPreview.blobUrl); } catch (_) {}
    S.docPreview.blobUrl = '';
  }
  S.logMapFullscreen = false;
  document.getElementById('modalBackdrop').classList.remove('show');
}

function toggleDocViewerFullscreen(boxId, btnId) {
  const box = document.getElementById(boxId);
  if (!box) return;
  const on = !box.classList.contains('doc-viewer-fs');
  box.classList.toggle('doc-viewer-fs', on);
  if (boxId === 'studioCanvasBox') S.studioFullscreen = on;
  if (boxId === 'logMapperViewer') S.logMapFullscreen = on;
  const btn = btnId ? document.getElementById(btnId) : null;
  if (btn) {
    btn.innerHTML = on ? `🗗 ${esc(t('viewer.collapse_btn'))}` : `⛶ ${esc(t('viewer.expand_btn'))}`;
  }
}

function stepDocViewerZoom(scope, delta) {
  if (scope === 'studio') {
    S.studioZoom = delta === 0 ? 100 : Math.min(200, Math.max(50, (S.studioZoom || 100) + delta));
    paintStudio();
    return;
  }
  if (scope === 'issue') {
    S.issuePreviewZoom = delta === 0 ? 100 : Math.min(200, Math.max(50, (S.issuePreviewZoom || 100) + delta));
    const lbl = document.getElementById('issuePreviewZoomLbl');
    if (lbl) lbl.textContent = `${S.issuePreviewZoom}%`;
    const sc = document.getElementById('issuePreviewScroll');
    if (sc) {
      const stage = sc.querySelector('.xl-stage, .docx-a4, .docx-pages-wrap');
      if (stage) stage.style.transform = `scale(${S.issuePreviewZoom / 100})`;
    }
    return;
  }
  if (scope === 'logmap') {
    S.logMapZoom = delta === 0 ? 100 : Math.min(200, Math.max(50, (S.logMapZoom || 100) + delta));
    const lbl = document.getElementById('logMapZoomLbl');
    if (lbl) lbl.textContent = `${S.logMapZoom}%`;
    const tbl = document.querySelector('#logMapperScroll table.dtbl');
    if (tbl) tbl.style.fontSize = `${Math.round(12.5 * (S.logMapZoom / 100) * 10) / 10}px`;
  }
}

window.addEventListener('keydown', ev => {
  if ((ev.ctrlKey || ev.metaKey) && String(ev.key || '').toLowerCase() === 'k') {
    ev.preventDefault();
    if (S.cmdOpen) closeCommandPalette();
    else openCommandPalette();
    return;
  }
  if (S.cmdOpen) {
    if (ev.key === 'Escape') { ev.preventDefault(); closeCommandPalette(); return; }
    if (ev.key === 'ArrowDown') { ev.preventDefault(); stepCommandSelection(1); return; }
    if (ev.key === 'ArrowUp') { ev.preventDefault(); stepCommandSelection(-1); return; }
    if (ev.key === 'Enter') { ev.preventDefault(); runSelectedCommand(); return; }
  }
  if (ev.key === 'Escape') {
    const fsEls = document.querySelectorAll('.doc-viewer-fs');
    if (fsEls.length) {
      fsEls.forEach(el => {
        el.classList.remove('doc-viewer-fs');
        if (el.id === 'studioCanvasBox') S.studioFullscreen = false;
        if (el.id === 'logMapperViewer') S.logMapFullscreen = false;
      });
      const b1 = document.getElementById('studioFsBtn');
      if (b1) b1.innerHTML = `⛶ ${esc(t('viewer.expand_btn'))}`;
      const b2 = document.getElementById('issuePreviewFsBtn');
      if (b2) b2.innerHTML = `⛶ ${esc(t('viewer.expand_btn'))}`;
      const b3 = document.getElementById('logMapFsBtn');
      if (b3) b3.innerHTML = `⛶ ${esc(t('viewer.expand_btn'))}`;
      return;
    }
    const mb = document.getElementById('modalBackdrop');
    if (mb && mb.classList.contains('show')) {
      closeModal();
      return;
    }
    if (S.taskPeekOpen) {
      toggleTaskPeek(false);
    }
  }
});

function openConfirmModal(msg, okLabel, onConfirm) {
  window.__confirmCb = async (btnEl) => {
    await withBusyButton(btnEl, async () => {
      await onConfirm();
      closeModal();
    });
  };
  openModal(
    esc(t('common.confirm_title')),
    `<p>${esc(msg)}</p>`,
    `<button class="btn" onclick="closeModal()">${esc(t('common.cancel_confirm'))}</button>
     <button class="btn btn-danger" onclick="window.__confirmCb(this)">${esc(okLabel)}</button>`
  );
}

async function api(path, opts = {}) {
  const fetchOpts = { method: opts.method || (opts.body ? 'POST' : 'GET'), headers: {} };
  if (opts.body !== undefined) {
    fetchOpts.headers['Content-Type'] = 'application/json';
    fetchOpts.body = JSON.stringify(opts.body);
  }
  const timeoutMs = Number(opts.timeoutMs || 180000);
  const ctrl = (typeof AbortController !== 'undefined' && timeoutMs > 0) ? new AbortController() : null;
  let tId = null;
  if (ctrl) {
    fetchOpts.signal = ctrl.signal;
    tId = setTimeout(() => ctrl.abort(), timeoutMs);
  }
  let res;
  try {
    res = await fetch(path, fetchOpts);
  } catch (netErr) {
    if (tId) clearTimeout(tId);
    if (netErr && netErr.name === 'AbortError') {
      const te = new Error(t('jobs.timeout_error'));
      te.isTimeout = true;
      throw te;
    }
    S.serverOffline = true;
    try { renderTopbar(); updateGlobalActivityBar(); } catch (_) {}
    const oe = new Error(t('jobs.offline_error'));
    oe.isOffline = true;
    throw oe;
  }
  if (tId) clearTimeout(tId);
  if (S.serverOffline) {
    S.serverOffline = false;
    try { renderTopbar(); } catch (_) {}
  }
  let data = {};
  try { data = await res.json(); } catch (_) { data = { ok: false, error: t('common.error_generic') }; }
  if (!res.ok || data.ok === false) {
    const err = new Error(data.error || t('common.error_generic'));
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

function _jobTitle(scope, kind) {
  if (scope === 'duplicates' || scope === 'dup') {
    return t(kind === 'execute' ? 'jobs.kind_dup_exec' : 'jobs.kind_dup_scan');
  }
  if (scope === 'whatsapp' || scope === 'wa') {
    if (kind === 'ai_rename') return t('jobs.kind_wa_ai');
    if (kind === 'execute') return t('jobs.kind_wa_exec');
    return t('jobs.kind_wa_scan');
  }
  if (scope === 'organizer' || scope === 'org') {
    if (kind === 'execute') return t('jobs.kind_org_exec');
    if (kind === 'ai_rename') return t('jobs.kind_org_ai');
    return t('jobs.kind_org_scan');
  }
  if (scope === 'scanner') return t('jobs.kind_scanner');
  if (scope === 'overview' || kind === 'inbox_sync') return t('jobs.kind_inbox_sync');
  return t('jobs.running_badge');
}

function _jobPhaseLabel(phase) {
  const map = {
    walking: 'jobs.phase_walking',
    extracting: 'jobs.phase_extracting',
    hashing: 'jobs.phase_hashing',
    analyzing: 'jobs.phase_analyzing',
    comparing: 'jobs.phase_comparing',
    executing: 'jobs.phase_executing',
    ai_renaming: 'jobs.phase_ai_renaming',
    scanning: 'jobs.phase_scanning',
    uploading: 'jobs.phase_uploading',
  };
  return map[phase] ? t(map[phase]) : String(phase || '');
}

function _computeElapsedSec(job) {
  if (!job) return 0;
  if (job.running && job.started_ts) {
    return Math.max(0, Math.floor((Date.now() / 1000) - Number(job.started_ts)));
  }
  return Math.max(0, Number(job.elapsed_seconds || 0));
}

function _formatJobDoneSummary(scope, job) {
  const sm = (job && (job.summary || job.last_summary)) || {};
  const el = _fmtElapsed(_computeElapsedSec(job));
  if (scope === 'duplicates' || scope === 'dup') {
    if (job.kind === 'execute') {
      return t('dups.exec_done_toast', { count: sm.processed || 0, saved: sm.saved_label || '0 B' }) + ` · ${el}`;
    }
    const c = sm.counts || {};
    return t('dups.scan_done_toast', { groups: c.groups ?? sm.groups_count ?? 0, total: c.total_files_scanned ?? sm.total_files_scanned ?? 0 }) + ` · ${el}`;
  }
  if (scope === 'whatsapp' || scope === 'wa') {
    if (job.kind === 'execute') {
      return t('wa.exec_done_toast', { count: (sm.renamed || 0) + (sm.copied || 0) }) + ` · ${el}`;
    }
    if (job.kind === 'ai_rename') {
      if ((sm.total_targets || 0) === 0) return t('wa.ai_none_toast');
      return t('wa.ai_done_toast', { updated: sm.updated || 0, total: sm.processed || sm.total_targets || 0 }) + ` · ${el}`;
    }
    const c = sm.counts || {};
    return t('wa.scan_done_toast', { total: c.total || 0, matched: c.matched || 0 }) + ` · ${el}`;
  }
  if (scope === 'organizer' || scope === 'org') {
    if (job.kind === 'execute') return t('organizer.exec_done_toast', { copied: sm.copied || 0 }) + ` · ${el}`;
    if (job.kind === 'ai_rename') {
      if ((sm.total_targets || 0) === 0) return t('organizer.ai_none_msg');
      return t('organizer.ai_done_msg', { updated: sm.updated || 0, total: sm.processed || sm.total_targets || 0 }) + ` · ${el}`;
    }
    return t('organizer.scan_done_toast', { total: sm.total || 0 }) + ` · ${el}`;
  }
  if (scope === 'scanner') {
    return t('scanner.scanned_toast', { count: sm.added ?? 0 }) + ` · ${el}`;
  }
  if (scope === 'overview') {
    return t('overview.scan_done_toast', { archived: sm.archived || 0, pending: sm.pending_decisions || 0 }) + ` · ${el}`;
  }
  return t('jobs.summary_done_generic', { elapsed: el });
}

function _renderUnifiedJobHtml(scope, job, opts = {}) {
  if (!job) return '';
  const phase = String(job.phase || '');
  const isRunning = Boolean(job.running);
  const isDone = !isRunning && phase === 'done';
  const isErr = !isRunning && phase === 'error';
  const isStopped = !isRunning && phase === 'stopped';
  if (!isRunning && !isDone && !isErr && !isStopped) return '';

  const title = opts.title || _jobTitle(scope, job.kind || '');
  const elapsed = _fmtElapsed(_computeElapsedSec(job));

  if (isRunning) {
    const isOrgScan = scope === 'organizer' && job.kind === 'scan';
    const total = Number(job.total || 0);
    const curVal = Number(isOrgScan ? (job.scanned || 0) : (job.processed || 0));
    const discovered = Number(job.discovered != null ? job.discovered : (total || curVal || 0));
    const pct = total > 0 ? Math.min(100, Math.round((curVal / total) * 100)) : 0;
    const barHtml = total > 0
      ? `<div class="org-bar-track"><div class="org-bar-fill" style="width:${pct}%"></div></div>`
      : `<div class="org-bar-track"><div class="org-bar-indet"></div></div>`;
    const phLbl = _jobPhaseLabel(phase || 'scanning');
    const stopBtn = opts.canStop !== false
      ? `<button type="button" class="btn btn-danger btn-sm" onclick="stopScopedJob(${jsStr(scope)}, this)">⏹ ${esc(t('jobs.stop_btn'))}</button>`
      : '';
    const extraOrg = isOrgScan ? `
        <div class="org-kpi">
          <div class="ok-lbl">${esc(t('organizer.stat_folders'))}</div>
          <div class="ok-val ltr">${Number(job.folders_scanned || 0).toLocaleString()}</div>
        </div>` : '';
    const updatedKpi = (job.kind === 'ai_rename') ? `
        <div class="org-kpi">
          <div class="ok-lbl">${esc(t('organizer.ai_renamed_badge'))}</div>
          <div class="ok-val ltr">${Number(job.updated || 0).toLocaleString()}</div>
        </div>` : '';
    return `
      <div class="org-prog-card" data-job-scope="${esc(scope)}" data-started-ts="${Number(job.started_ts || 0)}">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <strong>⏳ ${esc(title)}</strong>
            <span class="pill pill-green"><span class="org-pulse-dot"></span>${esc(t('jobs.running_badge'))}${phLbl ? ` — ${esc(phLbl)}` : ''}</span>
          </div>
          ${stopBtn}
        </div>
        ${barHtml}
        <div class="org-kpis">
          ${discovered > 0 ? `<div class="org-kpi"><div class="ok-lbl">${esc(t('jobs.stat_discovered'))}</div><div class="ok-val ltr">${discovered.toLocaleString()}</div></div>` : ''}
          ${extraOrg}
          ${total > 0 ? `<div class="org-kpi"><div class="ok-lbl">${esc(t('jobs.stat_progress'))}</div><div class="ok-val ltr">${curVal.toLocaleString()} / ${total.toLocaleString()} (${pct}%)</div></div>` : ''}
          ${updatedKpi}
          <div class="org-kpi">
            <div class="ok-lbl">${esc(t('jobs.stat_elapsed'))}</div>
            <div class="ok-val ltr" data-job-elapsed="1">⏱ ${esc(elapsed)}</div>
          </div>
        </div>
        ${job.current_file ? `<div class="org-cur-line"><span>${esc(t('jobs.current_file'))}:</span><span class="org-cur-file ltr">${esc(job.current_file)}</span></div>` : ''}
      </div>`;
  }

  if (isErr) {
    return `
      <div class="org-prog-card is-error" data-job-scope="${esc(scope)}">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <strong>❌ ${esc(title)}</strong>
            <span class="pill pill-red">${esc(t('jobs.error_badge'))}</span>
            <span class="pill pill-gray ltr">⏱ ${esc(elapsed)}</span>
          </div>
          <button type="button" class="btn btn-sm" onclick="dismissScopedJob(${jsStr(scope)})">✕ ${esc(t('jobs.dismiss_btn'))}</button>
        </div>
        <div style="margin-top:7px;font-size:13px;font-weight:600;color:#991b1b">${esc(job.error || t('common.error_generic'))}</div>
      </div>`;
  }

  if (isStopped) {
    return `
      <div class="org-prog-card is-stopped" data-job-scope="${esc(scope)}">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <strong>⏹ ${esc(title)}</strong>
            <span class="pill pill-amber">${esc(t('jobs.stopped_badge'))}</span>
            <span class="pill pill-gray ltr">⏱ ${esc(elapsed)}</span>
          </div>
          <button type="button" class="btn btn-sm" onclick="dismissScopedJob(${jsStr(scope)})">✕ ${esc(t('jobs.dismiss_btn'))}</button>
        </div>
        <div class="sub" style="margin-top:6px">${esc(t('jobs.summary_stopped'))}</div>
      </div>`;
  }

  // Done
  const msgDone = opts.doneText || _formatJobDoneSummary(scope, job);
  return `
    <div class="org-prog-card is-done" data-job-scope="${esc(scope)}">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <strong>✅ ${esc(title)}</strong>
          <span class="pill pill-green">${esc(t('jobs.done_badge'))}</span>
          <span class="pill pill-gray ltr">⏱ ${esc(elapsed)}</span>
        </div>
        <button type="button" class="btn btn-sm" onclick="dismissScopedJob(${jsStr(scope)})">✕ ${esc(t('jobs.dismiss_btn'))}</button>
      </div>
      <div style="margin-top:6px;font-size:13px;font-weight:600;color:#065f46">${esc(msgDone)}</div>
    </div>`;
}

function _ensureLiveTick() {
  const anyRunning = Boolean(
    (S.dupJob && S.dupJob.running) ||
    (S.waJob && S.waJob.running) ||
    (S.orgPlan && S.orgPlan.job && S.orgPlan.job.running) ||
    (S.scannerJob && S.scannerJob.running) ||
    (S.ovJob && S.ovJob.running) ||
    (S.hub && Array.isArray(S.hub.active_jobs) && S.hub.active_jobs.length)
  );
  if (anyRunning) {
    if (!S.uiTickTimer) {
      S.uiTickTimer = setInterval(() => {
        document.querySelectorAll('[data-started-ts]').forEach(card => {
          const ts = Number(card.getAttribute('data-started-ts') || 0);
          if (!ts) return;
          const elNode = card.querySelector('[data-job-elapsed]');
          if (elNode) elNode.textContent = '⏱ ' + _fmtElapsed(Math.max(0, Math.floor(Date.now() / 1000 - ts)));
        });
        updateGlobalActivityBar();
      }, 1000);
    }
  } else if (S.uiTickTimer) {
    clearInterval(S.uiTickTimer);
    S.uiTickTimer = null;
  }
}

function _pickGlobalDisplayJob() {
  const localCandidates = [
    { scope: 'duplicates', job: S.dupJob },
    { scope: 'whatsapp', job: S.waJob },
    { scope: 'organizer', job: S.orgPlan && S.orgPlan.job },
    { scope: 'scanner', job: S.scannerJob },
    { scope: 'overview', job: S.ovJob },
  ];
  for (const c of localCandidates) {
    if (c.job && c.job.running) return c;
  }
  const hubRunning = (S.hub && Array.isArray(S.hub.active_jobs)) ? S.hub.active_jobs.find(j => j.running) : null;
  if (hubRunning) return { scope: hubRunning.scope || 'overview', job: hubRunning };
  for (const c of localCandidates) {
    if (c.job && (c.job.phase === 'error' || c.job.phase === 'done' || c.job.phase === 'stopped')) return c;
  }
  return S.lastGlobalTask;
}

function updateGlobalActivityBar() {
  const pill = document.getElementById('hdrGlobalActivity');
  if (!pill) return;
  if (S.serverOffline) {
    pill.style.display = 'inline-flex';
    pill.className = 'tbtn job-pill is-offline';
    pill.innerHTML = `🔴 ${esc(t('jobs.offline_badge'))}`;
    return;
  }
  const cur = _pickGlobalDisplayJob();
  if (!cur || !cur.job) {
    pill.style.display = 'none';
    return;
  }
  const j = cur.job;
  const lbl = _jobTitle(cur.scope, j.kind || '');
  if (j.running) {
    const isOrgScan = cur.scope === 'organizer' && j.kind === 'scan';
    const doneN = Number(isOrgScan ? (j.scanned || 0) : (j.processed || 0));
    const totN = Number(j.total || 0);
    const pctTxt = totN > 0 ? `${Math.min(100, Math.round((doneN / totN) * 100))}%` : _fmtElapsed(_computeElapsedSec(j));
    pill.style.display = 'inline-flex';
    pill.className = 'tbtn job-pill is-running';
    pill.innerHTML = `<span class="org-pulse-dot" style="margin:0"></span> ${esc(t('jobs.topbar_running', { label: lbl, pct: pctTxt }))}`;
    pill.dataset.navScope = cur.scope;
    return;
  }
  if (j.phase === 'error') {
    pill.style.display = 'inline-flex';
    pill.className = 'tbtn job-pill is-error';
    pill.textContent = '❌ ' + t('jobs.topbar_err', { label: lbl });
    pill.dataset.navScope = cur.scope;
    return;
  }
  if (j.phase === 'done') {
    pill.style.display = 'inline-flex';
    pill.className = 'tbtn job-pill is-done';
    pill.textContent = '✅ ' + t('jobs.topbar_done', { label: lbl });
    pill.dataset.navScope = cur.scope;
    return;
  }
  if (j.phase === 'stopped') {
    pill.style.display = 'inline-flex';
    pill.className = 'tbtn job-pill is-stopped';
    pill.textContent = '⏹ ' + lbl;
    pill.dataset.navScope = cur.scope;
    return;
  }
  pill.style.display = 'none';
}

      if (scope === 'organizer') {

      } else if (scope === 'duplicates') {

async function withBusyButton(btnEl, fn) {
  const b = (btnEl && btnEl.nodeType === 1) ? btnEl : null;
  if (b && (b.disabled || b.classList.contains('is-busy'))) return;
  const origHtml = b ? b.innerHTML : '';
  const origDis = b ? b.disabled : false;
  const origMinW = b ? b.style.minWidth : '';
  if (b) {
    const curW = Math.round(b.getBoundingClientRect().width || b.offsetWidth || 0);
    if (curW > 0) b.style.minWidth = curW + 'px';
    b.disabled = true;
    b.classList.add('is-busy');
    b.innerHTML = (curW > 0 && curW < 68) ? '⏳' : ('⏳ ' + esc(t('jobs.busy_wait')));
  }
  try {
    return await fn();
  } finally {
    if (b) {
      b.disabled = origDis;
      b.classList.remove('is-busy');
      b.innerHTML = origHtml;
      b.style.minWidth = origMinW;
    }
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => {
      const s = String(fr.result || '');
      const i = s.indexOf(',');
      resolve(i >= 0 ? s.slice(i + 1) : s);
    };
    fr.onerror = () => reject(new Error(t('common.file_read_failed', { name: file.name })));
    fr.readAsDataURL(file);
  });
}

function statusPill(st) {
  const s = String(st || '').trim();
  const sl = s.toLowerCase();
  if (!s) return '<span class="pill pill-gray">—</span>';
  if (s === 'A' || (sl.includes('approved') && !sl.includes('note') && !sl.includes('(c)')) || sl.includes('\u0645\u0639\u062a\u0645\u062f') || sl.includes('\u062a\u0645 \u0627\u0644\u0631\u062f') || sl.includes('replied')) {
    return `<span class="pill pill-green">${esc(s)}</span>`;
  }
  if (s === 'B' || sl.includes('note') || sl.includes('(c)')) {
    return `<span class="pill pill-teal">${esc(s)}</span>`;
  }
  if (sl.includes('withdraw') || sl.includes('cancel')) {
    return `<span class="pill pill-gray">${esc(s)}</span>`;
  }
  if (s === 'C' || s === 'D' || sl.includes('reject') || sl.includes('revise')) {
    return `<span class="pill pill-red">${esc(s)}</span>`;
  }
  if (sl.includes('under') || sl.includes('review') || sl.includes('pend') || sl.includes('\u0627\u0646\u062a\u0638\u0627\u0631')) {
    return `<span class="pill pill-amber">${esc(s)}</span>`;
  }
  return `<span class="pill pill-blue">${esc(s)}</span>`;
}

async function refreshHub(silent = false) {
  try {
    await ensureI18nLoaded();
    S.hub = await api('/api/state');
    if (S.hub && S.hub.ui_style && S.i18n && S.i18n.active_style !== S.hub.ui_style) {
      await ensureI18nLoaded(S.hub.ui_style);
    }
    if (!S.pid && S.hub.active_project_id) S.pid = S.hub.active_project_id;
    const pidValid = S.pid && S.hub.projects.some(p => p.id === S.pid);
    if (S.pid && !pidValid) {
      S.pid = S.hub.active_project_id || (S.hub.projects[0] && S.hub.projects[0].id) || null;
      S.projDetail = null;
    }
    const busyTyping = silent && _isUserTypingOrPicking();
    if (!busyTyping) {
      applyStaticI18n();
      renderTopbar();
      renderSidebar();
      renderTaskbar();
    } else {
      const cntEl = document.getElementById('tbTodayCount');
      if (cntEl) cntEl.textContent = String(_taskBadgeTotal());
    }
    const dr = document.getElementById('taskPeekDrawer');
    const inDrawer = dr && document.activeElement && dr.contains(document.activeElement);
    if (S.taskPeekOpen && !(silent && inDrawer)) {
      loadTasksData(true);
    }
    updateGlobalActivityBar();
    _ensureLiveTick();
  } catch (e) {
    if (!silent) toast(e.message, 'err');
  }
}

    const disAttr = p.enabled === false ? 'disabled' : '';
    const disTag = p.enabled === false ? ` (${t('hub.disabled_badge')})` : '';
    opts += `<option value="${esc(p.id)}" ${selAttr} ${disAttr}>[${esc(p.code)}] ${esc(p.name)}${esc(disTag)}</option>`;
  }
  sel.innerHTML = opts;

  const activeCard = h.projects.find(p => p.id === h.active_project_id);
  const isDry = Boolean((h.settings && h.settings.dry_run) || (activeCard && activeCard.dry_run));
  document.getElementById('hdrDryRun').style.display = isDry ? 'inline-flex' : 'none';

  const aiEl = document.getElementById('hdrAiStatus');
  const hasAi = Boolean(h.ai_status && h.ai_status.has_key) || (h.settings && h.settings.engine === 'ollama');
  aiEl.className = 'ai-pill' + (hasAi ? ' on' : '');
  aiEl.textContent = hasAi ? ('● ' + t('topbar.ai_on')) : ('○ ' + t('topbar.ai_off'));

  const wb = document.getElementById('btnWatcher');
  if (h.watcher_running) {
    wb.className = 'tbtn watch-on';
    wb.textContent = '👁 ' + t('topbar.scanner_on');
  } else {
    wb.className = 'tbtn';
    wb.textContent = '👁 ' + t('topbar.scanner_off');
  }

  const strip = document.getElementById('globalWarnStrip');
  const warns = [];
  if (S.serverOffline) {
    warns.push(`🔴 ${esc(t('jobs.offline_error'))}`);
  }
  if (h.pymupdf_available === false) {
    warns.push(`⚠️ ${esc(t('watcher.pymupdf_missing'))}`);
  }
  if (h.watcher_last_error && h.watcher_last_error.message) {
    warns.push(`⚠️ ${esc(t('overview.scan_errors_title'))}: ${esc(h.watcher_last_error.message)}`);
  }
  for (const sw of (h.shared_inbox_warnings || [])) {
    warns.push(`⚠️ ${esc(sw.message || '')}`);
  }
  for (const bw of (h.stale_backup_warnings || [])) {
    warns.push(`🛡️ ${esc(typeof bw === 'string' ? bw : (bw.message || ''))}`);
  }
  if (warns.length) {
    strip.innerHTML = warns.map(w => `<div class="warn-item">${w}</div>`).join('');
    strip.classList.add('show');
  } else {
    strip.innerHTML = '';
    strip.classList.remove('show');
  }
  updateGlobalActivityBar();
  _ensureLiveTick();
  requestAnimationFrame(_syncTopbarHeight);
}

async function navigate(view, arg = '') {
  S.view = view;
  if (view === 'section' && S.navCollapsed) {
    S.navCollapsed.sections = false;
  }
  if (view !== 'studio') S.studioFullscreen = false;
  if (view !== 'organizer' && S.orgPollTimer) { clearInterval(S.orgPollTimer); S.orgPollTimer = null; S.orgPollBusy = false; }
  if (view !== 'duplicates' && S.dupPollTimer) { clearInterval(S.dupPollTimer); S.dupPollTimer = null; S.dupPollBusy = false; }
  if (view !== 'whatsapp' && S.waPollTimer) { clearInterval(S.waPollTimer); S.waPollTimer = null; S.waPollBusy = false; }
  if (view !== 'scanner' && S.scannerPollTimer) { clearInterval(S.scannerPollTimer); S.scannerPollTimer = null; S.scannerPollBusy = false; }
  if (view !== 'overview' && S.ovPollTimer) { clearInterval(S.ovPollTimer); S.ovPollTimer = null; S.ovPollBusy = false; }
  if (view === 'section') S.sectionId = arg;
  if (arg && (view === 'overview' || view === 'scanner' || view === 'organizer' || view === 'whatsapp' || view === 'duplicates')) S.pid = arg;
  renderSidebar();
  const mv = document.getElementById('mainView');
  try {
    if (view === 'hub') return renderHubView();
    if (view === 'search') return await renderSearchView();
    if (view === 'decisions') return await renderDecisionsView();
    if (view === 'settings') return await renderSettingsView();
    if (!S.pid) {
      mv.innerHTML = `<div class="card"><p>${esc(t('topbar.need_project_first'))}</p><button class="btn btn-primary" onclick="openNewProjectModal()">+ ${esc(t('hub.new_project'))}</button></div>`;
      return;
    }
    if (view === 'overview') return await renderOverviewView();
    if (view === 'scanner') return await renderScannerView();
    if (view === 'organizer') return await renderOrganizerView();
    if (view === 'whatsapp') return await renderWhatsappView();
    if (view === 'duplicates') return await renderDuplicatesView();
    if (view === 'logs') return await renderLogsView();
    if (view === 'templates') return await renderTemplatesView();
    if (view === 'studio') return await renderStudioView(arg || S.studioTpl);
    if (view === 'section') return await renderSectionView(S.sectionId);
  } catch (e) {
    if (e.status === 404) {
      const oldPid = S.pid;
      await refreshHub(true);
      if (S.pid && S.pid !== oldPid) {
        try { return await navigate(view === 'section' ? 'overview' : view); } catch (_) {}
      }
      if (!S.pid || !(S.hub && S.hub.projects && S.hub.projects.some(p => p.id === S.pid))) {
        S.view = 'hub';
        renderSidebar();
        return renderHubView();
      }
    }
    toast(e.message, 'err');
    mv.innerHTML = `<div class="card"><div class="alert alert-red">${esc(e.message)}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="refreshHub().then(()=>navigate('overview'))">🔄 ${esc(t('common.reload_project'))}</button>
        <button class="btn" onclick="refreshHub().then(()=>navigate('hub'))">🏠 ${esc(t('common.back_to_projects'))}</button>
      </div></div>`;
  }
}

async function startWorkSync(targetPid = '', btnEl = null) {
  const pid = targetPid || S.pid || (S.hub && S.hub.active_project_id);
  if (!pid) { toast(t('topbar.need_project_first'), 'err'); return; }
  try {
    const res = await withBusyButton(btnEl, () => api(`/api/projects/${encodeURIComponent(pid)}/start`, { body: {} }));
    S.pid = pid;
    await refreshHub();
    const c = res.counters || {};
    const nextP = Object.entries(c.next_preview || {}).slice(0, 10).map(([k, v]) => `<span class="pill pill-teal ltr">${esc(v)}</span>`).join(' ');
    const discSrc = (c.is_global_disc_series && c.next_global_disc_preview) ? c.next_global_disc_preview : (c.next_disc_preview || {});
    const discP = Object.entries(discSrc).map(([k, v]) => `<span class="pill pill-blue ltr">${esc(v)}</span>`).join(' ');
    const arP = Object.entries(c.next_arabic_preview || {}).map(([k, v]) => `<span class="pill pill-purple">${esc(v)}</span>`).join(' ');
    const upLogs = res.uploaded_logs || res.logs || [];
    const logsHtml = upLogs.length
      ? upLogs.map(l => `<span class="pill pill-green">📗 ${esc(l.name)}</span>`).join(' ')
      : `<span class="pill pill-amber">${esc(t('hub.no_log_badge'))}</span>`;
    const tplCount = (res.templates && (res.templates.uploaded_count ?? res.templates.total)) || 0;
    const warns = (res.warnings || []).map(w => `<div class="alert alert-amber">${esc(w)}</div>`).join('');
    const fl = res.queue_flush || {};
    openModal(
      `▶ ${esc(t('sync.title'))} — ${esc(res.project_name || '')}`,
      `${warns}
       <div class="alert alert-green">✅ ${esc(t('sync.ready_msg'))} (${esc(t('common.docs_count', { count: c.rows_scanned || 0 }))})</div>
       <div style="margin-bottom:10px"><strong>${esc(t('sync.logs_label'))}:</strong><div style="margin-top:5px">${logsHtml}</div></div>
       ${fl.flushed ? `<div class="alert alert-blue">📥 ${esc(t('sync.flushed_msg', { count: fl.flushed }))}</div>` : ''}
       <div style="margin-bottom:10px"><strong>${esc(t('sync.next_refs_label'))}:</strong><div style="margin-top:5px;display:flex;gap:5px;flex-wrap:wrap">${nextP || '<span class="sub">—</span>'}</div></div>
       ${discP ? `<div style="margin-bottom:10px"><strong>${esc(t('sync.next_disc_label'))}:</strong><div style="margin-top:5px;display:flex;gap:5px;flex-wrap:wrap">${discP}</div></div>` : ''}
       ${arP ? `<div style="margin-bottom:10px"><strong>${esc(t('sync.next_ar_label'))}:</strong><div style="margin-top:5px;display:flex;gap:5px;flex-wrap:wrap">${arP}</div></div>` : ''}
       <div class="sub">${esc(t('overview.kpi_waiting'))}: <strong>${res.pending_decisions_count || 0}</strong> · ${esc(t('hub.stat_templates'))}: <strong>${tplCount}</strong></div>`,
      `<button class="btn" onclick="closeModal();navigate('scanner')">📥 ${esc(t('nav.scanner'))}</button>
       <button class="btn" onclick="closeModal();navigate('logs')">📗 ${esc(t('nav.logs'))}</button>
       <button class="btn btn-primary" onclick="closeModal();navigate('overview')">${esc(t('sync.open_project'))}</button>`
    );
    if (S.view !== 'hub') await navigate(S.view, S.sectionId);
    else renderHubView();
  } catch (e) { toast(e.message, 'err'); }
}

function _backupBadgeHtml(p) {
  const b = p.backup || {};
  const status = b.status || (b.stale ? 'overdue' : (b.last_backup_at ? 'ok' : 'never'));
  const days = b.days_since_backup;
  let pill = '';
  if (status === 'overdue') {
    const lbl = days != null ? t('backup.badge_overdue', { days }) : t('backup.badge_never');
    pill = `<span class="pill pill-red">⚠️ ${esc(lbl)}</span>`;
  } else if (status === 'never') {
    pill = `<span class="pill pill-amber">🛡️ ${esc(t('backup.badge_never'))}</span>`;
  } else if (days === 0) {
    pill = `<span class="pill pill-green">🛡️ ${esc(t('backup.badge_today'))}</span>`;
  } else {
    pill = `<span class="pill pill-green">🛡️ ${esc(t('backup.badge_ok', { days: days ?? 0 }))}</span>`;
  }
  const drv = b.external_backup_dir
    ? (b.external_provider === 'google_drive'
      ? `<span class="pill pill-blue">☁️ ${esc(t('backup.drive_linked'))}</span>`
      : `<span class="pill pill-teal">☁️ Drive</span>`)
    : '';
  return `${pill} ${drv}`;
}

async function confirmEndSession(pid, btnEl) {

  const incArc = document.getElementById('chkEndArc')?.checked ?? false;

  try {

      await api('/api/settings', { body: { external_backup_dir: newExtPath } });
    }
    const res = await withBusyButton(btnEl, () => api(`/api/projects/${encodeURIComponent(pid)}/end`, {
      body: { copy_external: copyExt, include_archive_external: incArc }
    }));
    if (!res) return;
    await refreshHub();
    renderHubView();
    const b = res.backup || {};
    const locked = (res.locked_files || []);
    const warns = (res.warnings || []).map(w => `<div class="alert alert-amber">${esc(w)}</div>`).join('');
    const localSnap = b.ok ? (b.snapshot_path || (b.local && (b.local.backup_dir || b.local.path)) || '') : '';
    const extCopied = Boolean(b.external && b.external.copied && (b.external.path || b.external.target_dir));
    openModal(
      `✅ ${esc(t('end_session.done_title'))} — ${esc(res.project_name || '')}`,
      `${warns}
       <div class="alert ${res.all_writes_closed ? 'alert-green' : 'alert-amber'}">

       ${extCopied ? `<p><strong>${esc(t('end_session.ext_place'))}:</strong> <code class="ltr">${esc(b.external.path || b.external.target_dir || '')}</code></p>` : ''}`,
      `<button class="btn btn-primary" onclick="closeModal()">${esc(t('common.close'))}</button>`
    );
  } catch (e) { toast(e.message, 'err'); }
}

/* ── Unified Global Search Screen (Feature 1) ───────────────────────────── */

    ? `<p class="sub" style="text-align:center;padding:24px">${esc(t('search.prompt_empty'))}</p>`
    : (!items.length

      : `<div style="margin-bottom:8px"><span class="pill pill-blue">${esc(t('search.count_label', { count: d.total || items.length }))}</span></div>
         <div class="tbl-wrap"><table class="dtbl">
           <thead><tr><th>${esc(t('search.col_project'))}</th><th>${esc(t('search.col_source'))}</th><th>${esc(t('search.col_item'))}</th><th>${esc(t('search.col_details'))}</th><th>${esc(t('table.col_date'))}</th><th>${esc(t('table.col_status'))}</th><th>${esc(t('table.col_file'))}</th></tr></thead>
